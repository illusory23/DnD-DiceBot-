{% extends "base.html" %}
{% block title %}用户管理{% endblock %}
{% block page_title %}👥 用户管理{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <span>用户列表</span>
        <span style="font-size:12px;color:var(--text-muted);" id="total-display"></span>
    </div>

    <!-- 搜索 -->
    <div class="search-box">
        <input type="text" id="search-input" placeholder="搜索用户名或邮箱...">
        <button class="btn btn-primary" id="btn-search">🔍 搜索</button>
    </div>

    <!-- 表格 -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>用户名</th>
                    <th>邮箱</th>
                    <th>角色</th>
                    <th>角色数</th>
                    <th>注册时间</th>
                    <th>最后登录</th>
                    <th>状态</th>
                    <th>权限</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="users-tbody">
                <tr><td colspan="10" class="loading">加载中...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- 分页 -->
    <div class="pagination" id="pagination"></div>
</div>

<script>
let currentPage = 1;
let currentQuery = '';

function formatLastLogin(iso) {
    if (!iso) return '<span style="color:var(--text-muted)">从未登录</span>';
    return Admin.formatDate(iso);
}

async function loadUsers(page = 1) {
    const tbody = document.getElementById('users-tbody');
    tbody.innerHTML = '<tr><td colspan="10" class="loading">加载中...</td></tr>';

    try {
        const params = new URLSearchParams({ page, per_page: 20, q: currentQuery });
        const data = await Admin.get('/admin/api/users?' + params);

        document.getElementById('total-display').textContent = `共 ${data.total} 个用户`;

        if (!data.users.length) {
            tbody.innerHTML = '<tr><td colspan="10"><div class="empty-state"><div class="empty-icon">👥</div><div class="empty-text">暂无用户</div></div></td></tr>';
            document.getElementById('pagination').innerHTML = '';
            return;
        }

        tbody.innerHTML = data.users.map(u => `
            <tr${u.is_active === false ? ' style="opacity:0.55;"' : ''}>
                <td>${u.id}</td>
                <td><a href="/admin/users/${u.id}" style="color:var(--accent);text-decoration:none;">${Admin.escHtml(u.username)}</a></td>
                <td>${Admin.escHtml(u.email)}</td>
                <td>${u.is_admin ? '<span class="badge badge-admin">管理员</span>' : '<span class="badge badge-user">用户</span>'}</td>
                <td>${u.character_count || 0}</td>
                <td>${Admin.formatDate(u.created_at)}</td>
                <td>${formatLastLogin(u.last_login)}</td>
                <td>${u.is_active === false ? '<span class="badge badge-danger">已禁用</span>' : '<span class="badge badge-success">正常</span>'}</td>
                <td>
                    <button class="btn btn-sm ${u.is_admin ? 'btn-secondary' : 'btn-primary'}"
                            onclick="toggleAdmin(${u.id}, ${u.is_admin ? 'false' : 'true'}, '${Admin.escHtml(u.username)}')">
                        ${u.is_admin ? '取消管理员' : '设为管理员'}
                    </button>
                </td>
                <td>
                    <button class="btn btn-sm ${u.is_active === false ? 'btn-primary' : 'btn-secondary'}"
                            onclick="toggleActive(${u.id}, ${u.is_active === false ? 'true' : 'false'}, '${Admin.escHtml(u.username)}')">
                        ${u.is_active === false ? '启用' : '禁用'}
                    </button>
                    <a href="/admin/users/${u.id}" class="btn btn-sm btn-secondary">详情</a>
                </td>
            </tr>
        `).join('');

        Admin.renderPagination('pagination', data.page, data.pages, (p) => {
            currentPage = p;
            loadUsers(p);
        });
    } catch (e) {
        tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;color:var(--danger);">加载失败</td></tr>';
    }
}

async function toggleAdmin(userId, isAdmin, username) {
    const action = isAdmin ? '设为管理员' : '取消管理员权限';
    const ok = await Admin.confirm('确认操作', `确定要${action}「${username}」吗？`);
    if (!ok) return;
    try {
        await Admin.put(`/admin/api/users/${userId}`, { is_admin: isAdmin });
        Admin.toast(`已${action}「${username}」`, 'success');
        loadUsers(currentPage);
    } catch (e) {}
}

async function toggleActive(userId, isActive, username) {
    const action = isActive ? '启用' : '禁用';
    const ok = await Admin.confirm('确认操作', `确定要${action}用户「${username}」吗？${isActive ? '' : '禁用后该用户将无法登录前台。'}`);
    if (!ok) return;
    try {
        await Admin.put(`/admin/api/users/${userId}`, { is_active: isActive });
        Admin.toast(`已${action}「${username}」`, 'success');
        loadUsers(currentPage);
    } catch (e) {}
}

document.getElementById('btn-search').addEventListener('click', () => {
    currentQuery = document.getElementById('search-input').value.trim();
    currentPage = 1;
    loadUsers(currentPage);
});
document.getElementById('search-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('btn-search').click();
});

loadUsers();
</script>
{% endblock %}
