<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/static/style.css">
    <style>
        .item-result-row {
            display: flex; align-items: center; justify-content: space-between; gap: 0.3rem;
            padding: 0.35rem 0.5rem; background: var(--bg); border: 1px solid var(--border);
            border-radius: 4px; margin-bottom: 0.2rem; cursor: pointer; font-size: 0.82rem;
        }
        .item-result-row:hover { border-color: var(--accent); background: var(--surface); }
        #global-search-results { max-height: 500px; overflow-y: auto; }
        /* 自定义条目 */
        .custom-tabs { display: flex; gap: 0; margin-bottom: 0.75rem; border-bottom: 2px solid var(--accent); }
        .custom-tab {
            flex: 1; padding: 0.5rem; background: var(--bg); border: none;
            color: var(--text-dim); cursor: pointer; font-size: 0.82rem;
            border-bottom: 2px solid transparent; margin-bottom: -2px;
            transition: all 0.15s;
        }
        .custom-tab:hover { color: var(--text); background: var(--surface2); }
        .custom-tab.active { color: var(--gold); border-bottom-color: var(--gold); background: var(--surface); }
        .custom-form-wrap {
            background: var(--bg); border: 1px solid var(--border);
            border-radius: 6px; padding: 0.65rem; margin-bottom: 0.5rem;
        }
        .custom-list { font-size: 0.78rem; color: var(--text-dim); max-height: 200px; overflow-y: auto; }
        .custom-list .custom-entry {
            display: flex; align-items: center; gap: 0.4rem;
            padding: 0.3rem 0.5rem; border-bottom: 1px solid var(--border);
            transition: background 0.15s;
        }
        .custom-list .custom-entry:hover { background: var(--surface2); }
        .custom-list .custom-entry .custom-entry-name { flex: 1; color: var(--text); }
        .custom-list .custom-entry .custom-entry-del {
            background: none; border: 1px solid var(--border); color: var(--red);
            cursor: pointer; font-size: 0.65rem; padding: 0.1rem 0.35rem; border-radius: 3px;
        }
        .custom-list .custom-entry .custom-entry-del:hover { background: var(--red); color: #fff; }
        .cf-input {
            width: 100%; padding: 0.4rem 0.5rem; background: var(--bg); border: 1px solid var(--border);
            border-radius: 4px; color: var(--text); font-size: 0.8rem; font-family: inherit;
            box-sizing: border-box; transition: border-color 0.15s;
        }
        .cf-input:focus { border-color: var(--accent); outline: none; }
        .cf-textarea { resize: vertical; min-height: 3rem; }
        .cf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
        .cf-add-btn {
            width: 100%; padding: 0.5rem; background: var(--accent); border: none;
            border-radius: 4px; color: #fff; cursor: pointer; font-size: 0.85rem;
            font-weight: bold; margin-top: 0.5rem; transition: opacity 0.15s;
        }
        .cf-add-btn:hover { opacity: 0.9; }
        .cf-field { display: flex; flex-direction: column; gap: 0.2rem; font-size: 0.75rem; color: var(--text-dim); }
        .cf-ab { flex-direction: row; align-items: center; gap: 0.35rem; }
        .cf-ab-name { flex: 0 0 auto; width: 2.2em; }
        .cf-ab-mod { flex: 0 0 auto; color: var(--green); font-size: 0.8rem; font-weight: bold; }
        .cf-del {
            background: none; border: 1px solid var(--border); color: var(--red);
            cursor: pointer; font-size: 0.65rem; padding: 0.1rem 0.35rem; border-radius: 3px; flex-shrink: 0;
        }
        .cf-del:hover { background: var(--red); color: #fff; }
        .custom-list .custom-entry .custom-entry-edit {
            background: none; border: 1px solid var(--border); color: var(--gold);
            cursor: pointer; font-size: 0.65rem; padding: 0.1rem 0.35rem; border-radius: 3px;
        }
        .custom-list .custom-entry .custom-entry-edit:hover { background: var(--gold); color: #fff; }
        .custom-list .custom-entry .custom-entry-pdf {
            background: none; border: 1px solid var(--border); color: var(--cyan);
            cursor: pointer; font-size: 0.65rem; padding: 0.1rem 0.35rem; border-radius: 3px;
        }
        .custom-list .custom-entry .custom-entry-pdf:hover { background: var(--cyan); color: #fff; }
        .editable-field {
            cursor: pointer; border-bottom: 1px dashed var(--text-dim);
            padding: 0.05rem 0.15rem; border-radius: 2px; transition: all 0.15s;
        }
        .editable-field:hover { background: var(--surface2); border-bottom-color: var(--accent); color: var(--accent); }
        .cf-sub-hint { font-size: 0.72rem; color: var(--text-dim); margin-bottom: 0.35rem; }
        .cf-fields { display: flex; flex-wrap: wrap; gap: 0.35rem; }
        .cf-field-btn {
            padding: 0.35rem 0.6rem; background: var(--bg); border: 1px solid var(--border);
            border-radius: 4px; color: var(--text-dim); cursor: pointer; font-size: 0.78rem;
            transition: all 0.15s; white-space: nowrap;
        }
        .cf-field-btn:hover { border-color: var(--gold); color: var(--text); }
        .cf-field-btn.selected { border-color: var(--accent); color: #fff; background: var(--accent); }
        .cf-field-btn.filled { border-color: var(--green); color: var(--green); }
        .cf-field-btn.filled.selected { color: #fff; background: var(--accent); border-color: var(--accent); }
        .search-toggle-btn {
            display: block; width: 100%; padding: 0.3rem; background: var(--surface2);
            border: 1px solid var(--border); border-radius: 4px; color: var(--text-dim);
            cursor: pointer; font-size: 0.75rem; margin-top: 0.3rem; text-align: center;
            transition: all 0.15s;
        }
        .search-toggle-btn:hover { color: var(--text); border-color: var(--accent); }
        /* 资源库操作按钮 */
        .res-action-btn {
            background: var(--surface2); border: 1px solid var(--border); border-radius: 4px;
            color: var(--text-dim); cursor: pointer; font-size: 0.7rem; padding: 0.2rem 0.45rem;
            white-space: nowrap; transition: all 0.15s; line-height: 1.3;
        }
        .res-action-btn:hover { border-color: var(--accent); color: var(--text); }
        .res-action-btn.preview-btn:hover { border-color: var(--cyan); color: var(--cyan); }
        .res-action-btn.download-btn:hover { border-color: var(--green); color: var(--green); }
        /* 图片预览浮层 */
        #image-preview-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.88); z-index: 10000; align-items: center; justify-content: center;
            backdrop-filter: blur(6px); cursor: pointer;
        }
        #image-preview-overlay.show { display: flex; }
        #image-preview-overlay img {
            max-width: 92vw; max-height: 90vh; object-fit: contain;
            border-radius: 8px; box-shadow: 0 8px 40px rgba(0,0,0,0.6); cursor: default;
        }
        #image-preview-close {
            position: fixed; top: 16px; right: 20px; width: 42px; height: 42px;
            background: rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.4);
            border-radius: 50%; color: #fff; font-size: 1.4rem; cursor: pointer;
            z-index: 10001; display: none; align-items: center; justify-content: center;
            transition: all 0.2s; line-height: 1;
        }
        #image-preview-close.show { display: flex; }
        #image-preview-close:hover { background: var(--red); border-color: var(--red); transform: scale(1.1); }

</style>

    <div class="main-container">
        <!-- 全资料库综合搜索 -->

            <div class="dice-input">

    <script>
        // ━━━ HTML 转义 ━━━
        function escHtml(s) {
            if (!s) return '';
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
        }

        // ━━━ 全资料库综合搜索 ━━━
        let globalResults = [];
        async function doGlobalSearch() {
            const q = document.getElementById('global-search-input').value.trim();
            if (!q || q.length < 2) { alert('至少输入2个字'); return; }
            const el = document.getElementById('global-search-results');
            el.innerHTML = '<div style="color:var(--cyan);text-align:center;padding:0.5rem;">搜索中...</div>';
            try {
                const data = await (await fetch(`/api/search?q=${encodeURIComponent(q)}`)).json();
                if (data.error) { el.innerHTML = `<div style="color:var(--red);">${data.error}</div>`; return; }
                if (!data.results.length) { el.innerHTML = '<div style="color:var(--text-dim);text-align:center;padding:0.5rem;">未找到匹配结果</div>'; return; }
                globalResults = data.results;
                const icons = {spell:'📖', monster:'👹', rule:'📋', item:'📦', feat:'⭐', file:'📁', doc:'📄'};
                el.innerHTML = '<div style="font-size:0.78rem;color:var(--text-dim);margin-bottom:0.3rem;">共 ' + data.total + ' 条结果，点击查看详情</div>' +
                    data.results.map((r, i) => {
                        const icon = icons[r.type] || '📄';
                        return '<div class="item-result-row" onclick="showGlobalDetail(' + i + ')" style="font-size:0.82rem;">' +
                            '<span><span style="font-weight:bold;color:var(--gold);">' + icon + ' ' + escHtml(r.name) + '</span>' +
                            '<span style="color:var(--text-dim);font-size:0.7rem;margin-left:0.4rem;">[' + escHtml(r.type) + ']</span></span>' +
                        '</div>';
                    }).join('');
            } catch(e) { el.innerHTML = `<div style="color:var(--red);">搜索失败: ${e.message}</div>`; }
        }

        function closeGlobalDetail() {
            document.getElementById('global-detail').innerHTML = '';
        }

        async function showGlobalDetail(index) {
            var r = globalResults[index];
            if (!r) return;
            var el = document.getElementById('global-detail');
            el.innerHTML = '<div style="color:var(--cyan);text-align:center;padding:0.5rem;">加载详情...</div>';

            if (r.type === 'spell') {
                try {
                    var resp = await fetch('/api/spell-detail/' + encodeURIComponent(r.name));

                        var html = '<div style="background:var(--bg);border:1px solid var(--accent);border-radius:6px;padding:0.75rem;">';

                        if (d.classes) html += '<div style="font-size:0.78rem;color:var(--text-dim);">👤 ' + escHtml(d.classes) + '</div>';

                        if (d.source) html += '<div style="font-size:0.75rem;color:var(--text-dim);">📚 ' + escHtml(d.source) + (d.rule_version && d.rule_version !== d.source ? ' <span style="color:#d4a860;">[' + escHtml(d.rule_version) + ']</span>' : '') + '</div>';

            if (r.type === 'monster') {
                try {
                    // 优先用 detail_link 获取详情（精确匹配），否则用名称搜索
                    var apiUrl = r.path ? '/api/rule-detail?path=' + encodeURIComponent(r.path)
                              : '/api/monster/' + encodeURIComponent(r.name);
                    var resp = await fetch(apiUrl);
                    var d = await resp.json();
                    // 如果 rule-detail 返回的是 HTML 原文，包装成怪物格式
                    if (d.content && !d.error) {
                        var html = '<div style="background:var(--bg);border:1px solid var(--accent);border-radius:6px;padding:0.75rem;">';
                        html += '<div style="font-weight:bold;color:var(--accent);margin-bottom:0.4rem;">👹 ' + escHtml(r.name) + '</div>';
                        html += '<div style="color:var(--gold);font-size:0.85rem;margin-bottom:0.3rem;">' + escHtml(r.detail||'') + '</div>';
                        html += '<div style="color:var(--text-dim);font-size:0.8rem;line-height:1.6;white-space:pre-wrap;max-height:60vh;overflow-y:auto;margin-top:0.4rem;border-top:1px solid var(--border);padding-top:0.4rem;">' + escHtml(d.content) + '</div>';
                        html += '<button class="btn btn-small" style="margin-top:0.4rem;background:var(--surface2);color:var(--text);" onclick="closeGlobalDetail()">✕ 关闭</button>';
                        html += '</div>';
                        el.innerHTML = html;
                        return;
                    }
                    if (!d.error) {
                        var html = '<div style="background:var(--bg);border:1px solid var(--accent);border-radius:6px;padding:0.75rem;">';
                        html += '<div style="font-weight:bold;color:var(--accent);margin-bottom:0.4rem;">👹 ' + escHtml(d.name) + (d.name_en ? ' <small style="color:var(--text-dim);">' + escHtml(d.name_en) + '</small>' : '') + '</div>';
                        html += '<div style="color:var(--gold);font-size:0.85rem;margin-bottom:0.3rem;">CR: ' + escHtml(d.cr||'?') + ' | ' + escHtml(d.size||'?') + ' ' + escHtml(d.type||'?') + (d.legendary ? ' | 传奇:' + escHtml(d.legendary) : '') + '</div>';
                        if (d.source) html += '<div style="font-size:0.75rem;color:var(--text-dim);">📚 ' + escHtml(d.source) + (d.rule_version && d.rule_version !== d.source ? ' <span style="color:#d4a860;">[' + escHtml(d.rule_version) + ']</span>' : '') + '</div>';
                        if (d.detail_text) html += '<div style="color:var(--text-dim);font-size:0.8rem;line-height:1.6;white-space:pre-wrap;max-height:none;overflow-y:visible;margin-top:0.4rem;border-top:1px solid var(--border);padding-top:0.4rem;">' + escHtml(d.detail_text) + '</div>';
                        html += '<button class="btn btn-small" style="margin-top:0.4rem;background:var(--surface2);color:var(--text);" onclick="closeGlobalDetail()">✕ 关闭</button>';
                        html += '</div>';
                        el.innerHTML = html;
                        return;
                    }
                    // API未找到，回退显示搜索结果摘要
                } catch(e) {}
            }

            // For rule/docs/files, try to fetch full page content if path is available
            if (r.path) {
                try {
                    var apiUrl = (r.type === 'file') ? '/api/file-content?path=' : '/api/rule-detail?path=';
                    var resp = await fetch(apiUrl + encodeURIComponent(r.path));
                    var d = await resp.json();
                    if (!d.error && d.type === 'image') {
                        // 图片文件 → 直接展示图片
                        var html = '<div style="background:var(--bg);border:1px solid var(--accent);border-radius:6px;padding:0.75rem;">';
                        html += '<div style="font-weight:bold;color:var(--accent);margin-bottom:0.3rem;">' + escHtml(r.name) + '</div>';
                        html += '<img src="' + d.content + '" style="max-width:100%;max-height:70vh;display:block;margin:0 auto;border-radius:4px;" onerror="this.alt=\'图片加载失败\'">';
                        html += '<button class="btn btn-small" style="margin-top:0.4rem;background:var(--surface2);color:var(--text);" onclick="closeGlobalDetail()">✕ 关闭</button>';
                        html += '</div>';
                        el.innerHTML = html;
                        return;
                    }
                    if (!d.error && d.content) {
                        var html = '<div style="background:var(--bg);border:1px solid var(--accent);border-radius:6px;padding:0.75rem;">';
                        html += '<div style="font-weight:bold;color:var(--accent);margin-bottom:0.3rem;">' + escHtml(r.name) + '</div>';
                        html += '<div style="color:var(--text-dim);font-size:0.8rem;margin-bottom:0.3rem;">类型: ' + escHtml(r.type) + '</div>';
                        html += '<div style="color:var(--text-dim);font-size:0.8rem;line-height:1.6;white-space:pre-wrap;max-height:60vh;overflow-y:auto;margin-top:0.3rem;border-top:1px solid var(--border);padding-top:0.3rem;">' + escHtml(d.content) + '</div>';
                        html += '<button class="btn btn-small" style="margin-top:0.4rem;background:var(--surface2);color:var(--text);" onclick="closeGlobalDetail()">✕ 关闭</button>';
                        html += '</div>';
                        el.innerHTML = html;
                        return;
                    }
                } catch(e) {}
            }

            var html = '<div style="background:var(--bg);border:1px solid var(--accent);border-radius:6px;padding:0.75rem;">';
            html += '<div style="font-weight:bold;color:var(--accent);margin-bottom:0.3rem;">' + escHtml(r.name) + '</div>';
            html += '<div style="color:var(--text-dim);font-size:0.8rem;margin-bottom:0.3rem;">类型: ' + escHtml(r.type) + '</div>';
            if (r.detail) html += '<div style="color:var(--text-dim);font-size:0.8rem;line-height:1.6;white-space:pre-wrap;max-height:60vh;overflow-y:auto;">' + escHtml(r.detail) + '</div>';
            html += '<button class="btn btn-small" style="margin-top:0.4rem;background:var(--surface2);color:var(--text);" onclick="closeGlobalDetail()">✕ 关闭</button>';
            html += '</div>';
            el.innerHTML = html;
        }

        // ━━━ 法术查询 ━━━
        async function searchSpell() { quickSpell(document.getElementById('spell-query').value.trim()); }

        function showSpellDetailCard(data, queryName) {
            let detail = data.detail_text || data.description || '';
            return `
                <div class="info-card">
                    <div class="info-title">📖 ${escHtml(data.name || queryName)} ${data.name_en ? '<small style="color:var(--gold)">'+escHtml(data.name_en)+'</small>' : ''}</div>
                    <div class="info-subtitle">${escHtml(data.level||'?')} · ${escHtml(data.school||'?')} | ⏱ ${escHtml(data.casting_time||'?')} | 🧪 ${escHtml(data.components||'?')}</div>
                    <div style="font-size:0.78rem;color:var(--text-dim);margin-top:0.3rem;">
                        📋 仪式: ${escHtml(data.ritual||'否')} | 🎯 专注: ${escHtml(data.concentration||'否')} | 👤 ${escHtml(data.classes||'?')}
                    </div>
                    ${data.range ? `<div style="font-size:0.78rem;color:var(--text-dim);">📏 ${escHtml(data.range)} | ⏳ ${escHtml(data.duration||'?')}</div>` : ''}
                    ${data.source ? `<div style="font-size:0.75rem;color:var(--text-dim);">📚 ${escHtml(data.source)}${data.rule_version && data.rule_version !== data.source ? ' <span style="color:#d4a860;">[' + escHtml(data.rule_version) + ']</span>' : ''}</div>` : ''}
                    ${detail ? `<div style="color:var(--text-dim);font-size:0.82rem;line-height:1.6;white-space:pre-wrap;margin-top:0.5rem;border-top:1px solid var(--border);padding-top:0.5rem;">${escHtml(detail)}</div>` : ''}
                </div>`;
        }

        async function quickSpell(name, fromList) {
            if (!name) return;
            document.getElementById('spell-query').value = name;
            const el = document.getElementById('spell-result');
            el.innerHTML = '<div style="color:var(--cyan);text-align:center;padding:0.5rem;">搜索中...</div>';

            try {
                // 从列表点击 → 直接获取详情
                if (fromList) {
                    const resp = await fetch(`/api/spell-detail/${encodeURIComponent(name)}`);
                    const data = await resp.json();
                    el.innerHTML = data.error
                        ? `<div style="color:var(--red);">未找到: ${escHtml(name)}</div>`
                        : showSpellDetailCard(data, name);
                    return;
                }

                // 短关键词(<=2字) → 直接列列表
                if (name.length <= 2) {
                    const listResp = await fetch(`/api/spells/search?q=${encodeURIComponent(name)}`);
                    const listData = await listResp.json();
                    if (listData.results && listData.results.length) {
                        renderSpellList(el, listData.results, name);
                        return;
                    }
                }

                // 1. 先尝试精确匹配
                const resp = await fetch(`/api/spell-detail/${encodeURIComponent(name)}`);
                const data = await resp.json();
                if (!data.error) {
                    const listResp = await fetch(`/api/spells/search?q=${encodeURIComponent(name)}`);
                    const listData = await listResp.json();
                    if (listData.results && listData.results.length > 1) {
                        renderSpellList(el, listData.results, name);
                    } else {
                        el.innerHTML = showSpellDetailCard(data, name);
                    }
                    return;
                }

                // 2. 模糊搜索
                const searchResp = await fetch(`/api/spells/search?q=${encodeURIComponent(name)}`);
                const searchData = await searchResp.json();
                const spells = (searchData.results || []);
                if (!spells.length) {
                    el.innerHTML = `<div style="color:var(--text-dim);">未找到匹配 "${escHtml(name)}" 的法术</div>`;
                    return;
                }
                renderSpellList(el, spells, name);
            } catch(e) {
                el.innerHTML = `<div style="color:var(--red)">查询失败</div>`;
            }
        }

        function renderSpellList(el, spells, queryName) {
            const needCollapse = spells.length > 8;
            const listId = 'spell-result-list-' + Date.now();
            const toggleId = 'spell-toggle-' + Date.now();
            el.innerHTML = `<div style="font-size:0.78rem;color:var(--text-dim);margin-bottom:0.3rem;">找到 ${spells.length} 个匹配 "${escHtml(queryName)}" 的法术（点击查看详情）</div>` +
                `<div id="${listId}"${needCollapse ? ' style="max-height:280px;overflow-y:auto;"' : ''}>` +
                spells.map(s => `
                <div class="item-result-row" data-spell-name="${escHtml(s.name)}" onclick="quickSpell(this.dataset.spellName, true)" style="cursor:pointer;font-size:0.82rem;">
                    <span style="font-weight:bold;color:var(--gold);">📖 ${escHtml(s.name)}</span>
                    <span style="color:var(--text-dim);font-size:0.7rem;">${escHtml(s.detail||'')}</span>
                </div>
                `).join('') + '</div>' +
                (needCollapse ? `<button class="search-toggle-btn" id="${toggleId}" onclick="toggleResultList('${listId}','${toggleId}',${spells.length})">▼ 展开全部 (${spells.length}条)</button>` : '');
        }

        // ━━━ 怪物查询 ━━━
        async function searchMonster() { quickMonster(document.getElementById('monster-query').value.trim()); }

        function showMonsterDetailCard(data, queryName) {
            return `
                <div class="info-card">
                    <div class="info-title">👹 ${escHtml(data.name || queryName)} ${data.name_en ? '<small style="color:var(--gold)">'+escHtml(data.name_en)+'</small>' : ''}</div>
                    <div class="info-subtitle">挑战等级: ${data.cr || '?'} | ${data.size || ''} ${data.type || ''} ${data.legendary ? '| 传奇: '+data.legendary : ''}</div>
                    ${data.source ? `<div style="font-size:0.75rem;color:var(--text-dim);">📚 ${escHtml(data.source)}${data.rule_version && data.rule_version !== data.source ? ' <span style="color:#d4a860;">[' + escHtml(data.rule_version) + ']</span>' : ''}</div>` : ''}
                    ${data.detail_text ? `<div style="color:var(--text-dim);font-size:0.82rem;line-height:1.6;white-space:pre-wrap;margin-top:0.5rem;border-top:1px solid var(--border);padding-top:0.5rem;">${escHtml(data.detail_text)}</div>` : '<div style="color:var(--text-dim);margin-top:0.5rem;">暂无详细数据</div>'}
                </div>`;
        }

        async function quickMonster(name, fromList, source) {
            if (!name) return;
            document.getElementById('monster-query').value = name;
            const el = document.getElementById('monster-result');
            el.innerHTML = '<div style="color:var(--cyan);text-align:center;padding:0.5rem;">搜索中...</div>';

            try {
                // 从列表点击的精确名称 → 直接获取详情（带 source 精确打开对应规则版本）
                if (fromList) {
                    const srcQ = source ? `?source=${encodeURIComponent(source)}` : '';
                    const resp = await fetch(`/api/monster/${encodeURIComponent(name)}${srcQ}`);
                    const data = await resp.json();
                    el.innerHTML = data.error
                        ? `<div style="color:var(--red);">未找到: ${escHtml(name)}</div>`
                        : showMonsterDetailCard(data, name);
                    return;
                }

                // 短关键词(<=2字) → 直接列列表
                if (name.length <= 2) {
                    const listResp = await fetch(`/api/monsters/search?q=${encodeURIComponent(name)}`);
                    const listData = await listResp.json();
                    if (listData.results && listData.results.length) {
                        renderMonsterList(el, listData.results, name);
                        return;
                    }
                }

                // 1. 先尝试精确匹配（返回词条名须与输入一致，
                //    否则是模糊命中（如"亡灵僵尸"命中"骚灵"），一律走列表确认）
                const resp = await fetch(`/api/monster/${encodeURIComponent(name)}`);
                const data = await resp.json();
                if (!data.error && data.name === name) {
                    // 检查是否有多个匹配
                    const listResp = await fetch(`/api/monsters/search?q=${encodeURIComponent(name)}`);
                    const listData = await listResp.json();
                    if (listData.results && listData.results.length > 1) {
                        renderMonsterList(el, listData.results, name);
                    } else {
                        el.innerHTML = showMonsterDetailCard(data, name);
                    }
                    return;
                }

                // 2. 精确匹配失败，模糊搜索
                const searchResp = await fetch(`/api/monsters/search?q=${encodeURIComponent(name)}`);
                const searchData = await searchResp.json();
                const monsters = (searchData.results || []);

                if (!monsters.length) {
                    el.innerHTML = `<div style="color:var(--text-dim);">未找到匹配 "${escHtml(name)}" 的生物</div>`;
                    return;
                }
                renderMonsterList(el, monsters, name);
            } catch(e) {
                el.innerHTML = `<div style="color:var(--red)">查询失败</div>`;
            }
        }

        function renderMonsterList(el, monsters, queryName) {
            const needCollapse = monsters.length > 8;
            const listId = 'monster-result-list-' + Date.now();
            const toggleId = 'monster-toggle-' + Date.now();
            el.innerHTML = `<div style="font-size:0.78rem;color:var(--text-dim);margin-bottom:0.3rem;">找到 ${monsters.length} 个匹配 "${escHtml(queryName)}" 的生物（点击查看详情）</div>` +
                `<div id="${listId}"${needCollapse ? ' style="max-height:280px;overflow-y:auto;"' : ''}>` +
                monsters.map(m => `
                <div class="item-result-row" data-monster-name="${escHtml(m.name)}" data-monster-source="${escHtml(m.source||'')}" onclick="quickMonster(this.dataset.monsterName, true, this.dataset.monsterSource)" style="cursor:pointer;font-size:0.82rem;">
                    <span style="font-weight:bold;color:var(--gold);">👹 ${escHtml(m.name)}</span>
                    <span style="color:var(--text-dim);font-size:0.7rem;">${escHtml(m.detail||'')}${m.source ? ' | ' + escHtml(m.source) : ''}</span>
                </div>
                `).join('') + '</div>' +
                (needCollapse ? `<button class="search-toggle-btn" id="${toggleId}" onclick="toggleResultList('${listId}','${toggleId}',${monsters.length})">▼ 展开全部 (${monsters.length}条)</button>` : '');
        }

        // ━━━ 状态列表（可点击展开/收起完整描述）━━
        async function loadConditions() {
            try {
                const resp = await fetch('/api/conditions');
                const data = await resp.json();
                const el = document.getElementById('conditions-list');
                el.innerHTML = Object.entries(data).map(([name, desc]) => `
                    <div class="condition-item" onclick="toggleCondition(this)" style="cursor:pointer;padding:0.35rem 0.5rem;background:var(--bg);border:1px solid var(--border);border-radius:4px;margin-bottom:0.25rem;transition:all 0.15s;">
                        <div style="display:flex;justify-content:space-between;align-items:center;">
                            <b style="color:var(--gold);">⚕️ ${escHtml(name)}</b>
                            <span style="font-size:0.7rem;color:var(--text-dim);">点击展开 ▼</span>
                        </div>
                        <div class="condition-detail" style="display:none;margin-top:0.35rem;padding-top:0.35rem;border-top:1px solid var(--border);font-size:0.8rem;color:var(--text-dim);line-height:1.6;">${escHtml(desc)}</div>
                    </div>
                `).join('');
            } catch(e) {
                document.getElementById('conditions-list').innerHTML = '加载失败';
            }
        }

        function toggleResultList(listId, toggleId, total) {
            const list = document.getElementById(listId);
            const btn = document.getElementById(toggleId);
            if (!list || !btn) return;
            if (list.style.maxHeight && list.style.maxHeight !== 'none') {
                list.style.maxHeight = 'none';
                list.style.overflowY = 'visible';
                btn.textContent = '▲ 收起列表';
            } else {
                list.style.maxHeight = '280px';
                list.style.overflowY = 'auto';
                btn.textContent = '▼ 展开全部 (' + total + '条)';
            }
        }

        function toggleCondition(el) {
            const detail = el.querySelector('.condition-detail');
            const arrow = el.querySelector('span');
            if (detail.style.display === 'none') {
                detail.style.display = 'block';
                arrow.textContent = '点击收起 ▲';
            } else {
                detail.style.display = 'none';
                arrow.textContent = '点击展开 ▼';
            }
        }

        // ━━━ 技能列表 ━━━
        async function loadSkills() {
            try {
                const resp = await fetch('/api/skills');
                const data = await resp.json();
                const el = document.getElementById('skills-list');

                // 按属性分组
                const groups = {};
                Object.entries(data).forEach(([skill, ability]) => {
                    if (!groups[ability]) groups[ability] = [];
                    groups[ability].push(skill);
                });

                el.innerHTML = Object.entries(groups).map(([ability, skills]) => `
                    <div style="margin-bottom:0.5rem;">
                        <b style="color:var(--gold)">${ability}</b>
                        <span style="color:var(--text-dim)">: ${skills.join(' / ')}</span>
                    </div>
                `).join('');
            } catch(e) {
                document.getElementById('skills-list').innerHTML = '加载失败';
            }
        }

        // ━━━ 自定义资料库 ━━━
        let customKind = 'spells';

        function switchCustomTab(kind) {
            customKind = kind;
            document.querySelectorAll('.custom-tab').forEach(b => b.classList.remove('active'));
            document.getElementById('custom-tab-' + kind).classList.add('active');
            if (kind === 'monsters') {
                resetMonsterForm();  // 生物走结构化分区表单（v5.11）
            } else {
                customData = {};
                customSelectedField = '';
            }
            renderCustomForm(kind);
        }

        // ━━━ 自定义条目编辑状态（法术用）━━━
        let customData = {};        // { fieldKey: value, ... }
        let customSelectedField = ''; // 当前选中编辑的字段
        const spellFields = [
            {key:'name', label:'法术名 *'},{key:'name_en', label:'英文名'},{key:'level', label:'环位/等级'},
            {key:'school', label:'学派'},{key:'casting_time', label:'施法时间'},{key:'range', label:'距离'},
            {key:'duration', label:'持续时间'},{key:'components', label:'成分'},{key:'classes', label:'职业'},
            {key:'ritual', label:'仪式'},{key:'concentration', label:'专注'},{key:'description', label:'法术描述'},
        ];

        function getCurrentFields() {
            return spellFields;
        }

        function renderCustomForm(kind) {
            if (kind === 'monsters') { renderMonsterForm(); return; }  // 生物走结构化分区表单（v5.11）
            customData = {};
            customSelectedField = '';
            const el = document.getElementById('custom-form');
            if (kind === 'items') {
                el.innerHTML = `
                    <input id="cf-name" placeholder="物品名*" class="cf-input">
                    <textarea id="cf-description" placeholder="物品介绍信息..." class="cf-input cf-textarea" rows="3" style="margin-top:0.5rem;"></textarea>
                    <button class="cf-add-btn" onclick="addCustomEntry()">➕ 添加至资料库</button>
                `;
            } else {
                const fields = getCurrentFields();
                el.innerHTML = `
                    <div class="cf-fields">${fields.map(f => {
                        const filled = customData[f.key] ? ' filled' : '';
                        const sel = customSelectedField === f.key ? ' selected' : '';
                        return `<button class="cf-field-btn${filled}${sel}" data-field="${f.key}" onclick="selectCustomField('${f.key}')">${f.label}</button>`;
                    }).join('')}</div>
                    <div style="margin-top:0.5rem;">
                        <div style="font-size:0.75rem;color:var(--text-dim);margin-bottom:0.2rem;" id="cf-edit-label">
                            ${customSelectedField ? '编辑: ' + (fields.find(f=>f.key===customSelectedField)||{}).label : '点击上方按钮选择要编辑的字段'}
                        </div>
                        <textarea id="cf-textarea" class="cf-input cf-textarea" rows="4"
                            placeholder="${customSelectedField ? '输入内容...' : '↑ 先点击上方按钮选择字段'}"
                            ${!customSelectedField ? 'disabled' : ''}
                            oninput="customData['${customSelectedField}']=this.value;updateFieldBtns()"></textarea>
                        <div style="display:flex;gap:0.5rem;margin-top:0.5rem;">
                            <button class="cf-add-btn" onclick="addCustomEntry()" style="flex:1;">➕ 添加至资料库</button>
                        </div>
                    </div>
                `;
            }
            loadCustomList(kind);
        }

        function selectCustomField(fieldKey) {
            customSelectedField = fieldKey;
            const fields = getCurrentFields();
            const field = fields.find(f => f.key === fieldKey);
            document.getElementById('cf-edit-label').textContent = '编辑: ' + (field ? field.label : '');
            const ta = document.getElementById('cf-textarea');
            ta.disabled = false;
            ta.value = customData[fieldKey] || '';
            ta.placeholder = '输入 ' + (field ? field.label : '') + ' ...';
            ta.oninput = function() { customData[fieldKey] = this.value; updateFieldBtns(); };
            ta.focus();
            updateFieldBtns();
        }

        function updateFieldBtns() {
            document.querySelectorAll('.cf-field-btn').forEach(btn => {
                const key = btn.getAttribute('data-field');
                if (key) {
                    btn.classList.toggle('filled', !!customData[key]);
                    btn.classList.toggle('selected', key === customSelectedField);
                }
            });
        }

        async function addCustomEntry() {
            // 先检查是否有未保存到 customData 的文本框内容
            if (customSelectedField && customKind !== 'items') {
                const ta = document.getElementById('cf-textarea');
                if (ta) customData[customSelectedField] = ta.value;
            }
            if (customKind === 'items') {
                customData.name = document.getElementById('cf-name')?.value || '';
                customData.description = document.getElementById('cf-description')?.value || '';
            }

            const name = customData.name || '';
            if (!name.trim()) { alert('请输入名称'); return; }
            if (!await showConfirmDialog(`确定将 "${name.trim()}" 添加到资料库吗？`)) return;

            const data = {};
            if (customKind === 'items') {
                data.name = name.trim();
                data.description = customData.description || '';
            } else {
                const fields = getCurrentFields();
                for (const f of fields) {
                    const val = (customData[f.key] || '').trim();
                    if (val || f.key === 'name') data[f.key] = val;
                }
                if (!data.name) { alert('请输入名称'); return; }
            }

            const resp = await fetch('/api/custom/' + customKind, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            const result = await resp.json();
            if (result.error) { alert(result.error); return; }
            alert('✅ "' + data.name + '" 已添加到资料库');
            loadCustomList(customKind);
            // 重置表单
            customData = {};
            customSelectedField = '';
            renderCustomForm(customKind);
        }

        // ━━━ 自定义生物 · 结构化分区表单（v5.11）━━━
        // 二级 Tab：基础 / 属性 / 熟练 / 装备 / 特性；保存时自动拼装 detail_text（CHM 词条格式）
        const MONSTER_AB_CN = {'str':'力量','dex':'敏捷','con':'体质','int':'智力','wis':'感知','cha':'魅力'};
        const MONSTER_SKILL_AB = {
            '运动':'str','特技':'dex','巧手':'dex','隐匿':'dex',
            '奥秘':'int','历史':'int','调查':'int','自然':'int','宗教':'int',
            '驯兽':'wis','洞悉':'wis','医药':'wis','察觉':'wis','生存':'wis',
            '欺诈':'cha','威吓':'cha','表演':'cha','游说':'cha',
        };
        const MONSTER_FEATURE_CATS = [
            {key:'racial_trait', title:'🧬 种族特性'},
            {key:'class_feature', title:'⚔️ 职业能力'},
            {key:'feat', title:'⭐ 专长'},
            {key:'special_ability', title:'✨ 特殊能力'},
        ];
        const MONSTER_SUB_TABS = [
            {key:'base', title:'📋 基础'},
            {key:'stats', title:'💪 属性'},
            {key:'skills', title:'🎯 熟练'},
            {key:'equip', title:'⚔️ 装备'},
            {key:'features', title:'✨ 特性'},
        ];
        let monsterData = {};        // 结构化数据状态
        let monsterEditName = '';    // 编辑中的原名称（空 = 新增）
        let monsterSubTab = 'base';  // 当前二级分区

        function newMonsterData() {
            return {
                name:'', name_en:'', cr:'', size:'', type:'', legendary:'',
                race:'', alignment:'', faith:'', gender:'',
                hp:'', abilities:{str:'',dex:'',con:'',int:'',wis:'',cha:''},
                height:'', weight:'', speed:'', passive_perception:'',
                ac:'', armor:'', weapons:[],
                skill_proficiencies:{}, save_proficiencies:{},
                features:{racial_trait:[],class_feature:[],feat:[],special_ability:[]},
                extra_text:'',
            };
        }

        function monsterAbilityMod(score) {
            const n = parseInt(score, 10);
            if (isNaN(n)) return 0;
            return Math.floor((n - 10) / 2);
        }

        function fmtMod(n) { return (n >= 0 ? '+' : '') + n; }

        function switchMonsterSubTab(tab) {
            monsterSubTab = tab;
            renderMonsterForm();
        }

        function renderMonsterForm() {
            const el = document.getElementById('custom-form');
            el.innerHTML = `
                <div class="custom-tabs" style="margin-bottom:0.5rem;">
                    ${MONSTER_SUB_TABS.map(t => `
                        <button class="custom-tab${monsterSubTab === t.key ? ' active' : ''}" onclick="switchMonsterSubTab('${t.key}')">${t.title}</button>
                    `).join('')}
                </div>
                <div id="monster-sub-form">${renderMonsterSubTab()}</div>
                <div style="margin-top:0.6rem;">
                    <div style="font-size:0.75rem;color:var(--text-dim);margin-bottom:0.2rem;">📄 详细数据补充（自由文本，追加在自动生成的详细数据末尾）</div>
                    <textarea id="cf-extra-text" class="cf-input cf-textarea" rows="3"
                        placeholder="补充文本（可选）：特殊规则、动作细节等"
                        oninput="monsterData.extra_text=this.value">${escHtml(monsterData.extra_text || '')}</textarea>
                </div>
                <div style="display:flex;gap:0.5rem;">
                    <button class="cf-add-btn" onclick="saveMonsterEntry()" style="flex:1;">${monsterEditName ? '💾 保存修改' : '➕ 添加至资料库'}</button>
                    ${monsterEditName ? '<button class="cf-add-btn" onclick="resetMonsterForm()" style="flex:0 0 auto;background:var(--surface2);color:var(--text);">↩ 取消编辑</button>' : ''}
                </div>
            `;
        }

        function renderMonsterSubTab() {
            const d = monsterData;
            if (monsterSubTab === 'base') {
                const f = (key, label, ph, req) => `
                    <label class="cf-field">${label}${req ? ' *' : ''}
                        <input class="cf-input" value="${escHtml(d[key])}" placeholder="${ph||''}"
                            oninput="monsterData['${key}']=this.value">
                    </label>`;
                return `<div class="cf-grid">
                    ${f('name','生物名','必填',1)}${f('name_en','英文名','Goblin')}
                    ${f('cr','挑战等级','1/4')}${f('size','体型','小型')}
                    ${f('type','类型','类人（哥布林种）')}${f('legendary','传奇动作','3次/日，可空')}
                    ${f('race','种族','人类')}${f('alignment','阵营','守序邪恶')}
                    ${f('faith','信仰','可空')}${f('gender','性别','可空')}
                </div>`;
            }
            if (monsterSubTab === 'stats') {
                const abRows = Object.keys(MONSTER_AB_CN).map(k => `
                    <label class="cf-field cf-ab">
                        <span class="cf-ab-name">${MONSTER_AB_CN[k]}</span>
                        <input class="cf-input" type="number" min="1" max="30" value="${escHtml(d.abilities[k])}" placeholder="10"
                            oninput="monsterData.abilities['${k}']=this.value;updateMonsterAbMod('${k}')">
                        <span class="cf-ab-mod" id="ab-mod-${k}">${fmtMod(monsterAbilityMod(d.abilities[k]))}</span>
                    </label>`).join('');
                return `<div class="cf-grid">
                    <label class="cf-field">HP（数值+骰子）
                        <input class="cf-input" value="${escHtml(d.hp)}" placeholder="如 22（5D8）" oninput="monsterData.hp=this.value">
                    </label>
                    ${abRows}
                    <label class="cf-field">身高<input class="cf-input" value="${escHtml(d.height)}" placeholder="5尺6寸" oninput="monsterData.height=this.value"></label>
                    <label class="cf-field">体重<input class="cf-input" value="${escHtml(d.weight)}" placeholder="120磅" oninput="monsterData.weight=this.value"></label>
                    <label class="cf-field">速度<input class="cf-input" value="${escHtml(d.speed)}" placeholder="30尺" oninput="monsterData.speed=this.value"></label>
                    <label class="cf-field">被动察觉<input class="cf-input" type="number" value="${escHtml(d.passive_perception)}" placeholder="10" oninput="monsterData.passive_perception=this.value"></label>
                </div>`;
            }
            if (monsterSubTab === 'skills') {
                const saveTags = Object.keys(MONSTER_AB_CN).map(k => {
                    const prof = d.save_proficiencies[k] || {};
                    const amod = monsterAbilityMod(d.abilities[k]);
                    const bonus = prof.is_proficient ? (prof.save_bonus ?? (amod + 2)) : amod;
                    return `<span class="skill-tag${prof.is_proficient ? ' proficient' : ''}" title="点击切换豁免熟练" style="cursor:pointer;display:inline-flex;align-items:center;gap:0.15rem;">
                        <span onclick="toggleMonsterSave('${k}')">${MONSTER_AB_CN[k]}</span>
                        <span class="editable-field" onclick="event.stopPropagation();editMonsterSaveBonus('${k}')" title="点击修改加值" style="font-size:0.75rem;">${fmtMod(bonus)}</span>
                    </span>`;
                }).join('');
                const skillTags = Object.keys(MONSTER_SKILL_AB).map(s => {
                    const prof = d.skill_proficiencies[s] || {};
                    const amod = monsterAbilityMod(d.abilities[MONSTER_SKILL_AB[s]]);
                    const bonus = prof.is_proficient ? (prof.bonus ?? (amod + 2)) : amod;
                    return `<span class="skill-tag${prof.is_proficient ? ' proficient' : ''}" title="点击切换熟练" style="cursor:pointer;display:inline-flex;align-items:center;gap:0.15rem;">
                        <span onclick="toggleMonsterSkill('${s}')">${s}</span>
                        <span class="editable-field" onclick="event.stopPropagation();editMonsterSkillBonus('${s}')" title="点击修改加值" style="font-size:0.75rem;">${fmtMod(bonus)}</span>
                    </span>`;
                }).join('');
                return `<div class="cf-sub-hint">🛡️ 豁免熟练：点击名称切换熟练/取消，点击加值修改</div>
                    <div style="display:flex;flex-wrap:wrap;gap:0.3rem;margin-bottom:0.6rem;">${saveTags}</div>
                    <div class="cf-sub-hint">🎯 技能熟练：点击名称切换熟练/取消，点击加值修改</div>
                    <div style="display:flex;flex-wrap:wrap;gap:0.3rem;">${skillTags}</div>`;
            }
            if (monsterSubTab === 'equip') {
                const weaponRows = (d.weapons || []).map((w, i) => `
                    <div style="background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:0.3rem;margin-bottom:0.3rem;">
                        <div style="display:flex;gap:0.3rem;align-items:center;flex-wrap:wrap;">
                            <input value="${escHtml(w.name||'')}" placeholder="武器名" oninput="monsterData.weapons[${i}].name=this.value" style="width:90px;padding:0.2rem;background:var(--bg);border:1px solid var(--border);border-radius:3px;color:var(--text);font-size:0.75rem;">
                            <span style="font-size:0.75rem;color:var(--text-dim);">命中</span>
                            <input value="${escHtml(w.attack_bonus??'')}" placeholder="+4" oninput="monsterData.weapons[${i}].attack_bonus=this.value" style="width:45px;padding:0.2rem;background:var(--bg);border:1px solid var(--border);border-radius:3px;color:var(--text);font-size:0.75rem;">
                            <span style="font-size:0.75rem;color:var(--text-dim);">伤害</span>
                            <input value="${escHtml(w.damage||'')}" placeholder="1d6+2" oninput="monsterData.weapons[${i}].damage=this.value" style="width:60px;padding:0.2rem;background:var(--bg);border:1px solid var(--border);border-radius:3px;color:var(--text);font-size:0.75rem;">
                            <span style="font-size:0.75rem;color:var(--text-dim);">类型</span>
                            <input value="${escHtml(w.damage_type||'')}" placeholder="挥砍" oninput="monsterData.weapons[${i}].damage_type=this.value" style="width:50px;padding:0.2rem;background:var(--bg);border:1px solid var(--border);border-radius:3px;color:var(--text);font-size:0.75rem;">
                            <button class="cf-del" onclick="removeMonsterWeapon(${i})" title="删除">✕</button>
                        </div>
                        <input value="${escHtml(w.description||'')}" placeholder="描述/特效（可选）" oninput="monsterData.weapons[${i}].description=this.value" style="width:100%;margin-top:0.2rem;padding:0.15rem;background:var(--bg);border:1px solid var(--border);border-radius:3px;color:var(--text);font-size:0.7rem;">
                    </div>`).join('');
                return `<div class="cf-grid">
                    <label class="cf-field">AC<input class="cf-input" type="number" value="${escHtml(d.ac)}" placeholder="12" oninput="monsterData.ac=this.value"></label>
                    <label class="cf-field">装备/护甲<input class="cf-input" value="${escHtml(d.armor)}" placeholder="皮甲，盾" oninput="monsterData.armor=this.value"></label>
                </div>
                <div class="cf-sub-hint" style="margin-top:0.5rem;">⚔️ 武器列表</div>
                ${weaponRows || '<div style="color:var(--text-dim);font-size:0.75rem;">暂无武器</div>'}
                <button class="cf-add-btn" onclick="addMonsterWeapon()" style="margin-top:0.4rem;">➕ 添加武器</button>`;
            }
            // features 分区
            return MONSTER_FEATURE_CATS.map(cat => {
                const list = (d.features[cat.key] || []).map((f, i) => `
                    <div style="display:flex;align-items:flex-start;gap:0.3rem;margin-bottom:0.25rem;padding:0.3rem;background:var(--bg);border:1px solid var(--border);border-radius:4px;">
                        <div style="flex:1;min-width:0;">
                            <div style="font-weight:bold;color:var(--gold);font-size:0.8rem;cursor:pointer;" onclick="editMonsterFeatureName('${cat.key}', ${i})">${escHtml(f.name||'')}</div>
                            <div style="font-size:0.75rem;color:var(--text-dim);margin-top:0.15rem;cursor:pointer;word-break:break-all;" onclick="editMonsterFeatureDesc('${cat.key}', ${i})">${escHtml(f.description||'<span style="font-style:italic;">点击添加描述...</span>')}</div>
                        </div>
                        <button class="cf-del" onclick="removeMonsterFeature('${cat.key}', ${i})" title="删除">✕</button>
                    </div>`).join('');
                return `<div style="font-weight:bold;color:var(--accent);font-size:0.82rem;margin:0.5rem 0 0.3rem;">${cat.title} (${(d.features[cat.key]||[]).length})</div>
                    ${list || '<div style="color:var(--text-dim);font-size:0.75rem;">暂无</div>'}
                    <button class="cf-add-btn" onclick="addMonsterFeature('${cat.key}')" style="margin-top:0.3rem;">➕ 添加${cat.title.replace(/^[^一-龥]+/, '')}</button>`;
            }).join('');
        }

        function updateMonsterAbMod(k) {
            const el = document.getElementById('ab-mod-' + k);
            if (el) el.textContent = fmtMod(monsterAbilityMod(monsterData.abilities[k]));
        }

        // ── 熟练交互（本地状态，点击切换 + 数值弹窗）──
        function toggleMonsterSkill(skillName) {
            const prof = monsterData.skill_proficiencies[skillName] = monsterData.skill_proficiencies[skillName] || {};
            if (prof.is_proficient) {
                delete monsterData.skill_proficiencies[skillName];  // 取消熟练
            } else {
                prof.is_proficient = true;
                prof.bonus = monsterAbilityMod(monsterData.abilities[MONSTER_SKILL_AB[skillName]]) + 2;  // 属性调整+熟练
            }
            renderMonsterSubTab();
        }

        async function editMonsterSkillBonus(skillName) {
            const prof = monsterData.skill_proficiencies[skillName] = monsterData.skill_proficiencies[skillName] || {};
            const current = prof.is_proficient ? (prof.bonus ?? 0) : monsterAbilityMod(monsterData.abilities[MONSTER_SKILL_AB[skillName]]);
            const input = await showPromptDialog(`修改「${skillName}」加值（当前 ${fmtMod(current)}）:`, {defaultValue: current});
            if (input === null) return;
            const bonus = parseInt(input, 10);
            if (isNaN(bonus)) { alert('请输入数字'); return; }
            prof.is_proficient = true;  // 设置加值即视为熟练（词条语义：列出的技能即熟练）
            prof.bonus = bonus;
            renderMonsterSubTab();
        }

        function toggleMonsterSave(k) {
            const prof = monsterData.save_proficiencies[k] = monsterData.save_proficiencies[k] || {};
            if (prof.is_proficient) {
                delete monsterData.save_proficiencies[k];
            } else {
                prof.is_proficient = true;
                prof.save_bonus = monsterAbilityMod(monsterData.abilities[k]) + 2;
            }
            renderMonsterSubTab();
        }

        async function editMonsterSaveBonus(k) {
            const prof = monsterData.save_proficiencies[k] = monsterData.save_proficiencies[k] || {};
            const current = prof.is_proficient ? (prof.save_bonus ?? 0) : monsterAbilityMod(monsterData.abilities[k]);
            const input = await showPromptDialog(`修改「${MONSTER_AB_CN[k]}」豁免加值（当前 ${fmtMod(current)}）:`, {defaultValue: current});
            if (input === null) return;
            const bonus = parseInt(input, 10);
            if (isNaN(bonus)) { alert('请输入数字'); return; }
            prof.is_proficient = true;
            prof.save_bonus = bonus;
            renderMonsterSubTab();
        }

        // ── 武器 ──
        function addMonsterWeapon() {
            monsterData.weapons.push({name:'', attack_bonus:'', damage:'', damage_type:'', description:''});
            renderMonsterSubTab();
        }

        function removeMonsterWeapon(i) {
            monsterData.weapons.splice(i, 1);
            renderMonsterSubTab();
        }

        // ── 特性词条（参考角色卡：prompt 添加 / 点击编辑 / ✕ 删除）──
        async function addMonsterFeature(cat) {
            const name = await showPromptDialog('输入特性名称:');
            if (!name || !name.trim()) return;
            const desc = await showPromptDialog('输入描述（可选）:', {defaultValue: ''}) || '';
            monsterData.features[cat].push({name: name.trim(), description: desc});
            renderMonsterSubTab();
        }

        async function editMonsterFeatureName(cat, i) {
            const name = await showPromptDialog('修改名称:', {defaultValue: monsterData.features[cat][i].name || ''});
            if (!name || !name.trim()) return;
            monsterData.features[cat][i].name = name.trim();
            renderMonsterSubTab();
        }

        async function editMonsterFeatureDesc(cat, i) {
            const desc = await showPromptDialog('修改描述:', {defaultValue: monsterData.features[cat][i].description || ''});
            if (desc === null) return;
            monsterData.features[cat][i].description = desc;
            renderMonsterSubTab();
        }

        function removeMonsterFeature(cat, i) {
            monsterData.features[cat].splice(i, 1);
            renderMonsterSubTab();
        }

        // ── 保存 / 编辑加载 ──
        function buildMonsterDetailText() {
            const d = monsterData;
            const lines = [];
            if (d.ac !== '' && d.ac !== undefined && d.ac !== null) lines.push(`AC ${d.ac}${d.armor ? '（' + d.armor + '）' : ''}`);
            if (d.hp) lines.push(`HP ${d.hp}`);
            if (d.speed) lines.push(`速度 ${d.speed}`);
            const abParts = Object.keys(MONSTER_AB_CN).map(k => {
                const v = d.abilities[k];
                if (v === '' || v === undefined || v === null) return '';
                const n = parseInt(v, 10) || 0;
                return `${MONSTER_AB_CN[k]}${n}(${fmtMod(monsterAbilityMod(v))})`;
            }).filter(Boolean);
            if (abParts.length) lines.push('\n' + abParts.join(' '));
            const saveParts = [];
            for (const k of Object.keys(MONSTER_AB_CN)) {
                const prof = d.save_proficiencies[k];
                if (prof && prof.is_proficient) saveParts.push(`${MONSTER_AB_CN[k]}+${prof.save_bonus ?? (monsterAbilityMod(d.abilities[k]) + 2)}`);
            }
            if (saveParts.length) lines.push('\n豁免：' + saveParts.join('，'));
            const skillParts = [];
            for (const s of Object.keys(MONSTER_SKILL_AB)) {
                const prof = d.skill_proficiencies[s];
                if (prof && prof.is_proficient) skillParts.push(`${s}+${prof.bonus ?? (monsterAbilityMod(d.abilities[MONSTER_SKILL_AB[s]]) + 2)}`);
            }
            if (skillParts.length) lines.push(`技能：${skillParts.join('，')}`);
            if (d.passive_perception !== '' && d.passive_perception !== undefined && d.passive_perception !== null) lines.push(`感官：被动察觉${d.passive_perception}`);
            const meta = [];
            if (d.race) meta.push(`种族：${d.race}`);
            if (d.alignment) meta.push(`阵营：${d.alignment}`);
            if (d.faith) meta.push(`信仰：${d.faith}`);
            if (d.gender) meta.push(`性别：${d.gender}`);
            if (meta.length) lines.push(meta.join('  '));
            if (d.height || d.weight) lines.push(`身高：${d.height || '—'}  体重：${d.weight || '—'}`);
            if (d.cr) lines.push(`挑战等级：${d.cr}`);
            for (const cat of MONSTER_FEATURE_CATS) {
                const list = d.features[cat.key] || [];
                if (list.length) {
                    lines.push('\n【' + cat.title.replace(/^[^一-龥]+/, '') + '】');
                    list.forEach(f => lines.push(`${f.name}${f.description ? '：' + f.description : ''}`));
                }
            }
            if (d.weapons && d.weapons.length) {
                lines.push('\n【武器】');
                d.weapons.forEach(w => {
                    if (!w.name && !w.damage) return;
                    let s = (w.name || '未命名武器') + '：';
                    if (w.description) {
                        s += w.description;
                    } else {
                        s += '近战武器';
                        if (w.attack_bonus !== '' && w.attack_bonus !== undefined && w.attack_bonus !== null) s += `，命中+${String(w.attack_bonus).replace(/^\+/, '')}`;
                        if (w.damage) s += `。击中：${w.damage}${w.damage_type ? ' ' + w.damage_type + '伤害' : ''}`;
                    }
                    lines.push(s);
                });
            }
            if (d.extra_text && d.extra_text.trim()) lines.push('\n' + d.extra_text.trim());
            return lines.join('\n').replace(/\n{3,}/g, '\n\n').trim();
        }

        async function saveMonsterEntry() {
            const d = monsterData;
            if (!d.name || !d.name.trim()) { alert('请输入生物名'); return; }
            const isEdit = !!monsterEditName;
            const payload = {
                name: d.name.trim(), name_en: d.name_en, cr: d.cr, size: d.size, type: d.type,
                legendary: d.legendary, race: d.race, alignment: d.alignment, faith: d.faith, gender: d.gender,
                hp: d.hp, abilities: d.abilities, height: d.height, weight: d.weight, speed: d.speed,
                passive_perception: d.passive_perception, ac: d.ac, armor: d.armor, weapons: d.weapons,
                skill_proficiencies: d.skill_proficiencies, save_proficiencies: d.save_proficiencies,
                features: d.features, detail_text: buildMonsterDetailText(),
            };
            const url = isEdit ? `/api/custom/monsters?name=${encodeURIComponent(monsterEditName)}` : '/api/custom/monsters';
            const resp = await fetch(url, {
                method: isEdit ? 'PUT' : 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            const result = await resp.json();
            if (result.error) { alert(result.error); return; }
            alert(isEdit ? '✅ "' + d.name.trim() + '" 已更新' : '✅ "' + d.name.trim() + '" 已添加到资料库');
            resetMonsterForm();
            loadCustomList('monsters');
        }

        async function editMonsterEntry(name) {
            const resp = await fetch('/api/custom/monsters');
            const data = await resp.json();
            const e = (data.results || []).find(x => x.name === name);
            if (!e) { alert('未找到该条目'); return; }
            monsterEditName = e.name;
            const nd = newMonsterData();
            nd.name = e.name || ''; nd.name_en = e.name_en || ''; nd.cr = e.cr || ''; nd.size = e.size || ''; nd.type = e.type || '';
            nd.legendary = e.legendary || ''; nd.race = e.race || ''; nd.alignment = e.alignment || ''; nd.faith = e.faith || ''; nd.gender = e.gender || '';
            nd.hp = e.hp || ''; nd.height = e.height || ''; nd.weight = e.weight || ''; nd.speed = e.speed || '';
            nd.passive_perception = e.passive_perception || '';
            nd.ac = e.ac || ''; nd.armor = e.armor || '';
            nd.weapons = Array.isArray(e.weapons) ? e.weapons.map(w => Object.assign({}, w)) : [];
            nd.skill_proficiencies = Object.assign({}, e.skill_proficiencies || {});
            nd.save_proficiencies = Object.assign({}, e.save_proficiencies || {});
            if (e.abilities && typeof e.abilities === 'object') {
                for (const k of Object.keys(MONSTER_AB_CN)) {
                    if (e.abilities[k] !== undefined && e.abilities[k] !== null) nd.abilities[k] = e.abilities[k];
                }
            }
            if (e.features && typeof e.features === 'object') {
                for (const cat of MONSTER_FEATURE_CATS) {
                    if (Array.isArray(e.features[cat.key])) nd.features[cat.key] = e.features[cat.key].map(f => Object.assign({}, f));
                }
            }
            // 旧格式条目（无结构化字段）：原 detail_text 放入补充区防覆盖丢失
            if (!('hp' in e) && !e.abilities && e.detail_text) nd.extra_text = e.detail_text;
            monsterData = nd;
            monsterSubTab = 'base';
            renderMonsterForm();
            alert('正在编辑 "' + name + '"，修改完成后点「💾 保存修改」');
        }

        function resetMonsterForm() {
            monsterEditName = '';
            monsterData = newMonsterData();
            monsterSubTab = 'base';
            renderMonsterForm();
        }

        async function loadCustomList(kind) {
            const el = document.getElementById('custom-list');
            if (!el) return;
            try {
                const resp = await fetch('/api/custom/' + kind);
                const data = await resp.json();
                if (!data.results.length) { el.innerHTML = '<div style="color:var(--text-dim);text-align:center;padding:0.5rem;">暂无自定义条目</div>'; return; }
                el.innerHTML = data.results.map(e => {
                    const nm = escHtml(e.name).replace(/'/g, "\\'");
                    return `
                    <div class="custom-entry">
                        <span class="custom-entry-name">${escHtml(e.name)}</span>
                        ${kind === 'monsters' ? `<button class="custom-entry-edit" onclick="editMonsterEntry('${nm}')" title="编辑">✏️</button>` : ''}
                        ${kind === 'monsters' ? `<button class="custom-entry-pdf" onclick="exportMonsterPdf('${nm}')" title="导出 PDF">📄</button>` : ''}
                        <button class="custom-entry-del" onclick="deleteCustom('${kind}','${nm}')">✕</button>
                    </div>`;
                }).join('');
            } catch(e) {}
        }

        async function deleteCustom(kind, name) {
            if (!await showConfirmDialog('删除 "' + name + '"？')) return;
            await fetch('/api/custom/' + kind + '?name=' + encodeURIComponent(name), {method:'DELETE'});
            loadCustomList(kind);
        }

        // 生物导出为词条卡 PDF（v5.11）
        function exportMonsterPdf(name) {
            window.open('/api/custom/monsters/' + encodeURIComponent(name) + '/export-pdf', '_blank');
        }

        // 初始加载
        loadConditions();
        loadSkills();
        switchCustomTab('spells');

        // ━━━ 服务器资源库 ━━━
        function uploadResource(input) {
            var file = input.files && input.files[0];
            if (!file) return;
            var maxSize = 50 * 1024 * 1024;
            if (file.size > maxSize) { alert('文件过大 (' + (file.size/1024/1024).toFixed(1) + 'MB)，最大50MB'); input.value = ''; return; }
            var formData = new FormData();
            formData.append('file', file);
            var listEl = document.getElementById('resources-list');
            listEl.innerHTML = '<div style="color:var(--gold);text-align:center;padding:1rem;">⏳ 上传中...</div>';
            fetch('/api/resources/upload', {method:'POST', body:formData})
            .then(function(r) { return r.json(); })
            .then(function(d) {
                if (d.success) {
                    loadResources('');  // 刷新全部列表
                    input.value = '';
                } else {
                    listEl.innerHTML = '<div style="color:var(--red);text-align:center;padding:1rem;">上传失败: ' + (d.error || '未知错误') + '</div>';
                }
            }).catch(function(e) {
                listEl.innerHTML = '<div style="color:var(--red);text-align:center;padding:1rem;">上传失败: ' + e.message + '</div>';
                input.value = '';
            });
        }

        function loadResources(cat) {
            cat = cat || '';
            const listEl = document.getElementById('resources-list');
            listEl.innerHTML = '<div style="color:var(--text-dim);text-align:center;padding:1rem;">加载中...</div>';
            // Highlight active category button
            document.querySelectorAll('[id^="res-btn-"]').forEach(b => b.style.background = '');
            const activeBtn = document.getElementById('res-btn-' + (cat || 'all'));
            if (activeBtn) activeBtn.style.background = 'var(--accent)';

            const url = '/api/resources' + (cat ? '?cat=' + cat : '');
            fetch(url).then(r => r.json()).then(data => {
                if (!data.resources || data.resources.length === 0) {
                    listEl.innerHTML = '<div style="color:var(--text-dim);text-align:center;padding:1rem;font-size:0.85rem;">暂无资源文件<br><small>将规则书/图片/笔记等放入 骰娘/resources/ 目录</small></div>';
                    return;
                }
                listEl.innerHTML = data.resources.map(r => {
                    const sizeColor = r.size_kb > 5000 ? 'var(--red)' : 'var(--text-dim)';
                    const isImage = r.category === 'img';
                    const encUrl = encodeURI(r.url);
                    return '<div ' +
                        'style="display:flex;align-items:center;gap:0.5rem;padding:0.5rem 0.6rem;background:var(--bg);border-radius:6px;margin-bottom:0.25rem;border:1px solid var(--border);font-size:0.85rem;transition:all 0.15s;" ' +
                        'onmouseover="this.style.borderColor=\'var(--accent)\'" onmouseout="this.style.borderColor=\'var(--border)\'">' +
                        '<span style="font-size:1.3rem;">' + r.icon + '</span>' +
                        '<span style="flex:1;font-weight:bold;">' + r.name + '</span>' +
                        '<span style="color:' + sizeColor + ';font-size:0.7rem;">' + r.size_display + '</span>' +
                        '<span style="color:var(--text-dim);font-size:0.7rem;margin-right:0.3rem;">.' + r.ext + '</span>' +
                        (isImage ? '<button class="res-action-btn preview-btn" onclick="previewResource(\'' + encUrl + '\',\'' + escHtml(r.name).replace(/'/g,"\\'") + '\')" title="预览图片">👁 预览</button>' : '') +
                        '<button class="res-action-btn download-btn" onclick="downloadResource(\'' + encUrl + '\',\'' + escHtml(r.name).replace(/'/g,"\\'") + '\')" title="下载文件">⬇ 下载</button>' +
                        '</div>';
                }).join('');
            }).catch(() => {
                listEl.innerHTML = '<div style="color:var(--red);text-align:center;padding:1rem;">加载失败</div>';
            });
        }

        // ━━━ 图片预览 ━━━
        function previewResource(url, name) {
            const overlay = document.getElementById('image-preview-overlay');
            const img = document.getElementById('image-preview-img');
            const closeBtn = document.getElementById('image-preview-close');
            img.src = url;
            img.alt = name;
            overlay.classList.add('show');
            closeBtn.classList.add('show');
            // 按 ESC 关闭
            document.addEventListener('keydown', _onPreviewKeydown);
        }

        function closeImagePreview() {
            const overlay = document.getElementById('image-preview-overlay');
            const closeBtn = document.getElementById('image-preview-close');
            overlay.classList.remove('show');
            closeBtn.classList.remove('show');
            document.getElementById('image-preview-img').src = '';
            document.removeEventListener('keydown', _onPreviewKeydown);
        }

        function _onPreviewKeydown(e) {
            if (e.key === 'Escape') { closeImagePreview(); }
        }

        // ━━━ 资源下载 ━━━
        function downloadResource(url, name) {
            const a = document.createElement('a');
            a.href = url;
            a.download = name;
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
