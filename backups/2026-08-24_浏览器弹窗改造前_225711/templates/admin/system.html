{% extends "base.html" %}
{% block title %}系统维护{% endblock %}
{% block page_title %}⚙️ 系统维护{% endblock %}

{% block content %}
<div id="system-area">
    <div class="loading">加载中...</div>
</div>

<script>
async function loadSystem() {
    const area = document.getElementById('system-area');
    try {
        const data = await Admin.get('/admin/api/system/info');
        area.innerHTML = `
            <div class="card">
                <div class="card-header">🖥️ 运行环境</div>
                <div class="detail-grid">
                    <div class="detail-item"><div class="detail-label">Python 版本</div><div class="detail-value">${data.python_version}</div></div>
                    <div class="detail-item"><div class="detail-label">操作系统</div><div class="detail-value">${data.platform}</div></div>
                    <div class="detail-item"><div class="detail-label">数据库类型</div><div class="detail-value">${data.database_url.toUpperCase()}</div></div>
                    <div class="detail-item"><div class="detail-label">服务端口</div><div class="detail-value">${data.port}</div></div>
                    <div class="detail-item"><div class="detail-label">调试模式</div><div class="detail-value">${data.debug ? '<span class="badge badge-warning">开启</span>' : '<span class="badge badge-success">关闭</span>'}</div></div>
                    <div class="detail-item"><div class="detail-label">数据库文件大小</div><div class="detail-value">${data.db_size_mb} MB</div></div>
                    <div class="detail-item"><div class="detail-label">日志目录大小</div><div class="detail-value">${data.log_size_mb} MB</div></div>
                </div>
            </div>

            <div class="card" style="margin-top:20px;">
                <div class="card-header">📦 数据表统计</div>
                <div class="detail-grid">
                    ${Object.entries(data.table_counts).map(([name, count]) => `
                        <div class="detail-item"><div class="detail-label">${name}</div><div class="detail-value">${count} 行</div></div>
                    `).join('')}
                </div>
            </div>

            <div class="card" style="margin-top:20px;">
                <div class="card-header">💾 数据维护</div>
                <p style="font-size:13px;color:var(--text-secondary);margin-bottom:14px;">
                    将当前骰子统计和事件统计生成快照并重置。快照文件保存在 <code>data/stats_archive/</code> 目录。
                </p>
                <button class="btn btn-primary" onclick="runArchive()">📦 归档统计快照</button>
                <span id="archive-msg" style="margin-left:12px;font-size:13px;"></span>
            </div>
        `;
    } catch (e) {
        area.innerHTML = '<div class="empty-state"><div class="empty-text" style="color:var(--danger);">加载失败</div></div>';
    }
}

async function runArchive() {
    const ok = await Admin.confirm('归档统计', '确定要归档当前统计数据并重置吗？');
    if (!ok) return;
    try {
        const data = await Admin.post('/admin/api/archive-stats');
        const el = document.getElementById('archive-msg');
        el.textContent = `✅ 完成！快照: ${data.snapshot_time}`;
        el.style.color = 'var(--success)';
    } catch (e) {
        const el = document.getElementById('archive-msg');
        el.textContent = '归档失败';
        el.style.color = 'var(--danger)';
    }
}

loadSystem();
</script>
{% endblock %}
