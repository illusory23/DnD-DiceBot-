<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}管理后台{% endblock %} — 尘封之卷</title>
    <link rel="stylesheet" href="/static/admin/admin.css">
    <script src="/static/admin/admin.js?v=2"></script>
    {% block extra_head %}{% endblock %}
  <script src="/static/common-dialog.js"></script>
</head>
<body>
<!-- 侧栏 -->
<aside class="admin-sidebar">
    <a href="/admin/" class="sidebar-brand">
        <span class="icon">🔒</span> <span>尘封之卷</span>
    </a>
    <nav class="sidebar-nav">
        <a href="/admin/">
            <span class="nav-icon">📊</span> <span class="nav-text">系统总览</span>
        </a>
        <a href="/admin/users">
            <span class="nav-icon">👥</span> <span class="nav-text">用户管理</span>
        </a>
        <a href="/admin/characters">
            <span class="nav-icon">🎭</span> <span class="nav-text">角色管理</span>
        </a>
        <a href="/admin/chat">
            <span class="nav-icon">💬</span> <span class="nav-text">聊天管理</span>
        </a>
        <a href="/admin/stats">
            <span class="nav-icon">📈</span> <span class="nav-text">统计中心</span>
        </a>
        <a href="/admin/errors">
            <span class="nav-icon">🐛</span> <span class="nav-text">错误监控</span>
        </a>
        <a href="/admin/audit">
            <span class="nav-icon">📜</span> <span class="nav-text">审计日志</span>
        </a>
        <a href="/admin/backups">
            <span class="nav-icon">🗄️</span> <span class="nav-text">数据备份</span>
        </a>
        <a href="/admin/topics">
            <span class="nav-icon">📰</span> <span class="nav-text">每周话题</span>
        </a>
        <a href="/admin/community">
            <span class="nav-icon">🧭</span> <span class="nav-text">社区内容</span>
        </a>
        <a href="/admin/announcements">
            <span class="nav-icon">📢</span> <span class="nav-text">平台公告</span>
        </a>
        <a href="/admin/system">
            <span class="nav-icon">⚙️</span> <span class="nav-text">系统维护</span>
        </a>
        <a href="/admin/content">
            <span class="nav-icon">📦</span> <span class="nav-text">内容管理</span>
        </a>
    </nav>
    <div class="sidebar-footer">
        <div class="user-info">👤 {{ admin_username or '管理员' }}</div>
        <a href="#" class="logout-link" id="btn-logout">退出登录</a>
    </div>
</aside>

<!-- 顶栏 -->
<header class="admin-topbar">
    <span class="topbar-title">{% block page_title %}管理后台{% endblock %}</span>
    <div class="topbar-actions">
        <a href="/" target="_blank" class="btn btn-sm btn-secondary">🏠 前台首页</a>
    </div>
</header>

<!-- 主内容区 -->
<main class="admin-main">
    {% block content %}{% endblock %}
</main>

{% block extra_scripts %}{% endblock %}
</body>
</html>
