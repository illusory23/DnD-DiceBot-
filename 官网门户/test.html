<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>北境雪原 · 苍白大地</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            height: 100vh;
            background: #0a0e14;
            font-family: 'Segoe UI', 'PingFang SC', Arial, sans-serif;
        }

        #bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -1;
            object-fit: cover;
            background: #0a0e14;
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: rgba(0, 0, 0, 0.15);
            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            pointer-events: none;
            user-select: none;
            opacity: 1;
            /* ⭐ 4秒后开始淡出，持续2秒 */
            animation: fadeOut 2s ease forwards 4s;
        }

        .content h1 {
            font-size: 4rem;
            font-weight: 200;
            letter-spacing: 0.5em;
            color: rgba(255, 255, 255, 0.7);
            text-shadow: 0 4px 60px rgba(0, 0, 0, 0.9);
            background: rgba(0, 0, 0, 0.12);
            padding: 0.5rem 2rem;
            border-radius: 4px;
            backdrop-filter: blur(2px);
        }

        .content p {
            font-size: 1.1rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 1.2rem;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.8);
        }

        @keyframes fadeOut {
            0% {
                opacity: 1;
            }
            100% {
                opacity: 0;
            }
        }

        @media (max-width: 768px) {
            .content h1 {
                font-size: 2rem;
                letter-spacing: 0.25em;
                padding: 0.4rem 1.2rem;
            }
            .content p {
                font-size: 0.8rem;
            }
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0e14;
            z-index: 1000;
            color: rgba(255, 255, 255, 0.25);
            font-size: 1.1rem;
            letter-spacing: 0.2em;
            font-weight: 300;
            transition: opacity 0.8s ease;
        }
        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #loading .spinner {
            width: 36px;
            height: 36px;
            border: 2px solid rgba(255, 255, 255, 0.04);
            border-top-color: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 18px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #error-msg {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1001;
            color: rgba(255, 255, 255, 0.5);
            background: rgba(0, 0, 0, 0.8);
            padding: 2rem 3rem;
            border-radius: 8px;
            text-align: center;
            font-size: 0.95rem;
            line-height: 1.8;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        #error-msg strong {
            color: rgba(255, 200, 150, 0.7);
        }
    </style>
</head>
<body>

    <div id="loading">
        <div class="spinner"></div>
        <span>加载场景...</span>
    </div>

    <div id="error-msg">
        <div style="font-size:2.4rem;margin-bottom:0.5rem;">🎬</div>
        <strong>视频加载失败</strong><br>
        请确认视频文件是否存在，路径是否正确。<br>
        <span style="font-size:0.8rem;opacity:0.5;">按 F12 查看控制台错误信息</span>
    </div>

    <video id="bg-video" autoplay muted loop playsinline>
        <source src="可用2.mp4" type="video/mp4">
        你的浏览器不支持 HTML5 视频。
    </video>

    <div id="overlay"></div>

    <div class="content">
        <h1>❄️ 北境 · 苍白大地</h1>
    </div>

    <script>
        (function() {
            const video = document.getElementById('bg-video');
            const loading = document.getElementById('loading');
            const errorMsg = document.getElementById('error-msg');

            let loadingHidden = false;

            function hideLoading() {
                if (loadingHidden) return;
                loadingHidden = true;
                loading.classList.add('hidden');
            }

            function showError() {
                hideLoading();
                errorMsg.style.display = 'block';
            }

            video.addEventListener('canplay', hideLoading);

            if (video.readyState >= 3) {
                hideLoading();
            }

            setTimeout(hideLoading, 5000);

            video.addEventListener('error', function(e) {
                console.error('视频加载错误:', e);
                showError();
            });

            setTimeout(function() {
                if (video.readyState === 0) {
                    console.warn('视频可能未加载，检查路径是否正确');
                }
            }, 3000);
        })();
    </script>

</body>
</html>
