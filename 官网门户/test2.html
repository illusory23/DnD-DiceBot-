<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>北境雪原 · 苍白大地</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            height: 100vh;
            background: #0a0e14;
            font-family: 'Segoe UI', 'PingFang SC', Arial, sans-serif;
        }

        /* ========== 视频容器 ========== */
        #video-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: #0a0e14;
            /* 视频本身的淡入淡出（首尾衔接） */
            animation: videoFadeCycle 10s ease-in-out infinite;
        }

        #bg-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 
            视频首尾渐隐渐显循环：
            - 0%   ~ 5%   : 淡入（视频开头）
            - 5%   ~ 90%  : 完全显示
            - 90%  ~ 100% : 淡出（视频结尾）
            配合 JS 的 currentTime 跳转，实现无缝衔接
        */
        @keyframes videoFadeCycle {
            0% {
                opacity: 0;
            }
            5% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                opacity: 0;
            }
        }

        /* ========== 遮罩层 ========== */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: rgba(0, 0, 0, 0.15);
            pointer-events: none;
        }

        /* ========== 标题文字 ========== */
        .content {
            position: relative;
            z-index: 1;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            pointer-events: none;
            user-select: none;
            animation: titleFadeOut 5s ease forwards;
        }

        .content h1 {
            font-size: 4rem;
            font-weight: 200;
            letter-spacing: 0.5em;
            color: rgba(255, 255, 255, 0.7);
            text-shadow: 0 4px 60px rgba(0, 0, 0, 0.9);
            background: rgba(0, 0, 0, 0.12);
            padding: 0.5rem 2rem;
            border-radius: 4px;
            backdrop-filter: blur(2px);
        }

        @keyframes titleFadeOut {
            0% {
                opacity: 1;
            }
            60% {
                opacity: 1;
            }
            100% {
                opacity: 0;
            }
        }

        @media (max-width: 768px) {
            .content h1 {
                font-size: 2rem;
                letter-spacing: 0.25em;
                padding: 0.4rem 1.2rem;
            }
        }

        /* ========== 加载 ========== */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0e14;
            z-index: 1000;
            color: rgba(255, 255, 255, 0.25);
            font-size: 1.1rem;
            letter-spacing: 0.2em;
            font-weight: 300;
            transition: opacity 0.8s ease;
        }
        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #loading .spinner {
            width: 36px;
            height: 36px;
            border: 2px solid rgba(255, 255, 255, 0.04);
            border-top-color: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 18px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #error-msg {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1001;
            color: rgba(255, 255, 255, 0.5);
            background: rgba(0, 0, 0, 0.8);
            padding: 2rem 3rem;
            border-radius: 8px;
            text-align: center;
            font-size: 0.95rem;
            line-height: 1.8;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        #error-msg strong {
            color: rgba(255, 200, 150, 0.7);
        }

        /* ========== 循环衔接黑幕遮罩（辅助） ========== */
        #loop-fade {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: #0a0e14;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s ease;
        }
    </style>
</head>
<body>

    <div id="loading">
        <div class="spinner"></div>
        <span>加载场景...</span>
    </div>

    <div id="error-msg">
        <div style="font-size:2.4rem;margin-bottom:0.5rem;">🎬</div>
        <strong>视频加载失败</strong><br />
        请确认视频文件是否存在，路径是否正确。<br />
        <span style="font-size:0.8rem;opacity:0.5;">按 F12 查看控制台错误信息</span>
    </div>

    <!-- ====== 视频容器（带 CSS 淡入淡出） ====== -->
    <div id="video-wrapper">
        <video id="bg-video" autoplay muted playsinline>
            <source src="可用2.mp4" type="video/mp4" />
        </video>
    </div>

    <!-- 辅助黑幕遮罩 -->
    <div id="loop-fade"></div>

    <div id="overlay"></div>

    <div class="content">
        <h1>❄️ 北境 · 苍白大地</h1>
    </div>

    <script>
        (function() {
            const video = document.getElementById('bg-video');
            const wrapper = document.getElementById('video-wrapper');
            const loading = document.getElementById('loading');
            const errorMsg = document.getElementById('error-msg');
            const fade = document.getElementById('loop-fade');

            let loadingHidden = false;
            let isCycling = false;

            function hideLoading() {
                if (loadingHidden) return;
                loadingHidden = true;
                loading.classList.add('hidden');
            }

            function showError() {
                hideLoading();
                errorMsg.style.display = 'block';
            }

            video.addEventListener('canplay', hideLoading);
            if (video.readyState >= 3) hideLoading();
            setTimeout(hideLoading, 5000);
            video.addEventListener('error', showError);

            // ============================================================
            // 核心：视频循环衔接（CSS 淡入淡出 + JS 跳转）
            // ============================================================
            video.addEventListener('timeupdate', function() {
                if (isCycling) return;

                const duration = video.duration;
                const current = video.currentTime;

                // 播放到末尾最后 0.5 秒时触发循环
                if (duration && current >= duration - 0.5) {
                    isCycling = true;

                    // 1. 黑幕遮罩淡入（掩盖跳转瞬间）
                    fade.style.opacity = '1';

                    // 2. 等待遮罩完全显现后，跳转到开头
                    setTimeout(() => {
                        video.currentTime = 0;

                        // 3. 短暂延迟后淡出遮罩（视频已回到开头）
                        setTimeout(() => {
                            fade.style.opacity = '0';

                            // 4. 重置状态
                            setTimeout(() => {
                                isCycling = false;
                            }, 200);
                        }, 100);
                    }, 150);
                }
            });

            // 兜底：防止视频暂停
            video.addEventListener('pause', function() {
                if (!video.ended) {
                    video.play().catch(() => {});
                }
            });

            video.addEventListener('ended', function() {
                video.currentTime = 0;
                video.play().catch(() => {});
            });

            // 如果视频时长无效，给出警告
            video.addEventListener('loadedmetadata', function() {
                if (!isFinite(video.duration)) {
                    console.warn('视频时长无效，循环功能可能受影响');
                }
            });

            // 额外：播放失败时重试
            video.addEventListener('play', function() {
                // 恢复 wrapper 动画（如果被暂停）
                wrapper.style.animationPlayState = 'running';
            });
        })();
    </script>
</body>
</html>
