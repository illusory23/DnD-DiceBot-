<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>❄️ 北境 · 苍白大地</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #bgVideo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            display: block;
        }

        #staticBgCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            display: none;
        }

        #snowCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
            opacity: 0;
            transition: opacity 3s ease-out;
        }

        #auroraCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            opacity: 0;
            transition: opacity 4s ease-out;
        }

        .main-title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(2rem, 8vw, 5rem);
            color: #ffffff;
            text-shadow: 0 0 15px #bce0ff, 0 0 30px #74b9ff;
            letter-spacing: 6px;
            z-index: 10;
            opacity: 1;
            transition: opacity 2s ease-out;
            white-space: nowrap;
        }

        .main-title.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .loading-box {
            position: absolute;
            inset: 0;
            background: #0c1622;
            z-index: 99;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #d0e8ff;
            gap: 20px;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(180, 220, 255, 0.2);
            border-top-color: #88ccff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-tip {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff8888;
            font-size: 18px;
            text-align: center;
            z-index: 100;
            padding: 24px;
            background: rgba(0,0,0,0.7);
            border-radius: 12px;
            line-height: 1.7;
        }

        .loading-box.hidden {
            display: none;
        }

        .brand-link {
            position: absolute;
            top: 16px;
            left: 20px;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            padding: 8px 14px;
            background: rgba(10, 10, 20, 0.75);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 6px;
            backdrop-filter: blur(6px);
            transition: all 0.3s;
        }

        .brand-link:hover {
            background: rgba(18, 18, 42, 0.9);
            border-color: rgba(255, 215, 0, 0.6);
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.2);
        }

        .brand-link .brand-icon {
            width: 28px;
            height: 28px;
            flex-shrink: 0;
        }

        .brand-link .brand-text {
            font-size: 0.9rem;
            font-weight: bold;
            color: #ffd700;
            letter-spacing: 1px;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        /* 音频提示按钮 */
        #audioHint {
            position: absolute;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(4px);
            cursor: pointer;
            transition: opacity 0.8s ease;
        }

        #audioHint.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .audio-hint-content {
            text-align: center;
            color: white;
            font-size: clamp(1.2rem, 4vw, 2.5rem);
            text-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            animation: pulse 2s ease-in-out infinite;
        }

        .audio-hint-content .icon {
            font-size: clamp(60px, 12vw, 100px);
            margin-bottom: 16px;
            display: block;
        }

        .audio-hint-content .sub-text {
            font-size: clamp(0.8rem, 2vw, 1.2rem);
            opacity: 0.7;
            margin-top: 8px;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 品牌链接 -->
        <a class="brand-link" href="index.html" title="返回官网">
            <svg class="brand-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#f6d365"/>
                        <stop offset="40%" style="stop-color:#fda085"/>
                        <stop offset="100%" style="stop-color:#f6d365"/>
                    </linearGradient>
                </defs>
                <rect x="20" y="20" width="60" height="60" fill="none" stroke="url(#bg)" stroke-width="3"/>
                <rect x="20" y="20" width="60" height="60" transform="rotate(45,50,50)" fill="none" stroke="url(#bg)" stroke-width="3"/>
                <circle cx="50" cy="14" r="2.5" fill="url(#bg)"/>
                <circle cx="76" cy="24" r="2.5" fill="url(#bg)"/>
                <circle cx="86" cy="50" r="2.5" fill="url(#bg)"/>
                <circle cx="76" cy="76" r="2.5" fill="url(#bg)"/>
                <circle cx="50" cy="86" r="2.5" fill="url(#bg)"/>
                <circle cx="24" cy="76" r="2.5" fill="url(#bg)"/>
                <circle cx="14" cy="50" r="2.5" fill="url(#bg)"/>
                <circle cx="24" cy="24" r="2.5" fill="url(#bg)"/>
                <circle cx="50" cy="50" r="5" fill="url(#bg)"/>
            </svg>
            <span class="brand-text">尘封之卷</span>
        </a>

        <!-- 视频背景 -->
        <video id="bgVideo" preload="auto" muted playsinline webkit-playsinline>
            <source src="可用2.mp4" type="video/mp4">
        </video>

        <!-- Canvas 图层 -->
        <canvas id="staticBgCanvas"></canvas>
        <canvas id="auroraCanvas"></canvas>
        <canvas id="snowCanvas"></canvas>

        <!-- 标题 -->
        <h1 class="main-title">❄️ 北境 · 苍白大地</h1>

        <!-- 加载提示 -->
        <div class="loading-box" id="loadingWrap">
            <div class="loading-spinner"></div>
            <p>北境雪原加载中...</p>
        </div>

        <!-- 错误提示 -->
        <div class="error-tip" id="errorBox">
            视频文件「可用2.mp4」加载失败<br>
            请确认视频文件和HTML放在同一文件夹
        </div>

        <!-- 音频提示：点击开启声音 -->
        <div id="audioHint">
            <div class="audio-hint-content">
                <span class="icon">🎵</span>
                点击开启声音
                <div class="sub-text">点击页面任意位置播放声音</div>
            </div>
        </div>
    </div>

    <script>
        // ===================== DOM 引用 =====================
        const video = document.getElementById('bgVideo');
        const staticCanvas = document.getElementById('staticBgCanvas');
        const staticCtx = staticCanvas.getContext('2d');
        const snowCanvas = document.getElementById('snowCanvas');
        const snowCtx = snowCanvas.getContext('2d');
        const auroraCanvas = document.getElementById('auroraCanvas');
        const auroraCtx = auroraCanvas.getContext('2d');
        const title = document.querySelector('.main-title');
        const loadingWrap = document.getElementById('loadingWrap');
        const errorBox = document.getElementById('errorBox');
        const audioHint = document.getElementById('audioHint');

        // ===================== 状态变量 =====================
        let videoEnded = false;
        let animationId = null;
        let auroraTime = 0;
        let audioEnabled = false;

        // ===================== Canvas 尺寸自适应 =====================
        function resizeCanvas() {
            const w = window.innerWidth;
            const h = window.innerHeight;

            staticCanvas.width = w;
            staticCanvas.height = h;
            snowCanvas.width = w;
            snowCanvas.height = h;
            auroraCanvas.width = w;
            auroraCanvas.height = h;
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // ===================== 音频开启逻辑 =====================
        function enableAudio() {
            if (audioEnabled) return;
            
            video.muted = false;
            video.volume = 0.8;
            audioEnabled = true;
            
            // 如果视频暂停了，重新播放
            if (video.paused) {
                video.play().catch(() => {});
            }
            
            // 隐藏提示
            audioHint.classList.add('hidden');
            
            console.log('🔊 声音已开启');
        }

        // 点击页面任意位置开启声音（全局捕获）
        document.addEventListener('click', enableAudio, { once: false });
        document.addEventListener('touchstart', enableAudio, { once: false });

        // 但为了防止误触，我们只让第一次点击生效，之后不再触发
        // 用 once: true 会导致 touch 和 click 各触发一次，所以用标志控制
        const originalEnable = enableAudio;
        enableAudio = function() {
            if (!audioEnabled) {
                originalEnable();
            }
        };
        // 重新绑定
        document.removeEventListener('click', enableAudio);
        document.removeEventListener('touchstart', enableAudio);
        document.addEventListener('click', function handler() {
            if (!audioEnabled) {
                video.muted = false;
                video.volume = 0.8;
                audioEnabled = true;
                if (video.paused) {
                    video.play().catch(() => {});
                }
                audioHint.classList.add('hidden');
                console.log('🔊 声音已开启');
            }
        }, { once: false });

        // 为触摸设备单独处理
        document.addEventListener('touchstart', function handlerTouch() {
            if (!audioEnabled) {
                video.muted = false;
                video.volume = 0.8;
                audioEnabled = true;
                if (video.paused) {
                    video.play().catch(() => {});
                }
                audioHint.classList.add('hidden');
                console.log('🔊 声音已开启（触摸）');
            }
        }, { once: false });

        // ===================== 标题淡出 =====================
        setTimeout(() => {
            title.classList.add('fade-out');
            setTimeout(() => title.style.display = 'none', 2000);
        }, 3000);

        // ===================== 视频事件 =====================
        video.addEventListener('loadeddata', () => {
            loadingWrap.classList.add('hidden');
            // 先静音播放，保证自动播放不被阻止
            video.muted = true;
            video.play().catch(err => console.log('自动播放启动:', err));
        });

        video.addEventListener('error', () => {
            loadingWrap.classList.add('hidden');
            errorBox.style.display = 'block';
            audioHint.style.display = 'none'; // 视频加载失败，隐藏音频提示
        });

        // 视频结束后：截取最后一帧，显示风雪和极光
        video.addEventListener('ended', () => {
            videoEnded = true;

            // 截取视频最后一帧作为静态背景
            staticCtx.drawImage(
                video,
                0, 0, video.videoWidth, video.videoHeight,
                0, 0, staticCanvas.width, staticCanvas.height
            );

            video.style.display = 'none';
            staticCanvas.style.display = 'block';
            video.pause();

            // 定格画面出现后，风雪和极光逐渐显现
            setTimeout(() => {
                auroraCanvas.style.opacity = '1';
                snowCanvas.style.opacity = '1';
            }, 600);
        });

        // ===================== 风雪粒子系统 =====================
        class Snowflake {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * snowCanvas.width;
                this.y = Math.random() * -snowCanvas.height;
                this.radius = Math.random() * 2.2 + 0.6;
                this.speedY = Math.random() * 2.2 + 1.2;
                this.speedX = Math.random() * 1.2 - 0.6;
                this.opacity = Math.random() * 0.6 + 0.4;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.y > snowCanvas.height) {
                    this.reset();
                }
            }

            draw() {
                snowCtx.beginPath();
                snowCtx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                snowCtx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                snowCtx.fill();
            }
        }

        const snowList = [];
        const snowCount = Math.floor(window.innerWidth * 0.4);

        for (let i = 0; i < snowCount; i++) {
            snowList.push(new Snowflake());
        }

        // ===================== 极光绘制 =====================
        function drawAurora() {
            auroraCtx.clearRect(0, 0, auroraCanvas.width, auroraCanvas.height);

            auroraTime += 0.0035;

            const w = auroraCanvas.width;
            const h = auroraCanvas.height;

            // 极光主体集中在画面上方 15% ~ 45% 区域
            const topArea = h * 0.15;
            const bottomArea = h * 0.45;
            const midY = (topArea + bottomArea) / 2;

            const layers = [
                { color: 'rgba(80, 220, 180, 0.28)', offset: 0 },
                { color: 'rgba(120, 200, 255, 0.22)', offset: 1.3 },
                { color: 'rgba(190, 140, 255, 0.18)', offset: 2.6 }
            ];

            layers.forEach(layer => {
                auroraCtx.beginPath();
                auroraCtx.moveTo(0, bottomArea);

                for (let x = 0; x <= w; x += 10) {
                    const wave = Math.sin(x * 0.018 + auroraTime + layer.offset) * 55
                               + Math.sin(x * 0.007 + auroraTime * 0.65) * 35;

                    const y = midY + wave;
                    auroraCtx.lineTo(x, y);
                }

                auroraCtx.lineTo(w, bottomArea);
                auroraCtx.lineTo(w, topArea);
                auroraCtx.lineTo(0, topArea);
                auroraCtx.closePath();

                auroraCtx.fillStyle = layer.color;
                auroraCtx.fill();
            });

            // 顶部柔光
            const topGlow = auroraCtx.createLinearGradient(0, 0, 0, h * 0.5);
            topGlow.addColorStop(0, 'rgba(180, 220, 255, 0.35)');
            topGlow.addColorStop(0.4, 'rgba(180, 220, 255, 0.18)');
            topGlow.addColorStop(1, 'rgba(180, 220, 255, 0)');

            auroraCtx.fillStyle = topGlow;
            auroraCtx.fillRect(0, 0, w, h * 0.5);
        }

        // ===================== 渲染循环 =====================
        function renderLoop() {
            snowCtx.clearRect(0, 0, snowCanvas.width, snowCanvas.height);

            if (videoEnded) {
                snowList.forEach(s => {
                    s.update();
                    s.draw();
                });

                drawAurora();
            }

            animationId = requestAnimationFrame(renderLoop);
        }

        renderLoop();

        // ===================== 清理动画 =====================
        window.addEventListener('beforeunload', () => {
            cancelAnimationFrame(animationId);
        });

        console.log('❄️ 北境 · 苍白大地 已加载');
        console.log('💡 点击页面任意位置开启声音');
    </script>
</body>
</html>
