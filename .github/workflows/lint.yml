name: Lint — 代码质量检查

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake8:
    name: flake8 — Python 代码规范
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNOFFICIAL_NODE_VERSION: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: 安装 flake8
        run: pip install flake8

      - name: 运行 flake8（仅检查致命错误和未定义变量）
        run: |
          flake8 . \
            --select=E9,F63,F7,F82 \
            --max-line-length=120 \
            --exclude=.git,__pycache__,.venv,backups,node_modules,Lib,Scripts,data/chm_extracted \
            --statistics \
            --show-source \
            --exit-zero
          echo ""
          echo "flakes8 致命错误检查完成（警告不计入失败）"

      - name: 完整 flake8 报告（仅供参考，不阻塞 CI）
        run: |
          flake8 . \
            --max-line-length=120 \
            --exclude=.git,__pycache__,.venv,backups,node_modules,Lib,Scripts,data/chm_extracted \
            --statistics \
            --show-source \
            --exit-zero
          echo ""
          echo "完整 flake8 报告完成（仅供参考）"

  file-check:
    name: 文件组织检查
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNOFFICIAL_NODE_VERSION: '1'

    steps:
      - uses: actions/checkout@v4

      - name: 检查超大文件 (>500KB)
        run: |
          echo "=== 检查超大文件 (>500KB) ==="
          find . -type f -size +500k \
            -not -path "*/.git/*" \
            -not -path "*/node_modules/*" \
            -not -path "*/.venv/*" \
            -not -path "*/backups/*" \
            -not -path "*/chm_extracted/*" \
            -not -path "*/dice-box/*" \
            -not -path "*/dice-engine-v3/*" \
            -not -path "*/three/*" \
            -not -path "*/dice-v2/*" \
            -not -path "*.mp4" \
            -not -path "*.wasm" \
            -exec ls -lh {} \; || true
          echo "以上为超过 500KB 的非第三方文件（如有）"

      - name: 代码行数统计
        run: |
          echo "=== 代码行数统计 ==="
          echo "Python:"
          find . -name "*.py" -not -path "*/.git/*" -not -path "*/backups/*" -not -path "*/__pycache__/*" -not -path "*/.venv/*" -exec cat {} + | wc -l | xargs echo "  总计:"
          echo "HTML 模板:"
          find . -path "*/templates/*" -name "*.html" -exec cat {} + | wc -l | xargs echo "  总计:"
          echo "JavaScript (不含第三方库):"
          find . -path "*/static/*" -name "*.js" -not -path "*/three/*" -not -path "*/dice-box*/*" -not -path "*/dice-v*/*" -not -path "*/dice-engine*/*" -not -path "*/dice3d*/*" -exec cat {} + | wc -l | xargs echo "  总计:"
