name: Smoke Test — 冒烟测试

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Flask 冒烟测试
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONS_ALLOW_USE_UNOFFICIAL_NODE_VERSION: '1'
      # 冒烟测试使用 services 启动的 PostgreSQL（与生产环境一致）
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/dicebot

    # 启动 PostgreSQL 服务容器（GitHub Actions 原生支持，步骤开始时已就绪）
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dicebot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flask-sock

      - name: 验证 Flask 应用可导入
        run: |
          # 先验证 app 模块能否正常导入（不启动服务器）
          python -c "
          import sys, os
          sys.path.insert(0, os.path.join(os.getcwd(), 'web'))
          sys.path.insert(0, os.getcwd())
          os.chdir(os.path.join(os.getcwd(), 'web'))
          # 测试导入 app 模块（不执行 run_server）
          import importlib.util
          spec = importlib.util.spec_from_file_location('app', 'app.py')
          # 只检查语法和顶层导入，不真正执行 run
          print('Flask 应用模块语法和导入检查通过')
          "

      - name: 启动 Flask 并测试
        run: |
          # 等待 PostgreSQL 就绪（最多 15 秒，防御 services 容器端口未就绪）
          echo "等待 PostgreSQL 就绪..."
          for i in $(seq 1 15); do
            if python -c "import psycopg2,sys; psycopg2.connect(host='localhost',port=5432,user='postgres',password='postgres',dbname='dicebot',connect_timeout=2); sys.exit(0)" 2>/dev/null; then
              echo "  PostgreSQL 在第 ${i} 秒就绪"
              break
            fi
            echo "  ... ${i}s"
            sleep 1
          done

          # 从项目根目录以模块方式启动（与生产启动方式 python -m web.app 一致；
          # 直接 python app.py 会因 web/shared_state 相对导入失败）
          python -m web.app > /tmp/flask_out.log 2>&1 &
          APP_PID=$!
          echo "Flask PID: $APP_PID"

          # 等待启动（最多10秒）
          echo "等待 Flask 启动..."
          for i in $(seq 1 10); do
            sleep 1
            if curl -s -o /dev/null -w '' http://localhost:5000/ 2>/dev/null; then
              echo "Flask 在第 ${i} 秒就绪"
              break
            fi
            echo "  ... ${i}s"
          done

          # 检查是否还在运行
          if ! kill -0 $APP_PID 2>/dev/null; then
            echo ""
            echo "❌ Flask 进程已退出！启动日志:"
            cat /tmp/flask_out.log
            exit 1
          fi

          # 测试首页
          echo ""
          echo "=== 测试首页 ==="
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/ 2>/dev/null || echo "000")
          echo "HTTP ${HTTP_CODE}"
          if [ "$HTTP_CODE" = "000" ]; then
            echo "❌ 无法连接 Flask 服务器"
            cat /tmp/flask_out.log
            exit 1
          fi

          # 测试角色列表 API
          echo "=== 测试角色列表 API ==="
          curl -s http://localhost:5000/api/characters 2>/dev/null | head -c 200 || echo "(空响应)"
          echo ""

          # 测试掷骰 API
          echo "=== 测试掷骰 API ==="
          curl -s -X POST http://localhost:5000/api/roll \
            -H "Content-Type: application/json" \
            -d '{"expression":"3d6"}' 2>/dev/null | head -c 200 || echo "(空响应)"
          echo ""

          # 停止 Flask
          kill $APP_PID 2>/dev/null || true
          echo ""
          echo "✅ 冒烟测试通过"

      - name: API 端点统计
        run: |
          echo "=== API 端点统计 ==="
          echo "总路由数: $(grep -c '@app.route' web/app.py)"
          echo "HTTP 方法分布:"
          grep 'methods=\[' web/app.py | grep -oP "GET|POST|PUT|DELETE" | sort | uniq -c | sort -rn || true
