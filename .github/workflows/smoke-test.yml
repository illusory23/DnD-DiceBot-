name: Smoke Test — 冒烟测试

# ━━━ 触发条件 ━━━
# 推送到 main 时运行，确保 Flask 应用可以启动
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Job: 验证 Flask 应用能启动并响应
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  smoke-test:
    name: Flask 冒烟测试
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🐍 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: 📦 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Flask-Sock 用于 WebSocket 支持
          pip install flask-sock

      - name: 🚀 启动 Flask 应用
        run: |
          # 在后台启动 Flask
          cd web
          python app.py &
          APP_PID=$!
          echo "Flask PID: $APP_PID"

          # 等待启动
          sleep 3

          # 测试首页返回 200
          echo "=== 测试首页 ==="
          curl -s -o /dev/null -w "HTTP %{http_code}" http://localhost:5000/
          echo ""

          # 测试 API 端点
          echo "=== 测试角色列表 API ==="
          curl -s http://localhost:5000/api/characters | head -c 200
          echo ""

          # 测试掷骰 API
          echo "=== 测试掷骰 API ==="
          curl -s -X POST http://localhost:5000/api/roll \
            -H "Content-Type: application/json" \
            -d '{"expression":"3d6"}' | head -c 200
          echo ""

          # 测试法术搜索 API
          echo "=== 测试法术搜索 API ==="
          curl -s "http://localhost:5000/api/spell?name=fireball" | head -c 200
          echo ""

          # 停止 Flask
          kill $APP_PID 2>/dev/null || true
          echo ""
          echo "✅ 冒烟测试通过 — Flask 应用正常启动并响应"

      - name: 📊 统计 API 端点
        run: |
          echo "=== API 端点统计 ==="
          echo "总路由数:"
          grep -c "@app.route" web/app.py
          echo ""
          echo "HTTP 方法分布:"
          grep "methods=\[" web/app.py | grep -oP "GET|POST|PUT|DELETE" | sort | uniq -c | sort -rn
