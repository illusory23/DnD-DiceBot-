<!DOCTYPE html>

<title>异特龙Allosaurus</title>
</head>
<body>
<div id="Allosaurus">
异特龙Allosaurus<br>
大型野兽，无阵营<br>
AC 13<br>
HP 51（6d10 + 18）<br>
速度 60尺<br>
力量19 敏捷13 体质17 智力2 感知12 魅力5<br>
技能：察觉+5<br>
被动察觉15<br>
CR 2<br>
【特性】<br>
猛扑：若异特龙向目标直线移动至少30尺，然后在同一回合对其发动爪击攻击且命中该目标，则目标必须进行一次13的力量豁免，豁免失败者将被倒地。如果目标陷入倒地，则该异特龙可以用一个附赠动作对目标发动一次啃咬攻击。<br>
【动作】<br>
啃咬：mw 命中6，触及 5 尺，单一目标。15 (2d10 + 4) 点穿刺伤害。<br>
爪击：mw 命中6，触及5尺，单一目标。8 (1d8 + 4) 点挥砍伤害。
</div>
</body>
</html>
