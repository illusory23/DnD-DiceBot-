<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>蜘蛛Spider</title>
</head>
<body>
<div id="Spider">
蜘蛛Spider<br>
微型野兽，无阵营<br>
AC 12<br>
HP 1（1d4 - 1）<br>
速度 20尺，攀爬20尺<br>
力量2 敏捷14 体质8 智力1 感知10 魅力2<br>
技能：隐匿+4<br>
感官：黑暗视觉 30 尺；被动察觉10<br>
CR 0<br>
【特性】<br>
蛛行：蜘蛛可以攀爬在难以攀爬的表面上，包括倒吊在天花板上，且不需要进行属性检定。<br>
蛛网感知：与蛛网接触时，蜘蛛可以知晓其他与该蛛网接触生物的准确位置。<br>
蛛网行者：蜘蛛在蛛网上移动时无视蛛网造成的移动限制。<br>
【动作】<br>
啃咬：mw 命中4，触及5尺，单一生物。1点穿刺伤害，目标必须进行一次9的体质豁免，失败将受到2（1d4）点毒素伤害。
</div>
</body>
</html>
