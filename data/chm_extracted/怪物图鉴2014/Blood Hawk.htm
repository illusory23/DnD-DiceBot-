<div id="Blood Hawk">
血鹰Blood Hawk<br>
小型野兽，无阵营<br>
AC 12<br>
HP 7（2d6）<br>
速度 10尺，飞行60尺<br>
力量6 敏捷14 体质10 智力3 感知14 魅力5<br>
技能：察觉+4<br>
被动察觉14<br>
CR 1/8<br>
【特性】<br>
敏锐视觉：鹰依赖视觉进行的感知（察觉）检定具有优势。<br>
集群战术：鹰至少有一个未处于失能的盟友在目标生物5尺内时，它对该生物发动的攻击检定有优势。<br>
【动作】<br>
喙啄：mw 命中4，触及5尺，单一目标。4（1d4 + 2）点穿刺伤害。
</div>
