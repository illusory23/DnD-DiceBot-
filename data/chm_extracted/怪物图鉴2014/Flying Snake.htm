<title>飞蛇Flying Snake</title>

<body>
<div id="Flying Snake">
飞蛇Flying Snake<br>
微型野兽，无阵营<br>
AC 14<br>
HP 5（2d4）<br>
速度 30尺，飞行60尺，游泳30尺<br>
力量4 敏捷18 体质11 智力2 感知12 魅力5<br>
感官：盲视 10 尺；被动察觉11<br>
CR 1/8<br>
【特性】<br>
飞掠：飞蛇飞出敌人的触及范围时不会引起借机攻击。<br>
【动作】<br>
啃咬：mw 命中6，触及 5 尺，单一目标。1 点穿刺伤害加上 7 (3d4) 点毒素伤害。
</div>
