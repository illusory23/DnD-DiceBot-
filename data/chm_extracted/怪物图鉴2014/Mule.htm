<title>骡子Mule</title>

<body>
<div id="Mule">
骡子Mule<br>
中型野兽，无阵营<br>
AC 10<br>
HP 11（2d8 + 2）<br>
速度 40尺<br>
力量14 敏捷10 体质13 智力2 感知10 魅力5<br>
被动察觉10<br>
CR 1/8<br>
【特性】<br>
驮兽：在决定骡子的负重能力时，骡子被视为大一级体型的生物。<br>
稳步：骡子抵抗应击倒地效应所进行的力量和敏捷豁免具有优势。<br>
【动作】<br>
蹄击：mw 命中2，触及5尺，单一目标。4（1d4 + 2）点钝击伤害。
</div>
