<title>三角龙Triceratops</title>

<body>
<div id="Triceratops">
三角龙Triceratops<br>
超巨型野兽，无阵营<br>
AC 13<br>
HP 95（10d12 + 30）<br>
速度 50尺<br>
力量22 敏捷9 体质17 智力2 感知11 魅力5<br>
被动察觉10<br>
CR 5<br>
【特性】<br>
践踏冲锋：若三角龙向某一生物直线移动至少20尺，且在同一回合里以顶撞攻击命中该生物，则该目标必须成功通过一次13力量豁免，否则应击倒地。如果目标倒地，则三角龙可以用一个附赠动作对其发动一次践踏攻击。<br>
【动作】<br>
顶撞：mw 命中9，触及5尺，单一目标。24 (4d8 + 6) 点穿刺伤害。<br>
践踏：mw 9 命中，触及5尺，一个倒地生物。22（3d10 + 6）钝击伤害。
</div>
</body>
