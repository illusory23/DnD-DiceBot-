<!DOCTYPE html>

<title>丧尸Zombie</title>
</head>
<body>
<div id="Zombie">
丧尸Zombie<br>
中型亡灵，绝对中立<br>
AC 8<br>
HP 22（3d8 + 9）<br>
速度 20尺<br>
力量13 敏捷6 体质16 智力3 感知6 魅力5<br>
豁免：感知+0<br>
伤害免疫：毒素<br>
状态免疫：中毒<br>
感官：黑暗视觉 60 尺；被动察觉8<br>
语言：能理解它生前所说的所有语言，但不能说话<br>
CR 1/4<br>
【特性】<br>
不死坚韧：当僵尸因受非光耀非重击伤害而使其生命值减至0时，它必须进行一次DC为5＋所受伤害值的体质豁免，豁免成功则生命值降至1。<br>
【动作】<br>
猛击：mw 命中3，触及5尺，单一目标。4 (1d6 + 1) 点钝击伤害。
</div>
</body>
