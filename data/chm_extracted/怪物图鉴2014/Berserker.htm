<title>狂战士Berserker</title>

<body>
<div id="Berserker">
狂战士Berserker<br>
中型类人生物（任意种族）<br>
AC 13<br>
HP 67（9d8 + 27）<br>
速度 30尺<br>
力量16 敏捷12 体质17 智力9 感知11 魅力9<br>
被动察觉10<br>
语言：任何一种语言（通常是通用语）<br>
CR 2<br>
【特性】<br>
鲁莽：狂战士可以在自己回合开始时进入鲁莽状态，其发动的所有近战武器攻击的攻击检定均具有优势，所有对其发动的攻击检定也同样具有优势，持续直至他的下一回合开始。<br>
【动作】<br>
巨斧：mw 命中5，触及5尺，单一目标。9（1d12 + 3）点挥砍伤害。
</div>
