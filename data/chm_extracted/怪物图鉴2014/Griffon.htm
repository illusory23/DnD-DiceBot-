<title>狮鹫Griffon</title>

<body>
<div id="Griffon">
狮鹫Griffon<br>
大型怪兽，无阵营<br>
AC 12<br>
HP 59（7d10 + 21）<br>
速度 30尺，飞行80尺<br>
力量18 敏捷15 体质16 智力2 感知13 魅力8<br>
技能：察觉+5<br>
感官：黑暗视觉 60 尺；被动察觉15<br>
CR 2<br>
【特性】<br>
敏锐视觉：狮鹫依赖视力所进行的感知（察觉）检定具有优势。<br>
【动作】<br>
多重攻击：狮鹫发动两次攻击：一次喙啄和一次爪击。<br>
喙啄：mw 命中6，触及5尺，单一目标。8（1d8 + 4）点穿刺伤害。<br>
爪击：mw 命中6，触及5尺，单一目标。11 (2d6 + 4) 点挥砍伤害。
</div>
</body>
