<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>蚊蝠Stirge</title>
</head>
<body>
<div id="Stirge">
蚊蝠Stirge<br>
微型野兽，无阵营<br>
AC 14<br>
HP 2（1d4）<br>
速度 10尺，飞行40尺<br>
力量4 敏捷16 体质11 智力2 感知8 魅力6<br>
感官：黑暗视觉 60 尺；被动察觉9<br>
CR 1/8<br>
【动作】<br>
吸取血液：mw 命中5，触及5尺，单一生物。5（1d4 + 3）点穿刺伤害，且蚊蝠贴在目标身上。贴上身之后，蚊蝠将不再发动攻击，而目标生物在该蚊蝠的回合开始时将因失血而使其生命值受5（1d4 + 3）的损失。 蚊蝠可以花费5尺移动力从目标生物身上脱离。它通常会在吸完10点生命值，或者目标死亡后自行脱离。包括目标生物在内的任意生物都可以花一个动作将蚊蝠从自己或是从别人身上拽下来。
</div>
</body>
</html>
