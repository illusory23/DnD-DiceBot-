<title>穴居熊Cave Bear</title>

<body>
<div id="Cave Bear">
穴居熊Cave Bear<br>
大型野兽，无阵营<br>
AC 12<br>
HP 42（5d10 + 15）<br>
速度 40尺，游泳30尺<br>
力量20 敏捷10 体质16 智力2 感知13 魅力7<br>
技能：察觉+3<br>
感官：黑暗视觉 60 尺；被动察觉13<br>
CR 2<br>
【特性】<br>
敏锐嗅觉：熊依赖嗅觉进行的感知（察觉）检定具有优势。<br>
【动作】<br>
多重攻击：熊发动两次攻击，一次是啃咬，一次是爪击。<br>
啃咬：mw 命中7，触及5尺，单一目标。9 (1d8 + 5) 点穿刺伤害。<br>
爪击：mw 命中7，触及5尺，单一目标。12（2d6 + 5）点挥砍伤害。
</div>
</body>
