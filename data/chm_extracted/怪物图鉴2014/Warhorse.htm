<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>战马Warhorse</title>
</head>
<body>
<div id="Warhorse">
战马Warhorse<br>
大型野兽，无阵营<br>
AC 11<br>
HP 19（3d10 + 3）<br>
速度 60尺<br>
力量18 敏捷12 体质13 智力2 感知12 魅力7<br>
被动察觉11<br>
CR 1/2<br>
【特性】<br>
践踏冲锋：如果马向某一生物直线移动至少20尺，且在同一回合里以蹄击命中该生物，则该目标必须成功通过一次14的力量豁免，否则应击倒地。如果目标倒地，则马可以用一个附赠动作对其发动一次蹄击攻击。<br>
【动作】<br>
蹄击：mw 命中6，触及5尺，单一目标。11 (2d6 + 4) 点钝击伤害。
</div>
</body>
</html>
