<title>魔兽人Orog</title>

<body>
<div id="Orog">
魔兽人Orog<br>
中型类人生物（兽人）<br>
AC 18<br>
HP 42（5d8 + 20）<br>
速度 30尺<br>
力量18 敏捷12 体质18 智力12 感知11 魅力12<br>
技能：威吓+5，生存+2<br>
感官：黑暗视觉 60 尺；被动察觉10<br>
语言：通用语，兽人语<br>
CR 2<br>
【特性】<br>
好斗：作为一个附赠动作项，兽人可以向一个它能看见的敌对生物移动至多相当于其速度的距离。<br>
【动作】<br>
多重攻击：魔兽人发动两次巨斧攻击。<br>
巨斧：mw 命中6，触及5尺，单一目标。10 (1d12 + 4) 点挥砍伤害。<br>
标枪：mw,rw 命中6，触及5尺或射程30/120尺，单一目标。7（1d6 + 4）点穿刺伤害。
</div>
</body>
