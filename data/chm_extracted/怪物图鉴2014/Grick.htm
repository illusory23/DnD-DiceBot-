<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>穴居攫怪Grick</title>
</head>
<body>
<div id="Grick">
穴居攫怪Grick<br>
中型怪兽，绝对中立<br>
AC 14<br>
HP 27（6d8）<br>
速度 30尺，攀爬30尺<br>
力量14 敏捷14 体质11 智力3 感知14 魅力5<br>
伤害抗性：钝击，穿刺，挥砍，来自非魔法攻击<br>
感官：黑暗视觉 60 尺；被动察觉12<br>
CR 2<br>
【特性】<br>
岩地伪装：穴居攫怪在岩石地形中进行躲藏时所作的敏捷（隐匿）检定具有优势。<br>
【动作】<br>
多重攻击：穴居攫怪使用它的触须发动一次攻击，如果该攻击命中，则它可以对同一目标再发动一次喙啄攻击。<br>
触须：mw 命中4，触及5尺，单一目标。9（2d6 + 2）点挥砍伤害。<br>
喙啄：mw 命中4，触及5尺，单一目标。5 (1d6 + 2) 点穿刺伤害。
</div>
</body>
</html>
