<title>巨黄蜂Giant Wasp</title>

<body>
<div id="Giant Wasp">
巨黄蜂Giant Wasp<br>
中型野兽，无阵营<br>
AC 12<br>
HP 13（3d8）<br>
速度 10尺，飞行50尺<br>
力量10 敏捷14 体质10 智力1 感知10 魅力3<br>
被动察觉10<br>
CR 1/2<br>
【动作】<br>
钉刺：mw 命中4，触及5尺，单一生物。5（1d6 + 2）点穿刺伤害，目标必须进行一次11的体质豁免，豁免失败则受到10（3d6）点毒素伤害，豁免成功则伤害减半且不会中毒。若该伤害将一个生物的生命值降为0，则目标伤势稳定但陷入中毒，该中毒状态持续1小时，此期间目标同时处于麻痹和中毒状态。
</div>
</body>
</html>
