<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>食尸鬼Ghoul</title>
</head>
<body>
<div id="Ghoul">
食尸鬼Ghoul<br>
中型亡灵<br>
AC 12<br>
HP 22（5d8）<br>
速度 30尺<br>
力量13 敏捷15 体质10 智力7 感知10 魅力6<br>
伤害免疫：毒素<br>
状态免疫：魅惑、力竭、中毒<br>
感官：黑暗视觉 60 尺；被动察觉10<br>
语言：通用语<br>
CR 1<br>
【动作】<br>
啃咬：mw 命中2，触及5尺，单一生物。9 (2d6 + 2) 点穿刺伤害。<br>
爪击：mw 命中4，触及5尺，单一目标。7 (2d4 + 2) 点挥砍伤害。如果目标为不是精灵也不是不死生物的其他生物，则该目标必须进行一次10的体质豁免，豁免失败则陷入1分钟的麻痹状态。目标可以在每个自己的回合结束时再次进行豁免，豁免成功则终止自己身上的该效应。
</div>
</body>
</html>
