<title>巨蝎Giant Scorpion</title>

<body>
<div id="Giant Scorpion">
巨蝎Giant Scorpion<br>
大型野兽，无阵营<br>
AC 15<br>
HP 52（7d10 + 14）<br>
速度 40尺<br>
力量15 敏捷13 体质15 智力1 感知9 魅力3<br>
感官：盲视 60 尺；被动察觉9<br>
CR 3<br>
【动作】<br>
多重攻击：蝎子发动三次攻击：两次爪击和一次钉刺。<br>
爪击：mw 命中4，触及5尺，单一目标。6（1d8 + 2）点钝击伤害，且目标受擒（逃脱12）。蝎子有两只钳爪，其每只爪子只能擒抱一个目标<br>
钉刺：mw 命中4，触及5尺，单一生物。7 (1d10 + 2) 点穿刺伤害，且目标必须成功通过一次12的体质豁免，否则将受到22（4d10）点毒素伤害，豁免成功则伤害减半。
</div>
</body>
</html>
