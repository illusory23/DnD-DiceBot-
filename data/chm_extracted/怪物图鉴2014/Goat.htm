<!DOCTYPE html>

<title>山羊Goat</title>
</head>
<body>
<div id="Goat">
山羊Goat<br>
中型野兽，无阵营<br>
AC 10<br>
HP 4（1d8）<br>
速度 40尺<br>
力量12 敏捷10 体质11 智力2 感知10 魅力5<br>
被动察觉10<br>
CR 0<br>
【特性】<br>
冲锋：若山羊向其目标直线移动至少20尺，且在同一回合里以冲撞攻击命中该目标，则该目标受额外2（1d4）点钝击伤害。如果目标是生物，则该生物必须成功通过一次10的力量豁免，否则应击倒地。<br>
稳步：山羊抵抗应击倒地效应所进行的力量和敏捷豁免具有优势。<br>
【动作】<br>
冲撞：mw 命中3，触及5尺，单一目标。3 (1d4 + 1) 点钝击伤害。
</div>
</body>
</html>
