<title>单元冢Monodrone</title>

<body>
<div id="Monodrone">
单元冢Monodrone<br>
中型构装生物<br>
AC 15<br>
HP 5（1d8 + 1）<br>
速度 30尺，飞行30尺<br>
力量10 敏捷13 体质12 智力4 感知10 魅力5<br>
感官：真实视觉 120 尺；被动察觉10<br>
语言：魔冢语<br>
CR 1/8<br>
【特性】<br>
公理之念：单元冢不会被迫去做违反其天性或其原有指令的行为。<br>
解体：单元冢死亡时，它的身体会瓦解为尘埃，留下它的武器和其他携带的东西。<br>
【动作】<br>
匕首：mw 命中3，触及5尺，单一目标。3 (1d4 + 1) 点穿刺伤害。<br>
标枪：mw,rw 命中2，触及5尺或射程30/120尺，单一目标。3（1d6）点穿刺伤害。
</div>
</body>
