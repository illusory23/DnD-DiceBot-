<div id="Giant Crab">
巨蟹Giant Crab<br>
中型野兽，无阵营<br>
AC 15<br>
HP 13（3d8）<br>
速度 30尺，游泳30尺<br>
力量13 敏捷15 体质11 智力1 感知9 魅力3<br>
技能：隐匿+4<br>
感官：盲视 30 尺；被动察觉9<br>
CR 1/8<br>
【特性】<br>
水陆两栖：蟹可以在空气和水中呼吸。<br>
【动作】<br>
爪击：mw 命中3，触及5尺，单一目标。4 (1d6 + 1) 点钝击伤害，目标受擒（逃脱11）。该蟹有两只前爪，它只能用每只前爪擒抱一个目标。
