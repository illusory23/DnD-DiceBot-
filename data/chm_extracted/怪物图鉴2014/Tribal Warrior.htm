<div id="Tribal Warrior">
部族武者Tribal Warrior<br>
中型类人生物（任意种族）<br>
AC 12<br>
HP 11（2d8 + 2）<br>
速度 30尺<br>
力量13 敏捷11 体质12 智力8 感知11 魅力8<br>
被动察觉10<br>
语言：任何一种语言<br>
CR 1/8<br>
【特性】<br>
集群战术：武者至少有一个未处于失能的盟友在目标生物5尺内时，它对该生物发动的攻击检定有优势。<br>
【动作】<br>
矛：mw,rw 命中3，触及5尺或射程20/60尺，单一目标。4 (1d6 + 1) 点穿刺伤害，或使用双手发动近战攻击时5（1d8 + 1）点穿刺伤害。
</div>
