<body>
<div id="Cloud Giant">
云巨人Cloud Giant<br>
超巨型巨人<br>
AC 14<br>
HP 200（16d12 + 96）<br>
速度 40尺<br>
力量27 敏捷10 体质22 智力12 感知16 魅力16<br>
豁免：体质+10，感知+7，魅力+7<br>
技能：洞悉+7，察觉+7<br>
被动察觉17<br>
语言：通用语，巨人语<br>
CR 9<br>
【特性】<br>
敏锐嗅觉：巨人依赖嗅觉进行的感知（察觉）检定具有优势。<br>
【动作】<br>
多重攻击：巨人发动两次钉头锤攻击。<br>
钉头锤：mw 命中12，触及10尺，单一目标。21（3d8 + 8）点穿刺伤害。<br>
掷石：rw 命中12，射程60/240尺，单一目标。30 (4d10 + 8) 点钝击伤害。
</div>
