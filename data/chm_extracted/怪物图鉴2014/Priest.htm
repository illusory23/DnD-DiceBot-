<body>
<div id="Priest">
祭司Priest<br>
中型类人生物（任意种族）<br>
AC 13<br>
HP 27（5d8 + 5）<br>
速度 30尺<br>
力量10 敏捷10 体质12 智力13 感知16 魅力13<br>
技能：医药+7，游说+3，宗教+5<br>
被动察觉13<br>
语言：任意两种语言<br>
CR 2<br>
【特性】<br>
神圣启示：作为附加动作，牧师可以消耗一个法术位，使其近战武器攻击在命中目标时额外造成10（3d6）点光耀伤害。此效果持续至回合结束。如果牧师消耗2级或更高级别的法术位，每超过1级，额外伤害增加1d6点。<br>
【动作】<br>
硬头锤：mw 命中2，触及5尺，单一目标。3（1d6）点钝击伤害。
</div>
