<title>二元冢Duodrone</title>
</head>
<body>
<div id="Duodrone">
二元冢Duodrone<br>
中型构装生物<br>
AC 15<br>
HP 11（2d8 + 2）<br>
速度 30尺<br>
力量11 敏捷13 体质12 智力6 感知10 魅力7<br>
感官：真实视觉 120 尺；被动察觉10<br>
语言：魔冢语<br>
CR 1/4<br>
【特性】<br>
公理之念：二元冢不会被迫去做违反其天性或其原有指令的行为。<br>
解体：二元冢死亡时，它的身体会瓦解为尘埃，留下它的武器和其他携带的东西。<br>
【动作】<br>
多重攻击：二元冢发动两次拳击攻击或两次标枪攻击。<br>
拳击：mw 命中2，触及5尺，单一目标。2 (1d4) 点钝击伤害。<br>
标枪：mw,rw 命中3，触及5尺或射程30/120尺，单一目标。造成4点（1d6 + 1）点穿刺伤害。
</div>
</body>
