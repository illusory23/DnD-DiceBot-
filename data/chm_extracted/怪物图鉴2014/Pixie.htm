<title>皮克精Pixie</title>

<body>
<div id="Pixie">
皮克精Pixie<br>
微型妖精，绝对中立<br>
AC 15<br>
HP 1（1d4 - 1）<br>
速度 10尺，飞行30尺<br>
力量2 敏捷20 体质8 智力10 感知14 魅力15<br>
技能：察觉+4，隐匿+7<br>
被动察觉14<br>
语言：木族语<br>
CR 1/4<br>
【特性】<br>
魔法抗性：皮克精为抵抗法术和其它魔法效应而作的豁免检定具有优势。<br>
【动作】<br>
强效隐形：皮克精变为隐形直至其失去专注（等同于专注||专注于法术）。该皮克精着装或携带的任何装备也会随之一同隐形。
</div>
