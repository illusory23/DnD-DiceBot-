毒蛇Poisonous Snake<br>
微型野兽，无阵营<br>
AC 13<br>
HP 2（1d4）<br>
速度 30尺，游泳30尺<br>
力量2 敏捷16 体质11 智力1 感知10 魅力3<br>
感官：盲视 10 尺；被动察觉10<br>
CR 1/8<br>
【动作】<br>
啃咬：mw 命中5，触及5尺，单一目标。1穿刺伤害，该目标必须进行一次10的体质豁免，豁免失败则受5（2d4）点毒素伤害，豁免成功则伤害减半。
