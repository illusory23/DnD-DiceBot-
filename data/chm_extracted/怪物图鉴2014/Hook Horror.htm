<div id="Hook Horror">
恐爪怪Hook Horror<br>
大型怪兽，绝对中立<br>
AC 15<br>
HP 75（10d10 + 20）<br>
速度 30尺，攀爬30尺<br>
力量18 敏捷10 体质15 智力6 感知12 魅力7<br>
技能：察觉+3<br>
感官：盲视 60 尺，黑暗视觉 120 尺；被动察觉13<br>
语言：恐爪怪语<br>
CR 3<br>
【特性】<br>
回声定位：恐爪怪耳聋时不能用其盲视感官。<br>
敏锐听觉：恐爪怪依赖听力所进行的感知（察觉）检定具有优势。<br>
【动作】<br>
多重攻击：恐爪怪发动两次钩爪攻击。<br>
钩爪：mw 命中6，触及10尺，单一目标。11（2d6 + 4）点穿刺伤害。
