<!DOCTYPE html>

<title>狗头人Kobold</title>
</head>
<body>
<div id="Kobold">
狗头人Kobold<br>
小型类人生物（狗头人）<br>
AC 12<br>
HP 5（2d6 - 2）<br>
速度 30尺<br>
力量7 敏捷15 体质9 智力8 感知7 魅力8<br>
感官：黑暗视觉 60 尺；被动察觉8<br>
语言：通用语，龙语<br>
CR 1/8<br>
【特性】<br>
日照敏感：受阳光照射时，狗头人进行的攻击检定和依赖视觉进行的感知（察觉）检定具有劣势。<br>
集群战术：狗头人至少有一个未处于失能的盟友在目标生物5尺内时，它对该生物发动的攻击检定有优势。<br>
【动作】<br>
匕首：mw 命中4，触及5尺，单一目标。4（1d4 + 2）点穿刺伤害。<br>
投石索：rw 命中4，射程30/120尺，单一目标。4（1d4 + 2）点钝击伤害。
</div>
</body>
