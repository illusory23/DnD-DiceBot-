<title>巨獾Giant Badger</title>

<body>
<div id="Giant Badger">
巨獾Giant Badger<br>
中型野兽，无阵营<br>
AC 10<br>
HP 13（2d8 + 4）<br>
速度 30尺，掘地10尺<br>
力量13 敏捷10 体质15 智力2 感知12 魅力5<br>
感官：黑暗视觉 30 尺；被动察觉11<br>
CR 1/4<br>
【特性】<br>
敏锐嗅觉：獾在依赖嗅觉的感知（察觉）检定上具有优势。<br>
【动作】<br>
多重攻击：獾发动两次攻击：一次啃咬一次爪击。<br>
啃咬：mw 命中3，触及5尺，单一目标。4（1d6 + 1）点穿刺伤害。<br>
爪击：mw 命中3，触及5尺，单一目标。6 (2d4 + 1) 点挥砍伤害。
</div>
</body>
</html>
