<body>
<div id="Goblin">
地精Goblin<br>
小型类人生物（类地精），绝对中立<br>
AC 15<br>
HP 7（2d6）<br>
速度 30尺<br>
力量8 敏捷14 体质10 智力10 感知8 魅力8<br>
技能：隐匿+6<br>
感官：黑暗视觉 60 尺；被动察觉9<br>
语言：通用语，地精语<br>
CR 1/4<br>
【特性】<br>
迅捷逃逸：地精可在自己的回合，以一个附赠动作来执行撤离或躲藏动作。<br>
【动作】<br>
弯刀：mw 命中4，触及5尺，单一目标。5 (1d6 + 2) 点挥砍伤害。<br>
短弓：rw 命中4，射程80/320尺，单一目标。5（1d6 + 2）点穿刺伤害。
</div>
