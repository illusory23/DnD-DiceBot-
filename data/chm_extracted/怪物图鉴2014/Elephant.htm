<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>大象Elephant</title>
</head>
<body>
<div id="Elephant">
大象Elephant<br>
超巨型野兽，无阵营<br>
AC 12<br>
HP 76（8d12 + 24）<br>
速度 40尺<br>
力量22 敏捷9 体质17 智力3 感知11 魅力6<br>
被动察觉10<br>
CR 4<br>
【特性】<br>
践踏冲锋：如果象向某一生物直线移动至少20尺，且在同一回合里以顶撞攻击命中该生物，则该目标必须成功通过一次12的力量豁免，否则应击倒地。如果目标倒地，则象可以用一个附赠动作对其发动一次践踏攻击。<br>
【动作】<br>
顶撞：mw 命中8，触及5尺，单一目标。19 (3d8 + 6) 点穿刺伤害。<br>
践踏：mw 命中8，触及5尺，一个倒地的生物。22 (3d10 + 6) 点钝击伤害。
</div>
</body>
</html>
