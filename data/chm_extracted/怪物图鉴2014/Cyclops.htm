<div id="Cyclops">
独眼巨人Cyclops<br>
超巨型巨人<br>
AC 14<br>
HP 138（12d12 + 60）<br>
速度 30尺<br>
力量22 敏捷11 体质20 智力8 感知6 魅力10<br>
被动察觉8<br>
语言：巨人语<br>
CR 6<br>
【特性】<br>
纵感欠缺：独眼巨人对30尺外的目标发动的攻击检定具有劣势。<br>
【动作】<br>
多重攻击：独眼巨人发动两次巨棒攻击。<br>
巨棒：mw 命中9，触及 10 尺，单一目标。19 (3d8 + 6) 点钝击伤害。<br>
掷石：rw 命中9，射程30/120 尺，单一目标。28 (4d10 + 6) 点钝击伤害。
