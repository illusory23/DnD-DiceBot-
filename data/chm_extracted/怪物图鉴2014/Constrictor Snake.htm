<div id="Constrictor Snake">
蟒蛇Constrictor Snake<br>
大型野兽，无阵营<br>
AC 12<br>
HP 13（2d10 + 2）<br>
速度 30尺，游泳30尺<br>
力量15 敏捷14 体质12 智力1 感知10 魅力3<br>
感官：盲视 10 尺；被动察觉10<br>
CR 1/4<br>
【动作】<br>
啃咬：mw 命中4，触及5尺，单一生物。5 (1d6 + 2) 点穿刺伤害。<br>
绞缠：mw 命中4，触及5尺，单一生物。6 (1d8 + 2) 点钝击伤害，且目标受擒（逃脱14）。直至擒抱解除，目标束缚且该蛇不能紧缚另一个目标。
</div>
