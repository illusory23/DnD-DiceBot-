<div id="Giant Sea Horse">
巨海马Giant Sea Horse<br>
大型野兽，无阵营<br>
AC 13<br>
HP 16（3d10）<br>
速度 游泳40尺<br>
力量12 敏捷15 体质11 智力2 感知12 魅力5<br>
被动察觉11<br>
CR 1/2<br>
【特性】<br>
冲锋：若海马向其目标直线移动至少20尺，且在同一回合里以冲撞攻击命中该目标，则该目标受额外7（2d6）点钝击伤害。如果目标是生物，则该生物必须成功通过一次11的力量豁免，否则应击倒地。<br>
水下呼吸：海马只能在水下呼吸。<br>
【动作】<br>
冲撞：mw 命中3，触及5尺，单一目标。4 (1d6 + 1) 点钝击伤害。
