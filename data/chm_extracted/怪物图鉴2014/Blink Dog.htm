<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>闪现犬Blink Dog</title>
</head>
<body>
<div id="Blink Dog">
闪现犬Blink Dog<br>
中型妖精<br>
AC 13<br>
HP 22（4d8 + 4）<br>
速度 40尺<br>
力量12 敏捷17 体质12 智力10 感知13 魅力11<br>
技能：察觉+3，隐匿+5<br>
被动察觉13<br>
语言：闪现犬语，懂木族语但不能说<br>
CR 1/4<br>
【特性】<br>
敏锐嗅听觉：闪现犬进行依赖听觉和嗅觉的感知（察觉）检定时具有优势。<br>
【动作】<br>
啃咬：mw 命中3，触及5尺，单一目标。4（1d6 + 1）点穿刺伤害。<br>
传送 {@recharge 4}：闪现犬连同自身着装和携带的所有装备以魔法传送到至多40尺外一处它能够看见且未被占据的空间位置。闪现犬可以在传送前或传送后发动一次啃咬。
</div>
</body>
</html>
