<div id="Giant Goat">
巨山羊Giant Goat<br>
大型野兽，无阵营<br>
AC 11<br>
HP 19（3d10 + 3）<br>
速度 40尺<br>
力量17 敏捷11 体质12 智力3 感知12 魅力6<br>
被动察觉11<br>
CR 1/2<br>
【特性】<br>
冲锋：若山羊向其目标直线移动至少20尺，且在同一回合里以冲撞攻击命中该目标，则该目标受额外5（2d4）点钝击伤害。如果目标是生物，则该生物必须成功通过一次13的力量豁免，否则应击倒地。<br>
稳步：山羊抵抗应击倒地效应所进行的力量和敏捷豁免具有优势。<br>
【动作】<br>
冲撞：mw 命中5，触及5尺，单一目标。8（2d4 + 3）点钝击伤害。
</div>
