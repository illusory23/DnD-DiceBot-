<body>
<div id="Jackal">
胡狼Jackal<br>
小型野兽，无阵营<br>
AC 12<br>
HP 3（1d6）<br>
速度 40尺<br>
力量8 敏捷15 体质11 智力3 感知12 魅力6<br>
技能：察觉+3<br>
被动察觉13<br>
CR 0<br>
【特性】<br>
敏锐嗅听觉：豺狗依赖听觉或嗅觉进行的感知（察觉）检定具有优势。<br>
集群战术：豺狗至少有一个未处于失能的盟友在目标生物5尺内时，它对该生物发动的攻击检定有优势。<br>
【动作】<br>
啃咬：mw  命中1，射程5尺，单一目标。1 (1d4 - 1) 点穿刺伤害。
</div>
