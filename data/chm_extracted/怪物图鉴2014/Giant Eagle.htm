<!DOCTYPE html>

<title>巨鹰Giant Eagle</title>
</head>
<body>
<div id="Giant Eagle">
巨鹰Giant Eagle<br>
大型野兽，绝对中立<br>
AC 13<br>
HP 26（4d10 + 4）<br>
速度 10尺，飞行80尺<br>
力量16 敏捷17 体质13 智力8 感知14 魅力10<br>
技能：察觉+4<br>
被动察觉14<br>
语言：巨鹰语，能理解通用语和风族语，但不能说出来<br>
CR 1<br>
【特性】<br>
敏锐视觉：鹰依赖视觉进行的感知（察觉）检定具有优势。<br>
【动作】<br>
多重攻击：鹰发动两次攻击，一次是喙啄，一次是爪击。<br>
喙啄：mw 命中5，触及5尺，单一目标。6（1d6 + 3）点穿刺伤害。<br>
禽爪：mw 命中5，触及5尺，单一目标。10（2d6 + 3）点挥砍伤害。
</div>
</body>
</html>
