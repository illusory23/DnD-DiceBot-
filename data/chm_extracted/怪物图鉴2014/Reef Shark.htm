礁鲨Reef Shark<br>
中型野兽，无阵营<br>
AC 12<br>
HP 22（4d8 + 4）<br>
速度 游泳40尺<br>
力量14 敏捷13 体质13 智力1 感知10 魅力4<br>
技能：察觉+2<br>

水下呼吸：鲨鱼只能在水下呼吸。<br>
