巨蟒蛇Giant Constrictor Snake<br>
超巨型野兽，无阵营<br>
AC 12<br>
HP 60（8d12 + 8）<br>
速度 30尺，游泳30尺<br>
力量19 敏捷14 体质12 智力1 感知10 魅力3<br>
技能：察觉+2<br>
感官：盲视 10 尺；被动察觉12<br>
CR 2<br>
【动作】<br>
啃咬：mw 命中6，触及 10 尺，单一生物。11 (2d6 + 4) 点穿刺伤害。<br>
绞缠：mw 命中6，触及5尺，单一生物。13 (2d8 + 4) 点钝击伤害，且目标受擒（逃脱16）。直到擒抱解除前目标束缚，且该蛇不能绞缠另一目标。
