<!DOCTYPE html>

<title>渡鸦Raven</title>
</head>
<body>
<div id="Raven">
渡鸦Raven<br>
微型野兽，无阵营<br>
AC 12<br>
HP 1（1d4 - 1）<br>
速度 10尺，飞行50尺<br>
力量2 敏捷14 体质8 智力2 感知12 魅力6<br>
技能：察觉+3<br>
被动察觉13<br>
CR 0<br>
【特性】<br>
拟声：渡鸦可以模仿听到的简单声音，比如人的低语声、婴儿的哭声、动物的交谈声等。听到该声音的生物可以进行一次10的感知（洞悉）检定，检定成功则发现其是模仿的声音。<br>
【动作】<br>
喙啄：mw 命中4，触及5尺，单一目标。造成1点穿刺伤害。
</div>
