<title>蛇鸡Cockatrice</title>
</head>
<body>
<div id="Cockatrice">
蛇鸡Cockatrice<br>
小型怪兽，无阵营<br>
AC 11<br>
HP 27（6d6 + 6）<br>
速度 20尺，飞行40尺<br>
力量6 敏捷12 体质12 智力2 感知13 魅力5<br>
感官：黑暗视觉 60 尺；被动察觉11<br>
CR 1/2<br>
【动作】<br>
啃咬：mw 命中3，触及 5 尺，单一生物。3 (1d4 + 1) 点穿刺伤害，目标必须进行一次11的体质豁免，豁免失败则因魔法而开始石化，并陷入束缚状态。目标生物在其下一回合结束时必须在进行一次该豁免，豁免成功则效应终止，豁免失败则该生物陷入24小时的石化状态。
</div>
</body>
