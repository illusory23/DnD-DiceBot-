<div id="Violet Fungus">
紫腐菌Violet Fungus<br>
中型植物，无阵营<br>
AC 5<br>
HP 18（4d8）<br>
速度 5尺<br>
力量3 敏捷1 体质10 智力1 感知3 魅力1<br>
状态免疫：目盲、耳聋、恐慌<br>
感官：30 尺盲视感官，该感官范围之外则视为目盲状态。；被动察觉6<br>
CR 1/4<br>
【特性】<br>
无定形：静止的紫腐菌与普通的真菌一模一样。<br>
【动作】<br>
多重攻击：紫腐菌进行1d4次腐烂触击攻击。<br>
腐烂触击：mw 命中2，触及10尺，单一生物。4 (1d8) 点暗蚀伤害。
