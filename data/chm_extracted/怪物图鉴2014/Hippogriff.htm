<!DOCTYPE html>

<title>骏鹰Hippogriff</title>
</head>
<body>
<div id="Hippogriff">
骏鹰Hippogriff<br>
大型怪兽，无阵营<br>
AC 11<br>
HP 19（3d10 + 3）<br>
速度 40尺，飞行60尺<br>
力量17 敏捷13 体质13 智力2 感知12 魅力8<br>
技能：察觉+5<br>
被动察觉15<br>
CR 1<br>
【特性】<br>
敏锐视觉：骏鹰依赖视力而进行的感知（察觉）检定具有优势。<br>
【动作】<br>
多重攻击：骏鹰发动两次攻击：一次喙啄，和一次爪击。<br>
喙啄：mw 命中5，触及5尺，单一目标。8 (1d10 + 3) 点穿刺伤害。<br>
爪击：mw 命中5，触及5尺，单一目标。10（2d6 + 3）点挥砍伤害。
</div>
</body>
