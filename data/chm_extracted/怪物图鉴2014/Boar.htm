<!DOCTYPE html>

<meta charset="utf-8">
<title>野猪Boar</title>
</head>
<body>
<div id="Boar">
野猪Boar<br>
中型野兽，无阵营<br>
AC 11<br>
HP 11（2d8 + 2）<br>
速度 40尺<br>
力量13 敏捷11 体质12 智力2 感知9 魅力5<br>
被动察觉9<br>
CR 1/4<br>
【特性】<br>
冲锋：若野猪向其目标直线移动至少20尺，且在同一回合里以牙撕攻击命中该目标，则该目标受额外3（1d6）点挥砍伤害。如果目标是生物，则该生物必须成功通过一次11的力量豁免，否则陷入倒地。<br>
坚韧（短休或长休后充能）。：野猪受到7点或更低的伤害而使其生命值降至0时，改为其生命值降至1。<br>
【动作】<br>
牙撕：mw 命中3，触及5尺，单一目标。4（1d6 + 1）点挥砍伤害。
</div>
</body>
</html>
