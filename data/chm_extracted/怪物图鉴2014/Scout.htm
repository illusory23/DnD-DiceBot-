<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>斥候Scout</title>
</head>
<body>
<div id="Scout">
斥候Scout<br>
中型类人生物（任意种族）<br>
AC 13<br>
HP 16（3d8 + 3）<br>
速度 30尺<br>
力量11 敏捷14 体质12 智力11 感知13 魅力11<br>
技能：自然+4，察觉+5，隐匿+6，生存+5<br>
被动察觉15<br>
语言：任何一种语言（通常是通用语）<br>
CR 1/2<br>
【特性】<br>
敏锐视听觉：斥候依赖听觉或视觉所作的感知（察觉）检定具有优势。<br>
【动作】<br>
多重攻击：斥候发动两次近战攻击，或两次远程攻击。<br>
短剑：mw 命中4，触及5尺，单一目标。5 (1d6 + 2) 点穿刺伤害。<br>
长弓：rw 命中4，射程150/600 尺，单一目标。6 (1d8 + 2) 点穿刺伤害。
</div>
</body>
</html>
