<!DOCTYPE html>

<meta charset="utf-8">
<title>贵族Noble</title>
</head>
<body>
<div id="Noble">
贵族Noble<br>
中型类人生物（任意种族）<br>
AC 15<br>
HP 9（2d8）<br>
速度 30尺<br>
力量11 敏捷12 体质11 智力12 感知14 魅力16<br>
技能：欺诈+5，洞悉+4，游说+5<br>
被动察觉12<br>
语言：任意两种语言<br>
CR 1/8<br>
【动作】<br>
刺剑：mw 命中3，触及5尺，单一目标。5 (1d8 + 1) 点穿刺伤害。<br>
【反应】<br>
格挡：贵族在被一次近战攻击命中时，其AC加上2。此时该贵族必须能看见攻击者，且有在持用一把近战武器。
</div>
</body>
