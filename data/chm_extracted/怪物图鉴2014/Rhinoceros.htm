<title>犀牛Rhinoceros</title>

<body>
<div id="Rhinoceros">
犀牛Rhinoceros<br>
大型野兽，无阵营<br>
AC 11<br>
HP 45（6d10 + 12）<br>
速度 40尺<br>
力量21 敏捷8 体质15 智力2 感知12 魅力6<br>
被动察觉11<br>
CR 2<br>
【特性】<br>
冲锋：若犀牛向其目标直线移动至少20尺，且在同一回合里以顶撞攻击命中该目标，则该目标受额外9（2d8）点钝击伤害。如果目标是生物，则该生物必须成功通过一次15的力量豁免，否则应击倒地。<br>
【动作】<br>
顶撞：mw 命中7，触及5尺，单一目标。14（2d8 + 5）点钝击伤害。
</div>
</body>
