<body>
<div id="Orc">
兽人Orc<br>
中型类人生物（兽人）<br>
AC 13<br>
HP 15（2d8 + 6）<br>
速度 30尺<br>
力量16 敏捷12 体质16 智力7 感知11 魅力10<br>
技能：威吓+2<br>
感官：黑暗视觉 60 尺；被动察觉10<br>
语言：通用语，兽人语<br>
CR 1/2<br>
【特性】<br>
好斗：作为一个附赠动作项，兽人可以向一个它能看见的敌对生物移动至多相当于其速度的距离。<br>
【动作】<br>
巨斧：mw 命中5，触及5尺，单一目标。9（1d12 + 3）点挥砍伤害。<br>
标枪：mw,rw 命中5，触及5尺或射程30/120尺，单一目标。6（1d6 + 3）点穿刺伤害。
</div>
