<title>枭熊Owlbear</title>
</head>
<body>
<div id="Owlbear">
枭熊Owlbear<br>
大型怪兽，无阵营<br>
AC 13<br>
HP 59（7d10 + 21）<br>
速度 40尺<br>
力量20 敏捷12 体质17 智力3 感知12 魅力7<br>
技能：察觉+3<br>
感官：黑暗视觉 60 尺；被动察觉13<br>
CR 3<br>
【特性】<br>
敏锐视嗅觉：枭熊依赖视觉或嗅觉进行的感知（察觉）检定具有优势。<br>
【动作】<br>
多重攻击：枭发动两次攻击：一次喙啄和一次爪击。<br>
喙啄：mw 命中7，触及 5 尺，单一生物。10 (1d10 + 5) 点穿刺伤害。<br>
爪击：mw 命中7，触及5尺，单一目标。14 (2d8 + 5)点挥砍伤害。
</div>
</body>
