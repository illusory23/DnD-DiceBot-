<div id="Tyrannosaurus Rex">
霸王龙Tyrannosaurus Rex<br>
超巨型野兽，无阵营<br>
AC 13<br>
HP 136（13d12 + 52）<br>
速度 50尺<br>
力量25 敏捷10 体质19 智力2 感知12 魅力9<br>
技能：察觉+4<br>
被动察觉14<br>
CR 8<br>
【动作】<br>
多重攻击：霸王龙发动两次攻击：一次啃咬，一次尾击。两次攻击必须指定不同目标。<br>
啃咬：mw 命中10，触及10尺，单一目标。33 (4d12 + 7) 点穿刺伤害。如果目标为一个中型或更小体型的生物，则目标受擒（逃脱17）。被擒抱期间该目标陷入束缚状态，且霸王龙不能啃咬其他目标。<br>
尾击：mw 命中10，触及10尺，单一目标。20（3d8 + 7）点钝击伤害。
</div>
</body>
