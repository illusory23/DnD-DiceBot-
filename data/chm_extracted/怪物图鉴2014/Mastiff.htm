<div id="Mastiff">
獒犬Mastiff<br>
中型野兽，无阵营<br>
AC 12<br>
HP 5（1d8 + 1）<br>
速度 40尺<br>
力量13 敏捷14 体质12 智力3 感知12 魅力7<br>
技能：察觉+3<br>
被动察觉13<br>
CR 1/8<br>
【特性】<br>
敏锐嗅听觉：獒犬依赖听觉或嗅觉进行的感知（察觉）检定具有优势。<br>
【动作】<br>
啃咬：mw 命中3，触及范围5尺，单一目标。4 (1d6 + 1) 点穿刺伤害。如果目标是生物，则其必须进行一次11的力量豁免，豁免失败则应击倒地。
</div>
