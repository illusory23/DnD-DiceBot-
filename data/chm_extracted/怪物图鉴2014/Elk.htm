<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>赤鹿Elk</title>
</head>
<body>
<div id="Elk">
赤鹿Elk<br>
大型野兽，无阵营<br>
AC 10<br>
HP 13（2d10 + 2）<br>
速度 50尺<br>
力量16 敏捷10 体质12 智力2 感知10 魅力6<br>
被动察觉10<br>
CR 1/4<br>
【特性】<br>
冲锋：如果这头麋鹿在同回合内直线移动至少20英尺冲向目标，并用冲撞攻击命中目标，则目标额外受到7（2d6）点伤害。如果目标是生物，则必须进行一次13力量豁免检定，检定失败则被击倒倒地。<br>
【动作】<br>
冲撞：mw 命中5，触及 5 尺，单一目标。6 (1d6 + 3) 点钝击伤害。<br>
蹄击：mw 命中5，触及 5 尺，单一倒地生物。8 (2d4 + 3) 点钝击伤害。
</div>
</body>
</html>
