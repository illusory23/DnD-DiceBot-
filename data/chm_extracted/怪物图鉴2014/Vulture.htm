<body>
<div id="Vulture">
秃鹫Vulture<br>
中型野兽，无阵营<br>
AC 10<br>
HP 5（1d8 + 1）<br>
速度 10尺，飞行50尺<br>
力量7 敏捷10 体质13 智力2 感知12 魅力4<br>
技能：察觉+3<br>
被动察觉13<br>
CR 0<br>
【特性】<br>
敏锐视嗅觉：秃鹫依赖视觉或嗅觉进行的感知（察觉）检定具有优势。<br>
集群战术：秃鹫至少有一个未处于失能的盟友在目标生物5尺内时，它对该生物发动的攻击检定有优势。<br>
【动作】<br>
喙啄：mw 命中2，触及范围5尺，单一目标。2（1d4）点穿刺伤害。
</div>
