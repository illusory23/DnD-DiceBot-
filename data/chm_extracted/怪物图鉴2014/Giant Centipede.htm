<!DOCTYPE html>

<head>
<meta charset="utf-8">
<title>巨蜈蚣Giant Centipede</title>
</head>
<body>
<div id="Giant Centipede">
巨蜈蚣Giant Centipede<br>
小型野兽，无阵营<br>
AC 13<br>
HP 4（1d6 + 1）<br>
速度 30尺，攀爬30尺<br>
力量5 敏捷14 体质12 智力1 感知7 魅力3<br>
感官：盲视 30 尺；被动察觉8<br>
CR 1/4<br>
【动作】<br>
啃咬：mw 命中4，触及5尺，单一生物。4（1d4 + 2）点穿刺伤害，目标必须进行一次11的体质豁免，豁免失败则受10（3d6）点毒素伤害。如果该毒素伤害将目标的生命值降至0，则该目标伤势稳定但仍持续中毒1小时。恢复生命值无法解除该中毒效应，目标同时陷入麻痹和中毒状态。
</div>
</body>
</html>
