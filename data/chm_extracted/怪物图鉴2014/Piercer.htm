<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>石锥怪Piercer</title>
</head>
<body>
<div id="Piercer">
石锥怪Piercer<br>
中型怪兽，无阵营<br>
AC 15<br>
HP 22（3d8 + 9）<br>
速度 5尺，攀爬5尺<br>
力量10 敏捷13 体质16 智力1 感知7 魅力3<br>
技能：隐匿+5<br>
感官：盲视 30 尺，黑暗视觉 60 尺；被动察觉8<br>
CR 1/2<br>
【特性】<br>
无定形：锥怪在天花板上保持不动时与普通的钟乳石几乎一模一样。<br>
蛛行：锥怪无需进行属性检定就能攀爬于困难表面，包括倒挂在天花板上。<br>
【动作】<br>
放下：mw 命中3，目标为直接位于石锥怪下方的生物。3 (1d6) 点穿刺伤害，每坠落10英尺增加一次，最多21 (6d6) 点。未命中：石锥怪承受坠落距离的一半正常坠落伤害。
</div>
</body>
</html>
