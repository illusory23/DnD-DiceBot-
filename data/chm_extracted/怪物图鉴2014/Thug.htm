<!DOCTYPE html>

<meta charset="utf-8">
<title>暴徒Thug</title>
</head>
<body>
<div id="Thug">
暴徒Thug<br>
中型类人生物（任意种族）<br>
AC 11<br>
HP 32（5d8 + 10）<br>
速度 30尺<br>
力量15 敏捷11 体质14 智力10 感知10 魅力11<br>
技能：威吓+2<br>
被动察觉10<br>
语言：任何一种语言（通常是通用语）<br>
CR 1/2<br>
【特性】<br>
集群战术：暴徒至少有一个未处于失能的盟友在目标生物5尺内时，它对该生物发动的攻击检定有优势。<br>
【动作】<br>
多重攻击：暴徒发动两次近战攻击。<br>
硬头锤：mw 命中4，触及5尺，单一生物。5（1d6 + 2）点钝击伤害。<br>
重弩：rw 命中2，射程100/400尺，单一目标。5（1d10）点穿刺伤害。
</div>
</body>
