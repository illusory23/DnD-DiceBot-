<body>
<div id="Giant Boar">
巨野猪Giant Boar<br>
大型野兽，无阵营<br>
AC 12<br>
HP 42（5d10 + 15）<br>
速度 40尺<br>
力量17 敏捷10 体质16 智力2 感知7 魅力5<br>
被动察觉8<br>
CR 2<br>
【特性】<br>
冲锋：若野猪向其目标直线移动至少20尺，且在同一回合里以牙撕攻击命中该目标，则该目标受额外7（2d6）点挥砍伤害。如果目标是生物，则该生物必须成功通过一次13的力量豁免，否则应击倒地。<br>
坚韧（短休或长休后充能）。：野猪受到10点或更低的伤害而使其生命值降至0时，改为其生命值降至1。<br>
【动作】<br>
牙撕：mw 命中5，触及5尺，单一目标。10（2d6 + 3）点挥砍伤害。
</div>
