<title>猛犸Mammoth</title>

<body>
<div id="Mammoth">
猛犸Mammoth<br>
超巨型野兽，无阵营<br>
AC 13<br>
HP 126（11d12 + 55）<br>
速度 40尺<br>
力量24 敏捷9 体质21 智力3 感知11 魅力6<br>
被动察觉10<br>
CR 6<br>
【特性】<br>
践踏冲锋：如果象向某一生物直线移动至少20尺，且在同一回合里以顶撞攻击命中该生物，则该目标必须成功通过一次18的力量豁免，否则应击倒地。如果目标倒地，则象可以用一个附赠动作对其发动一次践踏攻击。<br>
【动作】<br>
顶撞：mw 命中10，触及10尺，单一目标。25 (4d8 + 7) 点穿刺伤害。<br>
践踏：mw 命中10，触及5尺，单一倒地生物。29（4d10 + 7）点钝击伤害。
</div>
</body>
