<title>尖叫菌Shrieker</title>
</head>
<body>
<div id="Shrieker">
尖叫菌Shrieker<br>
中型植物，无阵营<br>
AC 5<br>
HP 13（3d8）<br>
速度 0尺<br>
力量1 敏捷1 体质10 智力1 感知3 魅力1<br>
状态免疫：目盲、耳聋、恐慌<br>
感官：30 尺盲视感官，该感官范围之外则视为目盲状态。；被动察觉6<br>
CR 0<br>
【特性】<br>
无定形：静止不动的尖叫菌与普通的真菌一模一样。<br>
【反应】<br>
尖叫：尖叫菌在其身边30尺内出现生物或光亮时发出尖叫，其周围300尺范围内都能听到声音，尖叫声持续到干扰离开警戒范围，或是持续到尖叫菌发声1d4回合。
</div>
</body>
