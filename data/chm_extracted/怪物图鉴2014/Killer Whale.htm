虎鲸Killer Whale<br>
超巨型野兽，无阵营<br>
AC 12<br>
HP 90（12d12 + 12）<br>
速度 游泳60尺<br>
力量19 敏捷10 体质13 智力3 感知12 魅力7<br>
技能：察觉+3<br>
感官：盲视 120 尺；被动察觉13<br>
CR 3<br>
【特性】<br>
回声定位：虎鲸耳聋时不能使用其盲视感官。<br>
屏息：虎鲸可以屏息 30 分钟。<br>
敏锐听觉：虎鲸依赖听觉进行的感知（察觉）检定具有优势。<br>
【动作】<br>
啃咬：mw 命中6，触及5尺，单一目标。21 (5d6 + 4) 点穿刺伤害。
