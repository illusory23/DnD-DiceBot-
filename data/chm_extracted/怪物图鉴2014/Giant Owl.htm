<div id="Giant Owl">
巨猫头鹰Giant Owl<br>
大型野兽，绝对中立<br>
AC 12<br>
HP 19（3d10 + 3）<br>
速度 5尺，飞行60尺<br>
力量13 敏捷15 体质12 智力8 感知13 魅力10<br>
技能：察觉+5，隐匿+4<br>
感官：黑暗视觉 120 尺；被动察觉15<br>
语言：巨猫头鹰语，能理解通用语、精灵语和木族语，但无法说话<br>
CR 1/4<br>
【特性】<br>
飞掠：猫头鹰飞出敌人的触及范围时不会引起借机攻击。<br>
敏锐视听觉：猫头鹰依赖视觉或听觉进行的感知（察觉）检定具有优势。<br>
【动作】<br>
禽爪：mw 命中3，触及5尺，单一目标。8（2d6 + 1）点挥砍伤害。
