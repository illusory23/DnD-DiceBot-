<title>猫头鹰Owl</title>

<body>
<div id="Owl">
猫头鹰Owl<br>
微型野兽，无阵营<br>
AC 11<br>
HP 1（1d4 - 1）<br>
速度 5尺，飞行60尺<br>
力量3 敏捷13 体质8 智力2 感知12 魅力7<br>
技能：察觉+3，隐匿+3<br>
感官：黑暗视觉 120 尺；被动察觉13<br>
CR 0<br>
【特性】<br>
飞掠：猫头鹰飞出敌人的触及范围时不会引起借机攻击。<br>
敏锐视听觉：猫头鹰依赖视觉或听觉进行的感知（察觉）检定具有优势。<br>
【动作】<br>
禽爪：mw 命中3，触及5尺，单一目标。1点挥砍伤害。
</div>
