<body>
<div id="Giant Rat">
巨鼠Giant Rat<br>
小型野兽，无阵营<br>
AC 12<br>
HP 7（2d6）<br>
速度 30尺<br>
力量7 敏捷15 体质11 智力2 感知10 魅力4<br>
感官：黑暗视觉 60 尺；被动察觉10<br>
CR 1/8<br>
【特性】<br>
敏锐嗅觉：老鼠依赖嗅觉进的感知（察觉）检定具有优势。<br>
集群战术：老鼠至少有一个未处于失能的盟友在目标生物5尺内时，它对该生物发动的攻击检定有优势。<br>
【动作】<br>
啃咬：mw 命中4，触及5尺，单一目标。4（1d4 + 2）点穿刺伤害。
</div>
