<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>狼Wolf</title>
</head>
<body>
<div id="Wolf">
狼Wolf<br>
中型野兽，无阵营<br>
AC 13<br>
HP 11（2d8 + 2）<br>
速度 40尺<br>
力量12 敏捷15 体质12 智力3 感知12 魅力6<br>
技能：察觉+3，隐匿+4<br>
被动察觉13<br>
CR 1/4<br>
【特性】<br>
敏锐嗅听觉：狼在依赖听觉或嗅觉的感知（察觉）检定上具有优势。<br>
集群战术：狼至少有一个未处于失能的盟友在目标生物5尺内时，它对该生物发动的攻击检定有优势。<br>
【动作】<br>
啃咬：mw 命中4，触及5尺，单一目标。7（2d4 + 2）点穿刺伤害。如果目标是一个生物，则目标必须进行一次11的力量豁免，豁免失败则应击倒地。
</div>
</body>
</html>
