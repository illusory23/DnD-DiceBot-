<title>棕熊Brown Bear</title>

<body>
<div id="Brown Bear">
棕熊Brown Bear<br>
大型野兽，无阵营<br>
AC 11<br>
HP 34（4d10 + 12）<br>
速度 40尺，攀爬30尺<br>
力量19 敏捷10 体质16 智力2 感知13 魅力7<br>
技能：察觉+3<br>
被动察觉13<br>
CR 1<br>
【特性】<br>
敏锐嗅觉：熊依赖嗅觉进行的感知（察觉）检定具有优势。<br>
【动作】<br>
多重攻击：熊发动两次攻击，一次是啃咬，一次是爪击。<br>
啃咬：mw 命中6，触及5尺，单一目标。8（1d8 + 4）点穿刺伤害。<br>
爪击：mw 命中6，触及5尺，单一目标。11 (2d6 + 4) 点挥砍伤害。
</div>
</body>
