<body>
<div id="Worg">
座狼Worg<br>
大型怪兽，绝对中立<br>
AC 13<br>
HP 26（4d10 + 4）<br>
速度 50尺<br>
力量16 敏捷13 体质13 智力7 感知11 魅力8<br>
技能：察觉+4<br>
感官：黑暗视觉 60 尺；被动察觉14<br>
语言：地精语，座狼语<br>
CR 1/2<br>
【特性】<br>
敏锐嗅听觉：座狼依赖听觉或嗅觉进行的感知（察觉）检定具有优势。<br>
【动作】<br>
啃咬：mw 命中5，触及5尺，单一目标。10（2d6 + 3）点穿刺伤害。如果目标是生物，则目标必须进行一次13的力量豁免，豁免失败则应击倒地。
</div>
