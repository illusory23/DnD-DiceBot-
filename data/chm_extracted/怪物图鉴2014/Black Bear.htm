<!DOCTYPE html>

<title>黑熊Black Bear</title>
</head>
<body>
<div id="Black Bear">
黑熊Black Bear<br>
中型野兽，无阵营<br>
AC 11<br>
HP 19（3d8 + 6）<br>
速度 40尺，攀爬30尺<br>
力量15 敏捷10 体质14 智力2 感知12 魅力7<br>
技能：察觉+3<br>
被动察觉13<br>
CR 1/2<br>
【特性】<br>
敏锐嗅觉：熊依赖嗅觉进行的感知（察觉）检定具有优势。<br>
【动作】<br>
多重攻击：熊发动两次攻击，一次是啃咬，一次是爪击。<br>
啃咬：mw 命中4，触及5尺，单一目标。5 (1d6 + 2) 点穿刺伤害。<br>
爪击：mw 命中4，触及5尺，单一目标。7（2d4 + 2）点挥砍伤害。
</div>
</body>
