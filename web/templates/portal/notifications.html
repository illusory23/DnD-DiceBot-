<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>消息通知 — 尘封之卷</title>
<style>
:root, [data-theme='dark'] {
  --bg: #0a0a14; --surface: #12122a; --surface2: #1a1a36;
  --text: #e0e0e0; --text-dim: #888; --text-light: #666;
  --accent: #e94460; --accent-light: rgba(233,68,96,0.12);
  --gold: #ffd700; --green: #4caf50; --red: #f44336;
  --cyan: #00bcd4; --border: #2a2a40; --border-light: #1e1e3a;
}
[data-theme='light'] {
  --bg: #f5f0eb; --surface: #fffef9; --surface2: #f0ebe3;
  --text: #2c2416; --text-dim: #8b7355; --text-light: #b8a88a;
  --accent: #c0392b; --accent-light: rgba(192,57,43,0.08);
  --gold: #8b6914; --green: #2d7d46; --red: #c0392b;
  --cyan: #1a7a8a; --border: #d4c8b8; --border-light: #e8ddd0;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;}
a{color:var(--cyan);text-decoration:none;}a:hover{text-decoration:underline;}

.navbar{background:var(--surface);border-bottom:2px solid var(--accent);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;}
.nav-brand{font-size:0.9rem;font-weight:bold;color:var(--gold);text-decoration:none;display:flex;align-items:center;gap:6px;}
.nav-links{display:flex;gap:4px;align-items:center;}
.nav-links a{color:var(--text-dim);text-decoration:none;padding:6px 12px;border-radius:4px;font-size:0.82rem;}
.nav-links a:hover,.nav-links a.active{color:var(--text);background:var(--surface2);}

.container{max-width:820px;margin:0 auto;padding:24px 16px 60px;}
.page-title{font-size:1.3rem;font-weight:bold;color:var(--gold);margin-bottom:20px;padding-bottom:10px;border-bottom:2px solid var(--accent);display:flex;align-items:center;gap:12px;}
.page-title .title-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.notify-badge{display:none;background:var(--red);color:#fff;border-radius:10px;padding:1px 10px;font-size:0.75rem;}

.notify-item{display:flex;align-items:center;gap:12px;padding:13px 16px;background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:10px;cursor:pointer;transition:border-color 0.15s;}
.notify-item:hover{border-color:var(--accent);}
.notify-item.unread{border-left:3px solid var(--red);}
.notify-icon{font-size:1.2rem;flex-shrink:0;}
.notify-body{flex:1;min-width:0;}
.notify-text{font-size:0.85rem;color:var(--text);word-break:break-word;}
.notify-text .actor{color:var(--accent);font-weight:600;}
.notify-meta{font-size:0.72rem;color:var(--text-dim);margin-top:3px;}
.notify-dot{width:8px;height:8px;border-radius:50%;background:var(--red);flex-shrink:0;}

.empty-box{padding:60px 20px;text-align:center;color:var(--text-dim);font-size:0.9rem;}
.empty-box .empty-icon{font-size:2.6rem;display:block;margin-bottom:10px;opacity:0.5;}

.btn{padding:6px 14px;border-radius:4px;font-size:0.8rem;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);transition:all 0.15s;}
.btn:hover{border-color:var(--accent);}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);}

.theme-toggle{position:fixed;bottom:20px;right:20px;z-index:9999;width:40px;height:40px;border-radius:50%;border:2px solid var(--accent);background:var(--surface);color:var(--gold);cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(0,0,0,0.2);transition:all 0.3s;}
.theme-toggle:hover{transform:scale(1.1);}
</style>
  <script src="/static/online-presence.js"></script>
  <script src="/static/common-error-handler.js"></script>
</head>
<body>

<nav class="navbar">
  <a href="/" class="nav-brand">
    <svg viewBox="0 0 100 100" width="14" height="14" style="vertical-align:middle;" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="bsg5" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#f6d365"/><stop offset="40%" style="stop-color:#fda085"/><stop offset="100%" style="stop-color:#f6d365"/></linearGradient></defs><rect x="20" y="20" width="60" height="60" fill="none" stroke="url(#bsg5)" stroke-width="3"/><rect x="20" y="20" width="60" height="60" transform="rotate(45,50,50)" fill="none" stroke="url(#bsg5)" stroke-width="3"/><circle cx="50" cy="50" r="5" fill="url(#bsg5)"/></svg>
    尘封之卷
  </a>
  <div class="nav-links">
    <a href="/">首页</a>
    <a href="/user">用户中心</a>
    <a href="/notifications" class="active">消息通知 <span class="notify-badge" id="nav-badge">0</span></a>
    <a href="/announcements">平台公告</a>
  </div>
</nav>

<div class="container">
  <h1 class="page-title">🔔 消息通知
    <span class="notify-badge" id="page-badge">0 未读</span>
    <span class="title-right"><button class="btn btn-primary" onclick="markAllRead()">✓ 全部已读</button></span>
  </h1>
  <div id="notify-list">
    <div class="empty-box"><span class="empty-icon">📡</span>加载中...</div>
  </div>
</div>

<script>
function escH(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function notifyIcon(type){
  if (type === 'mention') return '@️';
  if (type.indexOf('fav') >= 0) return '⭐';
  if (type.indexOf('like') >= 0) return '👍';
  return '💬';
}

function loadNotifications(){
  fetch('/api/notifications').then(function(r){ return r.json(); }).then(function(d){
    var el = document.getElementById('notify-list');
    if (!el) return;
    if (!d.ok) { el.innerHTML = '<div class="empty-box"><span class="empty-icon">🔐</span>请先登录后查看消息通知</div>'; return; }
    var list = d.notifications || [];
    if (!list.length) { el.innerHTML = '<div class="empty-box"><span class="empty-icon">🕊️</span>暂无消息</div>'; return; }
    el.innerHTML = list.map(function(n){
      var count = n.count || 1;
      var who = count > 1 ? '<b style="color:var(--gold);">' + count + ' 人</b>' : '<span class="actor">' + escH(n.actor || '') + '</span>';
      return '<div class="notify-item' + (n.read ? '' : ' unread') + '" onclick="openNotify(' + n.id + ',\'' + escH(n.link || '') + '\')">' +
        '<span class="notify-icon">' + notifyIcon(n.type) + '</span>' +
        '<span class="notify-body"><span class="notify-text">' + who + ' ' + escH(n.content) + '</span>' +
        '<div class="notify-meta">' + escH((n.created_at || '').slice(0, 16)) + '</div></span>' +
        (n.read ? '' : '<span class="notify-dot"></span>') +
      '</div>';
    }).join('');
  }).catch(function(){
    var el = document.getElementById('notify-list');
    if (el) el.innerHTML = '<div class="empty-box"><span class="empty-icon">⚠️</span>加载失败，请稍后重试</div>';
  });
}

function openNotify(id, link){
  fetch('/api/notifications/read', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id: id})})
    .then(function(){ refreshBadges(); });
  if (link) window.location.href = link;
}

function markAllRead(){
  fetch('/api/notifications/read', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({all: true})})
    .then(function(r){ return r.json(); }).then(function(d){
      if (d.ok) { loadNotifications(); refreshBadges(); Toast.show('已全部标记为已读', 'success'); }
    }).catch(function(){ Toast.show('网络错误', 'error'); });
}

function refreshBadges(){
  fetch('/api/notifications/unread-count').then(function(r){ return r.json(); }).then(function(d){
    var c = (d.ok && d.count) ? d.count : 0;
    var nb = document.getElementById('nav-badge');
    var pb = document.getElementById('page-badge');
    if (nb) { nb.style.display = c > 0 ? '' : 'none'; nb.textContent = c; }
    if (pb) { pb.style.display = c > 0 ? '' : 'none'; pb.textContent = c + ' 未读'; }
  }).catch(function(){});
}

loadNotifications();
refreshBadges();
setInterval(function(){ refreshBadges(); loadNotifications(); }, 30000);
</script>

<button class="theme-toggle" onclick="toggleTheme()" title="切换深色/浅色模式">🌓</button>
<script>
function toggleTheme(){var t=document.documentElement;var cur=t.getAttribute('data-theme')||'dark';var next=cur==='dark'?'light':'dark';t.setAttribute('data-theme',next);var btn=document.querySelector('.theme-toggle');btn.textContent=next==='dark'?'🌓':'☀️';localStorage.setItem('theme',next);}
(function(){var saved=localStorage.getItem('theme')||'dark';document.documentElement.setAttribute('data-theme',saved);var btn=document.querySelector('.theme-toggle');if(btn)btn.textContent=saved==='dark'?'🌓':'☀️';})();
</script>
    <script src="/static/announcement-banner.js"></script>
</body>
</html>
