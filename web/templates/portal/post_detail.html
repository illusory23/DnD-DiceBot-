<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>帖子详情 — 尘封之卷</title>
<style>
:root, [data-theme='dark'] {
  --bg: #0a0a14; --surface: #12122a; --surface2: #1a1a36;
  --text: #e0e0e0; --text-dim: #888; --text-light: #666;
  --accent: #e94460; --accent-light: rgba(233,68,96,0.12);
  --gold: #ffd700; --green: #4caf50; --red: #f44336;
  --cyan: #00bcd4; --border: #2a2a40; --border-light: #1e1e3a;
}
[data-theme='light'] {
  --bg: #f5f0eb; --surface: #fffef9; --surface2: #f0ebe3;
  --text: #2c2416; --text-dim: #8b7355; --text-light: #b8a88a;
  --accent: #c0392b; --accent-light: rgba(192,57,43,0.08);
  --gold: #8b6914; --green: #2d7d46; --red: #c0392b;
  --cyan: #1a7a8a; --border: #d4c8b8; --border-light: #e8ddd0;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;}
a{color:var(--cyan);text-decoration:none;}a:hover{text-decoration:underline;}

.navbar{background:var(--surface);border-bottom:2px solid var(--accent);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;}
.nav-brand{font-size:0.9rem;font-weight:bold;color:var(--gold);text-decoration:none;display:flex;align-items:center;gap:6px;}
.nav-links{display:flex;gap:4px;align-items:center;}
.nav-links a{color:var(--text-dim);text-decoration:none;padding:6px 12px;border-radius:4px;font-size:0.82rem;}
.nav-links a:hover{color:var(--text);background:var(--surface2);}

.container{max-width:820px;margin:0 auto;padding:24px 16px 60px;}

/* ━━ 帖子卡片 ━━ */
.post-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:24px;margin-bottom:16px;}
.post-title{font-size:1.25rem;font-weight:700;color:var(--gold);margin-bottom:12px;word-break:break-word;}
.post-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:0.78rem;color:var(--text-dim);margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border-light);}
.post-meta .author-name{color:var(--accent);font-weight:600;}
.post-content{font-size:0.92rem;line-height:2;word-break:break-word;white-space:pre-wrap;color:var(--text);}
.post-images{margin-top:14px;}
.post-images img{max-width:100%;border-radius:6px;border:1px solid var(--border);margin-bottom:10px;display:block;}
.post-actions{display:flex;gap:10px;align-items:center;margin-top:18px;padding-top:14px;border-top:1px solid var(--border-light);}
.action-btn{background:none;border:1px solid var(--border);border-radius:4px;color:var(--text);cursor:pointer;font-size:0.78rem;padding:5px 12px;display:inline-flex;align-items:center;gap:6px;font-family:inherit;transition:all 0.15s;}
.action-btn:hover{border-color:var(--accent);}
.action-btn.liked{border-color:var(--accent);color:var(--accent);}
.action-btn.faved{border-color:#6abf8a;color:#6abf8a;}
.action-count{color:var(--text-dim);font-size:0.78rem;}

.back-link{display:inline-block;margin-bottom:14px;padding:6px 14px;border:1px solid var(--border);border-radius:4px;font-size:0.8rem;color:var(--text-dim);cursor:pointer;transition:all 0.2s;}
.back-link:hover{color:var(--gold);border-color:var(--accent);}

/* ━━ 评论区 ━━ */
.comment-section{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:20px 24px;}
.comment-head{font-size:0.95rem;color:var(--gold);font-weight:600;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border-light);}
.cmt-item{padding:10px 0;border-bottom:1px solid var(--border-light);}
.cmt-item:last-child{border-bottom:none;}
.cmt-head{display:flex;align-items:center;gap:6px;font-size:0.78rem;}
.cmt-head .cmt-user{color:var(--accent);font-weight:600;}
.cmt-head .cmt-time{color:var(--text-dim);font-weight:normal;}
.cmt-head .cmt-del{color:var(--red);cursor:pointer;margin-left:8px;}
.cmt-body{font-size:0.85rem;color:var(--text);margin-top:3px;white-space:pre-wrap;word-break:break-word;}
.cmt-input-row{display:flex;gap:8px;margin-top:12px;}
.cmt-input-row input{flex:1;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:0.85rem;}
.cmt-input-row input:focus{border-color:var(--accent);outline:none;}
.cmt-submit{padding:7px 18px;background:var(--accent);color:#fff;border:none;border-radius:4px;font-size:0.82rem;cursor:pointer;font-family:inherit;}
.cmt-submit:hover{opacity:0.85;}
.cmt-msg{font-size:0.72rem;color:var(--text-dim);margin-top:6px;}

.empty-box{padding:40px 20px;text-align:center;color:var(--text-dim);font-size:0.9rem;}

.theme-toggle{position:fixed;bottom:20px;right:20px;z-index:9999;width:40px;height:40px;border-radius:50%;border:2px solid var(--accent);background:var(--surface);color:var(--gold);cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(0,0,0,0.2);transition:all 0.3s;}
.theme-toggle:hover{transform:scale(1.1);}
</style>
  <script src="/static/online-presence.js"></script>
  <script src="/static/common-error-handler.js"></script>
<script src="/static/common-dialog.js"></script>
</head>
<body>

<nav class="navbar">
  <a href="/" class="nav-brand">
    <svg viewBox="0 0 100 100" width="14" height="14" style="vertical-align:middle;" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="bsg3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#f6d365"/><stop offset="40%" style="stop-color:#fda085"/><stop offset="100%" style="stop-color:#f6d365"/></linearGradient></defs><rect x="20" y="20" width="60" height="60" fill="none" stroke="url(#bsg3)" stroke-width="3"/><rect x="20" y="20" width="60" height="60" transform="rotate(45,50,50)" fill="none" stroke="url(#bsg3)" stroke-width="3"/><circle cx="50" cy="50" r="5" fill="url(#bsg3)"/></svg>
    尘封之卷
  </a>
  <div class="nav-links">
    <a href="/">首页</a>
    <a href="/user">用户中心</a>
    <a href="/announcements">平台公告</a>
  </div>
</nav>

<div class="container">
  <a href="javascript:history.length > 1 ? history.back() : (location.href='/')" class="back-link">← 返回</a>
  <div id="post-box">
    <div class="empty-box">加载中...</div>
  </div>
</div>

<script>
var POST_ID = {{ post_id }};
var _publicBase = '{{ public_base or "" }}';
var currentUser = null;

function escH(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
/* 头像（与首页一致：正常文档流，加载成功移除占位，失败回退） */
function _avatarHTML(url,size){var fb="<span style='display:inline-flex;align-items:center;justify-content:center;width:"+size+"px;height:"+size+"px;border-radius:50%;background:var(--surface2);font-size:"+Math.round(size*0.5)+"px;vertical-align:middle;flex-shrink:0;'>⚔️</span>";if(!url)return fb;return "<span style='display:inline-flex;position:relative;vertical-align:middle;flex-shrink:0;'><img src='"+url+"' alt='' style='width:"+size+"px;height:"+size+"px;border-radius:50%;object-fit:cover;display:inline-flex;' onload='var s=this.nextElementSibling;if(s)s.remove()' onerror='this.remove()'>"+fb+"</span>";}
var _avatarCache={};
function ensureAvatars(names,cb){names=(names||[]).filter(function(n){return n;});var need=[];names.forEach(function(n){if(!(n in _avatarCache))need.push(n);});if(!need.length){cb(_avatarCache);return;}fetch("/api/users/avatars?names="+encodeURIComponent(need.join(","))).then(function(r){return r.json();}).then(function(d){if(d.ok)for(var k in d.avatars)_avatarCache[k]=d.avatars[k];cb(_avatarCache);}).catch(function(){cb(_avatarCache);});}

/* ━━ 加载帖子详情 ━━ */
function loadPost(){
  fetch('/api/community/posts/' + POST_ID).then(function(r){ return r.json(); }).then(function(d){
    var box = document.getElementById('post-box');
    if (!d.ok || !d.post) { box.innerHTML = '<div class="empty-box">帖子不存在或已被删除</div>'; return; }
    var p = d.post;
    document.title = p.title + ' — 尘封之卷';
    var likeCls = p.liked ? ' liked' : '';
    var favCls = '';
    box.innerHTML =
      '<div class="post-card">' +
        '<h1 class="post-title">' + escH(p.title) + '</h1>' +
        '<div class="post-meta">' + _avatarHTML(p.author_avatar, 22) +
          '<span class="author-name">' + escH(p.author) + '</span>' +
          '<span>·</span><span>' + escH(p.created_at || '') + '</span>' +
          '<span>·</span><a href="/" style="color:var(--cyan);">' + escH(p.boardName || '') + '</a>' +
          '<span>·</span><span title="浏览量（每用户计一次）">👁️ ' + (p.views || 0) + '</span>' +
        '</div>' +
        '<div class="post-content">' + escH(p.content) + '</div>' +
        (p.images && p.images.length ? '<div class="post-images">' + p.images.map(function(u){
          return '<img src="' + escH(u) + '" alt="">'; }).join('') + '</div>' : '') +
        '<div class="post-actions">' +
          '<button class="action-btn' + likeCls + '" id="like-btn" onclick="toggleLike(this)">👍 点赞</button>' +
          '<span class="action-count" id="like-cnt">' + (p.like_count || 0) + '</span>' +
          '<button class="action-btn' + favCls + '" id="fav-btn" onclick="toggleFav(this)">⭐ 收藏</button>' +
          '<span class="action-count" id="fav-cnt">' + (p.fav_count || 0) + '</span>' +
          '<button class="action-btn" onclick="sharePost()" title="复制帖子链接">🔗 分享</button>' +
        '</div>' +
      '</div>' +
      '<div class="comment-section">' +
        '<div class="comment-head">💬 评论</div><div id="cmt-list"></div>' +
        '<div class="cmt-input-row"><input type="text" id="cmt-input" maxlength="500" placeholder="写下评论...（最多500字）" onkeydown="if(event.key===\'Enter\')submitComment()"><button class="cmt-submit" onclick="submitComment()">发表</button></div>' +
        '<div class="cmt-msg" id="cmt-msg"></div>' +
      '</div>';
    if (p.liked) document.getElementById('like-btn').textContent = '👍 已赞';
    var fb = document.getElementById('fav-btn');
    if (fb) initFavBtn(fb);
    loadComments();
  }).catch(function(){
    document.getElementById('post-box').innerHTML = '<div class="empty-box">加载失败，请稍后重试</div>';
  });
}

/* ━━ 浏览量上报（登录用户去重，v5.8）+ 分享链接 ━━ */
function recordPostView(){
  fetch('/api/community/posts/' + POST_ID + '/view', {method:'POST'}).catch(function(){});
}
function sharePost(){
  // 公网基址优先（config.PUBLIC_BASE_URL 注入），避免复制出 localhost 链接
  var url = (window._publicBase ? window._publicBase + location.pathname + location.search : location.href);
  function done(){ Toast.show('🔗 链接已复制', 'success'); }
  function fail(){ window.prompt('复制链接：', url); }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(done, fail);
  } else { fail(); }
}

/* ━━ 点赞 / 收藏 ━━ */
function toggleLike(btn){
  fetch('/api/community/posts/' + POST_ID + '/like', {method:'POST'}).then(function(r){ return r.json(); })
    .then(function(d){
      if (!d.ok) { Toast.show(d.error || '操作失败', 'error'); return; }
      document.getElementById('like-cnt').textContent = d.like_count;
      btn.textContent = d.liked ? '👍 已赞' : '👍 点赞';
      btn.classList.toggle('liked', d.liked);
    }).catch(function(){ Toast.show('网络错误', 'error'); });
}
function toggleFav(btn){
  fetch('/api/favorites', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({type:'post', id:POST_ID})})
    .then(function(r){ return r.json(); }).then(function(d){
      if (!d.ok) { Toast.show(d.error || '操作失败', 'error'); return; }
      var cnt = document.getElementById('fav-cnt');
      cnt.textContent = (parseInt(cnt.textContent) || 0) + (d.favorited ? 1 : -1);
      btn.textContent = d.favorited ? '⭐ 已收藏' : '⭐ 收藏';
      btn.classList.toggle('faved', d.favorited);
    }).catch(function(){ Toast.show('网络错误', 'error'); });
}
function initFavBtn(btn){
  fetch('/api/favorites').then(function(r){ return r.json(); }).then(function(d){
    if (!d.ok) return;
    if ((d.favorites || []).some(function(f){ return f.type === 'post' && f.item_id === POST_ID; })) {
      btn.textContent = '⭐ 已收藏';
      btn.classList.add('faved');
    }
  }).catch(function(){});
}

/* ━━ 评论 ━━ */
function loadComments(){
  fetch('/api/community/posts/' + POST_ID).then(function(r){ return r.json(); }).then(function(d){
    var list = document.getElementById('cmt-list');
    if (!list || !d.ok) return;
    var comments = d.post.comments || [];
    if (!comments.length) { list.innerHTML = '<div style="font-size:0.75rem;color:var(--text-dim);">暂无评论，来抢沙发～</div>'; return; }
    ensureAvatars(comments.map(function(c){ return c.username; }), function(av){
      list.innerHTML = comments.map(function(c){
        var canDel = currentUser && (currentUser.username === c.username || currentUser.is_admin);
        return '<div class="cmt-item"><div class="cmt-head">' + _avatarHTML(av[c.username], 20) +
          '<span class="cmt-user">' + escH(c.username) + '</span>' +
          '<span class="cmt-time">' + escH(c.created_at || '') + '</span>' +
          (canDel ? '<a class="cmt-del" onclick="deleteComment(' + c.id + ')">删除</a>' : '') +
          '</div><div class="cmt-body">' + escH(c.content) + '</div></div>';
      }).join('');
    });
  }).catch(function(){});
}
function submitComment(){
  var input = document.getElementById('cmt-input');
  var content = (input.value || '').trim();
  var msg = document.getElementById('cmt-msg');
  if (!content) { msg.textContent = '请输入评论内容'; return; }
  fetch('/api/community/posts/' + POST_ID + '/comments', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({content: content})})
    .then(function(r){ return r.json(); }).then(function(d){
      if (d.ok) { input.value = ''; msg.textContent = ''; loadComments(); }
      else { msg.textContent = d.error || '评论失败'; if (r.status === 401) Toast.show('请先登录官网账号', 'warning'); }
    }).catch(function(){ msg.textContent = '网络错误，请重试'; });
}
async function deleteComment(cid){
  if (!await showConfirmDialog('确定删除这条评论吗？')) return;
  fetch('/api/community/posts/' + POST_ID + '/comments/' + cid, {method:'DELETE'})
    .then(function(r){ return r.json(); }).then(function(d){
      if (d.ok) loadComments(); else Toast.show(d.error || '删除失败', 'error');
    }).catch(function(){ Toast.show('网络错误', 'error'); });
}

/* ━━ 当前用户 ━━ */
fetch('/api/auth/me').then(function(r){ return r.json(); }).then(function(d){ if (d.ok) currentUser = d.user; }).catch(function(){});

loadPost();
recordPostView();
</script>

<button class="theme-toggle" onclick="toggleTheme()" title="切换深色/浅色模式">🌓</button>
<script>
function toggleTheme(){var t=document.documentElement;var cur=t.getAttribute('data-theme')||'dark';var next=cur==='dark'?'light':'dark';t.setAttribute('data-theme',next);var btn=document.querySelector('.theme-toggle');btn.textContent=next==='dark'?'🌓':'☀️';localStorage.setItem('theme',next);}
(function(){var saved=localStorage.getItem('theme')||'dark';document.documentElement.setAttribute('data-theme',saved);var btn=document.querySelector('.theme-toggle');if(btn)btn.textContent=saved==='dark'?'🌓':'☀️';})();
</script>
    <script src="/static/announcement-banner.js"></script>
</body>
</html>
