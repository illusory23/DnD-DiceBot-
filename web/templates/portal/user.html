<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户中心 — 尘封之卷</title>
<style>
:root, [data-theme='dark'] {
  --bg: #0a0a14; --surface: #12122a; --surface2: #1a1a36;
  --text: #e0e0e0; --text-dim: #888; --text-light: #666;
  --accent: #e94460; --accent-light: rgba(233,68,96,0.12);
  --gold: #ffd700; --green: #4caf50; --red: #f44336;
  --cyan: #00bcd4; --border: #2a2a40; --border-light: #1e1e3a;
}
[data-theme='light'] {
  --bg: #f5f0eb; --surface: #fffef9; --surface2: #f0ebe3;
  --text: #2c2416; --text-dim: #8b7355; --text-light: #b8a88a;
  --accent: #c0392b; --accent-light: rgba(192,57,43,0.08);
  --gold: #8b6914; --green: #2d7d46; --red: #c0392b;
  --cyan: #1a7a8a; --border: #d4c8b8; --border-light: #e8ddd0;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;}
a{color:var(--cyan);text-decoration:none;}a:hover{text-decoration:underline;}

/* ━━ 导航栏 ━━ */
.navbar{background:var(--surface);border-bottom:2px solid var(--accent);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;}
.nav-brand{font-size:0.9rem;font-weight:bold;color:var(--gold);text-decoration:none;display:flex;align-items:center;gap:6px;}
.nav-links{display:flex;gap:4px;align-items:center;}
.nav-links a{color:var(--text-dim);text-decoration:none;padding:6px 12px;border-radius:4px;font-size:0.82rem;}
.nav-links a:hover,.nav-links a.active{color:var(--text);background:var(--surface2);}

/* ━━ 主体 ━━ */
.container{max-width:900px;margin:0 auto;padding:24px 16px;}
.page-title{font-size:1.3rem;font-weight:bold;color:var(--gold);margin-bottom:20px;padding-bottom:10px;border-bottom:2px solid var(--accent);}

/* ━━ 卡片 ━━ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:16px;overflow:hidden;}
.card-header{padding:12px 16px;background:var(--surface2);border-bottom:1px solid var(--border);font-weight:600;color:var(--gold);font-size:0.9rem;display:flex;align-items:center;gap:8px;}
.card-body{padding:16px;}

/* ━━ 用户信息行 ━━ */
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;}
.info-item{display:flex;flex-direction:column;gap:4px;}
.info-label{font-size:0.72rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px;}
.info-value{font-size:0.95rem;color:var(--text);word-break:break-all;}
.info-value.empty{color:var(--text-light);font-style:italic;}

/* ━━ 统计数字 ━━ */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;text-align:center;}
.stat-item{padding:12px 8px;background:var(--bg);border-radius:6px;border:1px solid var(--border);}
.stat-num{font-size:1.5rem;font-weight:bold;color:var(--gold);}
.stat-label{font-size:0.72rem;color:var(--text-dim);margin-top:4px;}

/* ━━ 列表 ━━ */
.item-list{display:flex;flex-direction:column;gap:6px;}
.item-row{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg);border-radius:4px;border:1px solid var(--border);font-size:0.82rem;}
.item-row:hover{border-color:var(--accent);}
.item-icon{font-size:1.2rem;}
.item-name{flex:1;}
.item-meta{font-size:0.72rem;color:var(--text-dim);white-space:nowrap;}

/* ━━ 编辑按钮 ━━ */
.btn{padding:6px 14px;border-radius:4px;font-size:0.8rem;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);transition:all 0.15s;}
.btn:hover{border-color:var(--accent);}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn-primary:hover{opacity:0.85;}
.btn-sm{padding:4px 10px;font-size:0.72rem;}

/* ━━ 模态框 ━━ */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:999;display:none;align-items:center;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal-card{background:var(--surface);border:1px solid var(--accent);border-radius:8px;padding:24px;max-width:420px;width:90%;}
.modal-card h3{color:var(--gold);margin-bottom:14px;}
.modal-card input,.modal-card textarea{width:100%;padding:9px 12px;margin-bottom:10px;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:0.9rem;font-family:inherit;}
.modal-card input:focus,.modal-card textarea:focus{border-color:var(--accent);outline:none;}
.modal-card textarea{resize:vertical;min-height:60px;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;}

@media(max-width:600px){.stat-grid{grid-template-columns:repeat(2,1fr);}}

.theme-toggle{position:fixed;bottom:20px;right:20px;z-index:9999;width:40px;height:40px;border-radius:50%;border:2px solid var(--accent);background:var(--surface);color:var(--gold);cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(0,0,0,0.2);transition:all 0.3s;}
.theme-toggle:hover{transform:scale(1.1);}
</style>
  <script src="/static/online-presence.js"></script>
</head>
<body>

<nav class="navbar">
  <a href="/" class="nav-brand">
    <svg viewBox="0 0 100 100" width="14" height="14" style="vertical-align:middle;" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="bsg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#f6d365"/><stop offset="40%" style="stop-color:#fda085"/><stop offset="100%" style="stop-color:#f6d365"/></linearGradient></defs><rect x="20" y="20" width="60" height="60" fill="none" stroke="url(#bsg)" stroke-width="3"/><rect x="20" y="20" width="60" height="60" transform="rotate(45,50,50)" fill="none" stroke="url(#bsg)" stroke-width="3"/><circle cx="50" cy="50" r="5" fill="url(#bsg)"/></svg>
    尘封之卷
  </a>
  <div class="nav-links">
    <a href="/">首页</a>
    <a href="user.html" class="active">用户中心</a>
    <a href="#" onclick="doLogout()">退出</a>
  </div>
</nav>

<div class="container">
  <h1 class="page-title">👤 用户中心</h1>

  <!-- ━━ 基本信息 ━━ -->
  <div class="card">
    <div class="card-header">📋 基本信息 <button class="btn btn-sm" onclick="showEditModal()" style="margin-left:auto;">✏️ 编辑</button></div>
    <div class="card-body">
      <div class="info-grid">
        <div class="info-item"><span class="info-label">用户 ID</span><span class="info-value" id="info-id">—</span></div>
        <div class="info-item"><span class="info-label">用户名</span><span class="info-value" id="info-username">—</span></div>
        <div class="info-item"><span class="info-label">绑定邮箱</span><span class="info-value empty" id="info-email">未绑定</span></div>
        <div class="info-item"><span class="info-label">绑定手机号</span><span class="info-value empty" id="info-phone">未绑定</span></div>
        <div class="info-item"><span class="info-label">注册时间</span><span class="info-value" id="info-created">—</span></div>
        <div class="info-item"><span class="info-label">最后登录</span><span class="info-value" id="info-login">—</span></div>
        <div class="info-item" style="grid-column:1/-1;"><span class="info-label">个人简介</span><span class="info-value empty" id="info-bio">暂无简介</span></div>
      </div>
    </div>
  </div>

  <!-- ━━ 数据统计 ━━ -->
  <div class="card">
    <div class="card-header">📊 平台数据</div>
    <div class="card-body">
      <div class="stat-grid">
        <div class="stat-item"><div class="stat-num" id="stat-workshop">0</div><div class="stat-label">角色数量</div></div>
        <div class="stat-item"><div class="stat-num" id="stat-posts">0</div><div class="stat-label">—</div></div>
        <div class="stat-item"><div class="stat-num" id="stat-replies">0</div><div class="stat-label">—</div></div>
        <div class="stat-item"><div class="stat-num" id="stat-downloads">0</div><div class="stat-label">—</div></div>
      </div>
    </div>
  </div>

  <!-- ━━ 发布的资源 ━━ -->
  <div class="card">
    <div class="card-header">🔧 创意工坊投稿</div>
    <div class="card-body">
      <div class="item-list" id="workshop-list">
        <div style="color:var(--text-dim);text-align:center;padding:20px;font-size:0.85rem;">暂无投稿</div>
      </div>
    </div>
  </div>

  <!-- ━━ 社区帖子 ━━ -->
  <div class="card">
    <div class="card-header">💬 酒馆发帖数量</div>
    <div class="card-body">
      <div class="item-list" id="posts-list">
        <div style="color:var(--text-dim);text-align:center;padding:20px;font-size:0.85rem;">暂无发帖</div>
      </div>
    </div>
  </div>

  <!-- ━━ 我的收藏 ━━ -->
  <div class="card">
    <div class="card-header">⭐ 我的收藏</div>
    <div class="card-body">
      <div class="item-list" id="fav-list">
        <div style="color:var(--text-dim);text-align:center;padding:20px;font-size:0.85rem;">加载中...</div>
      </div>
    </div>
  </div>

  <!-- ━━ 我的评论 ━━ -->
  <div class="card">
    <div class="card-header">💬 我的评论</div>
    <div class="card-body">
      <div class="item-list" id="mycmt-list">
        <div style="color:var(--text-dim);text-align:center;padding:20px;font-size:0.85rem;">加载中...</div>
      </div>
    </div>
  </div>
</div>

<!-- ━━ 编辑资料弹窗 ━━ -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal-card">
    <h3>✏️ 编辑资料</h3>
    <label style="font-size:0.78rem;color:var(--text-dim);">用户名（可修改，用户ID不变）</label>
    <input type="text" id="edit-username" placeholder="用户名">
    <label style="font-size:0.78rem;color:var(--text-dim);">邮箱</label>
    <input type="email" id="edit-email" placeholder="绑定邮箱">
    <label style="font-size:0.78rem;color:var(--text-dim);">手机号</label>
    <input type="tel" id="edit-phone" placeholder="绑定手机号">
    <label style="font-size:0.78rem;color:var(--text-dim);">个人简介</label>
    <textarea id="edit-bio" placeholder="介绍一下自己..."></textarea>
    <div class="modal-actions">
      <button class="btn" onclick="hideEditModal()">取消</button>
      <button class="btn btn-primary" onclick="saveProfile()">保存</button>
    </div>
  </div>
</div>

<script>
var _currentUser = null;

// 加载用户数据（从服务器API）
function loadUserData(){
  fetch('/api/auth/me').then(function(r){ return r.json(); }).then(function(d){
    if (!d.ok || !d.user) {
      // 未登录，跳转首页
      document.querySelector('.container').innerHTML = '<div class="page-title">请先登录</div><div class="card"><div class="card-body" style="text-align:center;padding:40px;"><p style="color:var(--text-dim);margin-bottom:16px;">请先在首页登录或注册账号</p><a href="/" class="btn btn-primary" style="display:inline-block;">返回首页</a></div></div>';
      return;
    }
    _currentUser = d.user;
    renderUser(d.user);
  }).catch(function(e){
    console.error('加载用户数据失败:', e);
  });
}

function renderUser(user){
  document.getElementById('info-id').textContent = user.id || '—';
  document.getElementById('info-username').textContent = user.username || '—';
  setValue('info-email', user.email);
  setValue('info-phone', user.phone);
  document.getElementById('info-created').textContent = (user.created_at||'').slice(0,10) || '—';
  document.getElementById('info-login').textContent = (user.last_login||'').slice(0,16) || '—';
  setValue('info-bio', user.bio, '暂无简介');

  // 真实数据
  document.getElementById('stat-workshop').textContent = user.character_count || 0;
  document.getElementById('stat-posts').textContent = '—';
  document.getElementById('stat-replies').textContent = '—';
  document.getElementById('stat-downloads').textContent = '—';

  // 填充编辑框
  document.getElementById('edit-username').value = user.username || '';
  document.getElementById('edit-email').value = user.email || '';
  document.getElementById('edit-phone').value = user.phone || '';
  document.getElementById('edit-bio').value = user.bio || '';

  loadMyFavorites();
  loadMyComments();
}

function escH(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// 我的收藏
function loadMyFavorites(){
  fetch('/api/favorites').then(function(r){ return r.json(); }).then(function(d){
    var el = document.getElementById('fav-list');
    if (!el) return;
    if (!d.ok || !d.favorites || !d.favorites.length) {
      el.innerHTML = '<div style="color:var(--text-dim);text-align:center;padding:20px;font-size:0.85rem;">暂无收藏</div>';
      return;
    }
    el.innerHTML = d.favorites.map(function(f){
      var icon = f.type === 'post' ? '💬' : '📦';
      var link = 'javascript:void(0)'; // 收藏项仅展示（酒馆帖子详情弹窗在首页）
      return '<div class="item-row"><span>'+icon+'</span><a href="'+link+'" style="color:var(--cyan);flex:1;">'+escH(f.title)+'</a><span style="color:var(--text-dim);font-size:0.72rem;">'+(f.author||'')+' · '+(f.created_at||'').slice(0,10)+'</span></div>';
    }).join('');
  }).catch(function(){});
}

// 我的评论
function loadMyComments(){
  fetch('/api/my/comments').then(function(r){ return r.json(); }).then(function(d){
    var el = document.getElementById('mycmt-list');
    if (!el) return;
    if (!d.ok || !d.comments || !d.comments.length) {
      el.innerHTML = '<div style="color:var(--text-dim);text-align:center;padding:20px;font-size:0.85rem;">暂无评论</div>';
      return;
    }
    el.innerHTML = d.comments.map(function(c){
      var icon = c.type === 'post' ? '💬' : '📦';
      return '<div class="item-row" style="flex-direction:column;align-items:flex-start;gap:4px;">' +
        '<div style="display:flex;width:100%;gap:8px;"><span>'+icon+'</span><span style="color:var(--cyan);flex:1;font-size:0.8rem;">'+escH(c.parent_title)+'</span><span style="color:var(--text-dim);font-size:0.7rem;">'+(c.created_at||'').slice(0,16)+'</span></div>' +
        '<div style="color:var(--text-dim);font-size:0.78rem;padding-left:24px;">'+escH(c.content)+'</div></div>';
    }).join('');
  }).catch(function(){});
}

function setValue(id, val, emptyText){
  var el = document.getElementById(id);
  if (!el) return;
  if (val) { el.textContent = val; el.classList.remove('empty'); }
  else { el.textContent = emptyText || '未设置'; el.classList.add('empty'); }
}

// 编辑弹窗
function showEditModal(){ document.getElementById('edit-modal').classList.add('show'); }
function hideEditModal(){ document.getElementById('edit-modal').classList.remove('show'); }
document.getElementById('edit-modal').addEventListener('click',function(e){ if(e.target===this)hideEditModal(); });

function saveProfile(){
  var data = {
    username: document.getElementById('edit-username').value.trim(),
    email: document.getElementById('edit-email').value.trim(),
    phone: document.getElementById('edit-phone').value.trim(),
    bio: document.getElementById('edit-bio').value.trim(),
  };
  fetch('/api/auth/update-profile', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(data),
  }).then(function(r){ return r.json(); }).then(function(d){
    if (!d.ok) { alert(d.error); return; }
    hideEditModal();
    renderUser(d.user);
  }).catch(function(e){ alert('保存失败: ' + e.message); });
}

function doLogout(){
  fetch('/api/auth/logout', {method:'POST'}).then(function(){
    window.location.href = '/';
  }).catch(function(){ window.location.href = '/'; });
}

loadUserData();

function toggleTheme(){var t=document.documentElement;var cur=t.getAttribute('data-theme')||'dark';var next=cur==='dark'?'light':'dark';t.setAttribute('data-theme',next);var btn=document.querySelector('.theme-toggle');btn.textContent=next==='dark'?'🌓':'☀️';localStorage.setItem('theme',next);}
(function(){var saved=localStorage.getItem('theme')||'dark';document.documentElement.setAttribute('data-theme',saved);var btn=document.querySelector('.theme-toggle');if(btn)btn.textContent=saved==='dark'?'🌓':'☀️';})();

</script>

<button class="theme-toggle" onclick="toggleTheme()" title="切换深色/浅色模式">🌓</button>
<script>
// 离开跑团平台：清除跑团会话，重新进入时需重新选择身份
(function(){try{sessionStorage.removeItem('dnd_joined_room');}catch(e){}})();
</script>
