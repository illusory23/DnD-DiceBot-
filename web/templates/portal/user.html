<style>
:root, [data-theme='dark'] {
  --bg: #0a0a14; --surface: #12122a; --surface2: #1a1a36;
  --text: #e0e0e0; --text-dim: #888; --text-light: #666;
  --accent: #e94460; --accent-light: rgba(233,68,96,0.12);
  --gold: #ffd700; --green: #4caf50; --red: #f44336;
  --cyan: #00bcd4; --border: #2a2a40; --border-light: #1e1e3a;
}
[data-theme='light'] {
  --bg: #f5f0eb; --surface: #fffef9; --surface2: #f0ebe3;
  --text: #2c2416; --text-dim: #8b7355; --text-light: #b8a88a;
  --accent: #c0392b; --accent-light: rgba(192,57,43,0.08);
  --gold: #8b6914; --green: #2d7d46; --red: #c0392b;
  --cyan: #1a7a8a; --border: #d4c8b8; --border-light: #e8ddd0;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;}
a{color:var(--cyan);text-decoration:none;}a:hover{text-decoration:underline;}

/* ━━ 导航栏 ━━ */
.navbar{background:var(--surface);border-bottom:2px solid var(--accent);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;}
.nav-brand{font-size:0.9rem;font-weight:bold;color:var(--gold);text-decoration:none;display:flex;align-items:center;gap:6px;}
.nav-links{display:flex;gap:4px;align-items:center;}
.nav-links a{color:var(--text-dim);text-decoration:none;padding:6px 12px;border-radius:4px;font-size:0.82rem;}
.nav-links a:hover,.nav-links a.active{color:var(--text);background:var(--surface2);}

/* ━━ 主体 ━━ */
.container{max-width:900px;margin:0 auto;padding:24px 16px;}
.page-title{font-size:1.3rem;font-weight:bold;color:var(--gold);margin-bottom:20px;padding-bottom:10px;border-bottom:2px solid var(--accent);}

/* ━━ 卡片 ━━ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:16px;overflow:hidden;}
.card-header{padding:12px 16px;background:var(--surface2);border-bottom:1px solid var(--border);font-weight:600;color:var(--gold);font-size:0.9rem;display:flex;align-items:center;gap:8px;}
.card-body{padding:16px;}

/* ━━ 用户信息行 ━━ */
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;}
.info-item{display:flex;flex-direction:column;gap:4px;}
.info-label{font-size:0.72rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px;}
.info-value{font-size:0.95rem;color:var(--text);word-break:break-all;}
.info-value.empty{color:var(--text-light);font-style:italic;}

/* ━━ 统计数字 ━━ */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;text-align:center;}
.stat-item{padding:12px 8px;background:var(--bg);border-radius:6px;border:1px solid var(--border);}
.stat-num{font-size:1.5rem;font-weight:bold;color:var(--gold);}
.stat-label{font-size:0.72rem;color:var(--text-dim);margin-top:4px;}

/* ━━ 列表 ━━ */
.item-list{display:flex;flex-direction:column;gap:6px;}
.item-row{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg);border-radius:4px;border:1px solid var(--border);font-size:0.82rem;}
.item-row:hover{border-color:var(--accent);}
.item-icon{font-size:1.2rem;}
.item-name{flex:1;}
.item-meta{font-size:0.72rem;color:var(--text-dim);white-space:nowrap;}

/* ━━ 编辑按钮 ━━ */
.btn{padding:6px 14px;border-radius:4px;font-size:0.8rem;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);transition:all 0.15s;}
.btn:hover{border-color:var(--accent);}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn-primary:hover{opacity:0.85;}
.btn-sm{padding:4px 10px;font-size:0.72rem;}

/* ━━ 模态框 ━━ */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:999;display:none;align-items:center;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal-card{background:var(--surface);border:1px solid var(--accent);border-radius:8px;padding:24px;max-width:420px;width:90%;}
.modal-card h3{color:var(--gold);margin-bottom:14px;}
.modal-card input,.modal-card textarea{width:100%;padding:9px 12px;margin-bottom:10px;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:0.9rem;font-family:inherit;}
.modal-card input:focus,.modal-card textarea:focus{border-color:var(--accent);outline:none;}
.modal-card textarea{resize:vertical;min-height:60px;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;}

@media(max-width:600px){.stat-grid{grid-template-columns:repeat(2,1fr);}}

.theme-toggle{position:fixed;bottom:20px;right:20px;z-index:9999;width:40px;height:40px;border-radius:50%;border:2px solid var(--accent);background:var(--surface);color:var(--gold);cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(0,0,0,0.2);transition:all 0.3s;}
.theme-toggle:hover{transform:scale(1.1);}
</style>

<script>
var _currentUser = null;

// 加载用户数据（从服务器API）
function loadUserData(){
  fetch('/api/auth/me').then(function(r){ return r.json(); }).then(function(d){
    if (!d.ok || !d.user) {
      // 未登录，跳转首页
      document.querySelector('.container').innerHTML = '<div class="page-title">请先登录</div><div class="card"><div class="card-body" style="text-align:center;padding:40px;"><p style="color:var(--text-dim);margin-bottom:16px;">请先在首页登录或注册账号</p><a href="/" class="btn btn-primary" style="display:inline-block;">返回首页</a></div></div>';
      return;
    }
    _currentUser = d.user;
    renderUser(d.user);
  }).catch(function(e){
    console.error('加载用户数据失败:', e);
  });
}

function avatarLoadError(img){
  // 头像文件缺失时回退默认占位（避免破图）
  if (!img) return;
  img.style.display = 'none';
  var holder = document.getElementById('avatar-holder');
  if (holder) holder.style.display = 'flex';
  var delBtn = document.getElementById('avatar-del-btn');
  if (delBtn) delBtn.style.display = 'none';
}

function renderAvatar(user){
  var img = document.getElementById('info-avatar');
  var holder = document.getElementById('avatar-holder');
  var delBtn = document.getElementById('avatar-del-btn');
  if (!img) return;
  if (user && user.avatar_url) {
    img.src = user.avatar_url;
    img.style.display = 'block';
    holder.style.display = 'none';
    if (delBtn) delBtn.style.display = '';
  } else {
    img.style.display = 'none';
    img.removeAttribute('src');
    holder.style.display = 'flex';
    if (delBtn) delBtn.style.display = 'none';
  }
}

function uploadAvatar(input){
  var f = input && input.files && input.files[0];
  if (!f) return;
  if (!f.type || f.type.indexOf('image/') !== 0) { Toast.show('请选择图片文件', 'error'); input.value = ''; return; }
  if (f.size > 2 * 1024 * 1024) { Toast.show('图片过大（最大2MB）', 'error'); input.value = ''; return; }
  openCrop(f, input);
}

/* ━━ 头像圆形裁剪 ━━ */
var _crop = null; // {img, baseW, baseH, zoom, left, top, input}
var CROP_SIZE = 300;   // 裁剪显示区（圆形）尺寸
var EXPORT_SIZE = 512; // 导出尺寸

function openCrop(file, input){
  var reader = new FileReader();
  reader.onload = function(e){
    var img = new Image();
    img.onload = function(){
      var stage = document.getElementById('crop-stage');
      var el = document.getElementById('crop-img');
      // 初始：图片最小边铺满圆形区（cover）
      var scale = CROP_SIZE / Math.min(img.naturalWidth, img.naturalHeight);
      var baseW = img.naturalWidth * scale;
      var baseH = img.naturalHeight * scale;
      _crop = { img: img, baseW: baseW, baseH: baseH, zoom: 100,
                left: (CROP_SIZE - baseW) / 2, top: (CROP_SIZE - baseH) / 2, input: input };
      el.src = e.target.result;
      document.getElementById('crop-zoom').value = 100;
      document.getElementById('crop-zoom').min = Math.ceil(CROP_SIZE / Math.min(baseW, baseH) * 100);
      applyCropView();
      document.getElementById('crop-modal').classList.add('show');
      stage.style.visibility = 'hidden';
      el.onload = function(){ stage.style.visibility = ''; };
    };
    img.onerror = function(){ Toast.show('图片加载失败，请换一张试试', 'error'); if (input) input.value = ''; };
    img.src = e.target.result;
  };
  reader.onerror = function(){ Toast.show('图片读取失败', 'error'); if (input) input.value = ''; };
  reader.readAsDataURL(file);
}

function applyCropView(){
  if (!_crop) return;
  var w = _crop.baseW * _crop.zoom / 100;
  var h = _crop.baseH * _crop.zoom / 100;
  var el = document.getElementById('crop-img');
  el.style.width = w + 'px';
  el.style.height = h + 'px';
  el.style.left = _crop.left + 'px';
  el.style.top = _crop.top + 'px';
}

function clampCropPos(){
  if (!_crop) return;
  var w = _crop.baseW * _crop.zoom / 100;
  var h = _crop.baseH * _crop.zoom / 100;
  // 图片必须完全覆盖圆形区
  _crop.left = Math.min(0, Math.max(CROP_SIZE - w, _crop.left));
  _crop.top = Math.min(0, Math.max(CROP_SIZE - h, _crop.top));
}

(function(){
  var stage = document.getElementById('crop-stage');
  if (!stage) return;
  var dragging = null;
  stage.addEventListener('pointerdown', function(e){
    if (!_crop) return;
    dragging = { x: e.clientX - _crop.left, y: e.clientY - _crop.top };
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove', function(e){
    if (!dragging) return;
    _crop.left = e.clientX - dragging.x;
    _crop.top = e.clientY - dragging.y;
    clampCropPos();
    applyCropView();
  });
  stage.addEventListener('pointerup', function(){ dragging = null; });
  stage.addEventListener('pointercancel', function(){ dragging = null; });
  document.getElementById('crop-zoom').addEventListener('input', function(){
    if (!_crop) return;
    // 以圆心为锚点缩放
    var oldW = _crop.baseW * _crop.zoom / 100;
    var oldH = _crop.baseH * _crop.zoom / 100;
    _crop.zoom = parseInt(this.value, 10);
    var newW = _crop.baseW * _crop.zoom / 100;
    var newH = _crop.baseH * _crop.zoom / 100;
    _crop.left += (oldW - newW) / 2;
    _crop.top += (oldH - newH) / 2;
    clampCropPos();
    applyCropView();
  });
})();

function closeCrop(){
  document.getElementById('crop-modal').classList.remove('show');
  if (_crop && _crop.input) _crop.input.value = '';
  _crop = null;
}

function confirmCrop(){
  if (!_crop) return;
  var img = _crop.img;
  var w = _crop.baseW * _crop.zoom / 100;   // CSS 显示尺寸
  var h = _crop.baseH * _crop.zoom / 100;
  // CSS 坐标 → 原始像素坐标（drawImage 源坐标为图片原始尺寸）
  var sx = -_crop.left * (img.naturalWidth / w);
  var sy = -_crop.top * (img.naturalHeight / h);
  var sw = CROP_SIZE * (img.naturalWidth / w);
  var sh = CROP_SIZE * (img.naturalHeight / h);
  var canvas = document.createElement('canvas');
  canvas.width = EXPORT_SIZE;
  canvas.height = EXPORT_SIZE;
  var ctx = canvas.getContext('2d');
  // 透明背景圆形裁剪
  ctx.clearRect(0, 0, EXPORT_SIZE, EXPORT_SIZE);
  ctx.beginPath();
  ctx.arc(EXPORT_SIZE / 2, EXPORT_SIZE / 2, EXPORT_SIZE / 2, 0, Math.PI * 2);
  ctx.clip();
  ctx.drawImage(img, sx, sy, sw, sh, 0, 0, EXPORT_SIZE, EXPORT_SIZE);
  var input = _crop.input;
  canvas.toBlob(function(blob){
    if (!blob) { Toast.show('裁剪失败，请重试', 'error'); return; }
    var fd = new FormData();
    fd.append('avatar', blob, 'avatar.png');
    fetch('/api/auth/avatar', {method:'POST', body: fd})
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d.ok) { Toast.show(d.error || '头像上传失败', 'error'); return; }
        renderAvatar(d.user);
        _currentUser = d.user;
        closeCrop();
      })
      .catch(function(){ Toast.show('网络错误，上传失败', 'error'); });
  }, 'image/png');
}

function deleteAvatar(){
  if (!confirm('确定删除当前头像吗？')) return;
  fetch('/api/auth/avatar', {method:'DELETE'})
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (!d.ok) { Toast.show(d.error || '删除失败', 'error'); return; }
      renderAvatar(d.user);
      _currentUser = d.user;
    })
    .catch(function(){ Toast.show('网络错误，删除失败', 'error'); });
}

function renderUser(user){
  document.getElementById('info-id').textContent = user.id || '—';
  document.getElementById('info-username').textContent = user.username || '—';
  setValue('info-email', user.email);
  setValue('info-phone', user.phone);
  document.getElementById('info-created').textContent = (user.created_at||'').slice(0,10) || '—';
  document.getElementById('info-login').textContent = (user.last_login||'').slice(0,16) || '—';
  setValue('info-bio', user.bio, '暂无简介');

  renderAvatar(user);

  // 真实数据
  document.getElementById('stat-workshop').textContent = user.character_count || 0;
  document.getElementById('stat-posts').textContent = '—';
  document.getElementById('stat-replies').textContent = '—';
  document.getElementById('stat-downloads').textContent = '—';

  // 填充编辑框
  document.getElementById('edit-username').value = user.username || '';
  document.getElementById('edit-email').value = user.email || '';
  document.getElementById('edit-phone').value = user.phone || '';
  document.getElementById('edit-bio').value = user.bio || '';

  loadMyFavorites();
  loadNotifications();
  refreshUnreadCount();
  loadMyComments();
}

function escH(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ━━ 消息通知（被评论/被点赞提醒） ━━ */
var _notifySeen = false;  // 是否已加载过列表（未读红点独立轮询）
function loadNotifications(){
  fetch('/api/notifications').then(function(r){ return r.json(); }).then(function(d){
    var el = document.getElementById('notify-list');
    if (!el) return;
    if (!d.ok) { el.innerHTML = '<div style="color:var(--text-dim);text-align:center;padding:20px;font-size:0.85rem;">请先登录</div>'; return; }
    var list = d.notifications || [];
    if (!list.length) { el.innerHTML = '<div style="color:var(--text-dim);text-align:center;padding:20px;font-size:0.85rem;">暂无消息</div>'; return; }
    el.innerHTML = list.map(function(n){
      var unread = n.read ? '' : ' style="border-left:3px solid var(--red);"';
      var count = n.count || 1;
      var who = count > 1 ? '<b style="color:var(--gold);">' + count + ' 人</b>'
                          : '<b style="color:var(--accent);">' + escH(n.actor || '') + '</b>';
      var icon = n.type === 'mention' ? '@️' : (n.type.indexOf('fav') >= 0 ? '⭐' : (n.type.indexOf('like') >= 0 ? '👍' : '💬'));
      return '<div class="item-row"' + unread + ' style="flex-direction:column;align-items:flex-start;gap:4px;cursor:pointer;" onclick="openNotification(' + n.id + ',\'' + escH(n.link || '') + '\')">' +
        '<div style="display:flex;width:100%;gap:8px;align-items:center;">' +
          '<span>' + icon + '</span>' +
          '<span style="color:var(--text);flex:1;font-size:0.8rem;">' + who + ' ' + escH(n.content) + '</span>' +
          '<span style="color:var(--text-dim);font-size:0.7rem;white-space:nowrap;">' + escH((n.created_at||'').slice(5,16)) + '</span>' +
        '</div>' +
        (n.read ? '' : '<span style="font-size:0.68rem;color:var(--red);padding-left:28px;">未读</span>') +
      '</div>';
    }).join('');
  }).catch(function(){});
  _notifySeen = true;
}
function openNotification(id, link){
  fetch('/api/notifications/read', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id: id})})
    .then(function(){ refreshUnreadCount(); });
  if (link) window.location.href = link;
}
function markAllNotificationsRead(){
  fetch('/api/notifications/read', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({all: true})})
    .then(function(r){ return r.json(); }).then(function(d){
      if (d.ok) { loadNotifications(); refreshUnreadCount(); Toast.show('已全部标记为已读', 'success'); }
    }).catch(function(){});
}
function refreshUnreadCount(){
  fetch('/api/notifications/unread-count').then(function(r){ return r.json(); }).then(function(d){
    var badge = document.getElementById('notify-badge');
    if (!badge) return;
    var c = (d.ok && d.count) ? d.count : 0;
    if (c > 0) { badge.style.display = ''; badge.textContent = c + ' 未读'; }
    else { badge.style.display = 'none'; }
  }).catch(function(){});
}

// 我的收藏
function loadMyFavorites(){
  fetch('/api/favorites').then(function(r){ return r.json(); }).then(function(d){
    var el = document.getElementById('fav-list');
    if (!el) return;
    if (!d.ok || !d.favorites || !d.favorites.length) {
      el.innerHTML = '<div style="color:var(--text-dim);text-align:center;padding:20px;font-size:0.85rem;">暂无收藏</div>';
      return;
    }
    el.innerHTML = d.favorites.map(function(f){
      var icon = f.type === 'post' ? '💬' : '📦';
      var link = f.type === 'post' ? '/post/' + f.item_id : '/workshop/' + f.item_id;
      return '<div class="item-row"><span>'+icon+'</span><a href="'+link+'" style="color:var(--cyan);flex:1;cursor:pointer;">'+escH(f.title)+'</a><span style="color:var(--text-dim);font-size:0.72rem;">'+(f.author||'')+' · '+(f.created_at||'').slice(0,10)+'</span></div>';
    }).join('');
  }).catch(function(){});
}

// 我的评论
function loadMyComments(){
  fetch('/api/my/comments').then(function(r){ return r.json(); }).then(function(d){
    var el = document.getElementById('mycmt-list');
    if (!el) return;
    if (!d.ok || !d.comments || !d.comments.length) {
      el.innerHTML = '<div style="color:var(--text-dim);text-align:center;padding:20px;font-size:0.85rem;">暂无评论</div>';
      return;
    }
    el.innerHTML = d.comments.map(function(c){
      var icon = c.type === 'post' ? '💬' : '📦';
      return '<div class="item-row" style="flex-direction:column;align-items:flex-start;gap:4px;">' +
        '<div style="display:flex;width:100%;gap:8px;"><span>'+icon+'</span><span style="color:var(--cyan);flex:1;font-size:0.8rem;">'+escH(c.parent_title)+'</span><span style="color:var(--text-dim);font-size:0.7rem;">'+(c.created_at||'').slice(0,16)+'</span></div>' +
        '<div style="color:var(--text-dim);font-size:0.78rem;padding-left:24px;">'+escH(c.content)+'</div></div>';
    }).join('');
  }).catch(function(){});
}

function setValue(id, val, emptyText){
  var el = document.getElementById(id);
  if (!el) return;
  if (val) { el.textContent = val; el.classList.remove('empty'); }
  else { el.textContent = emptyText || '未设置'; el.classList.add('empty'); }
}

// 编辑弹窗
function showEditModal(){ document.getElementById('edit-modal').classList.add('show'); }
function hideEditModal(){ document.getElementById('edit-modal').classList.remove('show'); }
document.getElementById('edit-modal').addEventListener('click',function(e){ if(e.target===this)hideEditModal(); });

function saveProfile(){
  var data = {
    username: document.getElementById('edit-username').value.trim(),
    email: document.getElementById('edit-email').value.trim(),
    phone: document.getElementById('edit-phone').value.trim(),
    bio: document.getElementById('edit-bio').value.trim(),
  };
  fetch('/api/auth/update-profile', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(data),
  }).then(function(r){ return r.json(); }).then(function(d){
    if (!d.ok) { Toast.show(d.error, "error"); return; }
    hideEditModal();
    renderUser(d.user);
  }).catch(function(e){ Toast.show('保存失败: ' + e.message, 'error'); });
}

function doLogout(){
  fetch('/api/auth/logout', {method:'POST'}).then(function(){
    window.location.href = '/';
  }).catch(function(){ window.location.href = '/'; });
}
