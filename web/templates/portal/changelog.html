<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>更新日志 — 尘封之卷</title>
<style>
:root, [data-theme='dark'] {
  --bg: #0a0a14; --surface: #12122a; --surface2: #1a1a36;
  --text: #e0e0e0; --text-dim: #888; --text-light: #666;
  --accent: #e94460; --accent-light: rgba(233,68,96,0.12);
  --gold: #ffd700; --green: #4caf50; --red: #f44336;
  --cyan: #00bcd4; --border: #2a2a40; --border-light: #1e1e3a;
}
[data-theme='light'] {
  --bg: #f5f0eb; --surface: #fffef9; --surface2: #f0ebe3;
  --text: #2c2416; --text-dim: #8b7355; --text-light: #b8a88a;
  --accent: #c0392b; --accent-light: rgba(192,57,43,0.08);
  --gold: #8b6914; --green: #2d7d46; --red: #c0392b;
  --cyan: #1a7a8a; --border: #d4c8b8; --border-light: #e8ddd0;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;}
a{color:var(--cyan);text-decoration:none;}a:hover{text-decoration:underline;}

/* ━━ 导航栏 ━━ */
.navbar{background:var(--surface);border-bottom:2px solid var(--accent);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;}
.nav-brand{font-size:0.9rem;font-weight:bold;color:var(--gold);text-decoration:none;display:flex;align-items:center;gap:6px;}
.nav-links{display:flex;gap:4px;align-items:center;}
.nav-links a{color:var(--text-dim);text-decoration:none;padding:6px 12px;border-radius:4px;font-size:0.82rem;}
.nav-links a:hover,.nav-links a.active{color:var(--text);background:var(--surface2);}

/* ━━ 主体 ━━ */
.container{max-width:860px;margin:0 auto;padding:24px 16px;}
.page-title{font-size:1.3rem;font-weight:bold;color:var(--gold);margin-bottom:20px;padding-bottom:10px;border-bottom:2px solid var(--accent);}

.back-link{display:inline-block;margin-bottom:16px;padding:6px 14px;border:1px solid var(--border);border-radius:4px;font-size:0.8rem;color:var(--text-dim);cursor:pointer;transition:all 0.2s;}
.back-link:hover{color:var(--gold);border-color:var(--accent);}
.expand-bar{display:flex;justify-content:flex-end;margin-bottom:12px;}
.expand-bar button{padding:4px 12px;border:1px solid var(--border);border-radius:4px;background:var(--surface);color:var(--text-dim);font-size:0.78rem;cursor:pointer;transition:all 0.2s;}
.expand-bar button:hover{color:var(--gold);border-color:var(--accent);}

/* ━━ 日期分组 ━━ */
.date-group{margin-bottom:20px;}
.date-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.date-head .date-line{flex:1;height:1px;background:var(--border);}
.date-head .date-label{font-size:0.82rem;font-weight:bold;color:var(--accent);white-space:nowrap;}
.date-head .date-count{font-size:0.72rem;color:var(--text-dim);}

/* ━━ 日志卡片 ━━ */
.cl-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:10px;overflow:hidden;transition:border-color 0.2s;}
.cl-card:hover{border-color:var(--accent);}
.cl-head{padding:10px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;}
.cl-head .cl-icon{font-size:1rem;flex-shrink:0;}
.cl-head .cl-title{flex:1;font-size:0.88rem;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cl-head .cl-seq{font-size:0.7rem;color:var(--text-light);flex-shrink:0;}
.cl-head .cl-arrow{font-size:0.72rem;color:var(--text-dim);transition:transform 0.2s;flex-shrink:0;}
.cl-card.open .cl-arrow{transform:rotate(90deg);}
.cl-body{display:none;padding:12px 16px 16px;border-top:1px solid var(--border);font-size:0.8rem;line-height:1.8;color:var(--text);white-space:pre-wrap;word-break:break-word;}
.cl-card.open .cl-body{display:block;}
.cl-body .cl-loading{color:var(--text-dim);}

.empty-box{padding:48px 20px;text-align:center;color:var(--text-dim);font-size:0.9rem;}
.empty-box .empty-icon{font-size:2.6rem;display:block;margin-bottom:10px;opacity:0.5;}

.theme-toggle{position:fixed;bottom:20px;right:20px;z-index:9999;width:40px;height:40px;border-radius:50%;border:2px solid var(--accent);background:var(--surface);color:var(--gold);cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(0,0,0,0.2);transition:all 0.3s;}
.theme-toggle:hover{transform:scale(1.1);}
</style>
  <script src="/static/online-presence.js"></script>
  <script src="/static/common-error-handler.js"></script>
</head>
<body>

<nav class="navbar">
  <a href="/" class="nav-brand">
    <svg viewBox="0 0 100 100" width="14" height="14" style="vertical-align:middle;" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="bsg3" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#f6d365"/><stop offset="40%" style="stop-color:#fda085"/><stop offset="100%" style="stop-color:#f6d365"/></linearGradient></defs><rect x="20" y="20" width="60" height="60" fill="none" stroke="url(#bsg3)" stroke-width="3"/><rect x="20" y="20" width="60" height="60" transform="rotate(45,50,50)" fill="none" stroke="url(#bsg3)" stroke-width="3"/><circle cx="50" cy="50" r="5" fill="url(#bsg3)"/></svg>
    尘封之卷
  </a>
  <div class="nav-links">
    <a href="/">首页</a>
    <a href="/user">用户中心</a>
    <a href="/announcements">平台公告</a>
    <a href="/changelog" class="active">更新日志</a>
    <a href="/guide">新手指南</a>
  </div>
</nav>

<div class="container">
  <h1 class="page-title">📜 历史版本更新</h1>
  <a href="/" class="back-link">← 返回首页</a>
  <div class="expand-bar">
    <button id="expand-all-btn" onclick="toggleExpandAll()">▾ 全部展开</button>
  </div>
  <div id="cl-list">
    <div class="empty-box"><span class="empty-icon">📡</span>更新日志加载中...</div>
  </div>
</div>

<script>
function escH(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
var CL_ENTRIES = [];
var CL_LOADED = {};   // filename → content
var CL_ALL_OPEN = false;

(function(){
  fetch('/api/changelog').then(function(r){ return r.json(); }).then(function(d){
    var box = document.getElementById('cl-list');
    if (!box) return;
    CL_ENTRIES = (d.ok && d.entries) ? d.entries : [];
    if (!CL_ENTRIES.length) {
      box.innerHTML = '<div class="empty-box"><span class="empty-icon">🕊️</span>暂无更新日志</div>';
      return;
    }
    // 按日期分组（entries 已按日期+序号倒序）
    var groups = [];
    CL_ENTRIES.forEach(function(e){
      var g = groups[groups.length - 1];
      if (!g || g.date !== e.date) { g = {date: e.date, items: []}; groups.push(g); }
      g.items.push(e);
    });
    box.innerHTML = groups.map(function(g){
      return '<div class="date-group">' +
        '<div class="date-head"><span class="date-label">📅 ' + g.date + '</span><span class="date-count">' + g.items.length + ' 条更新</span><div class="date-line"></div></div>' +
        g.items.map(function(e){
          return '<div class="cl-card" id="cl-card-' + e.seq + '-' + escH(e.date) + '" data-filename="' + escH(e.filename) + '">' +
            '<div class="cl-head" onclick="toggleClCard(this.parentElement)">' +
              '<span class="cl-icon">📜</span>' +
              '<span class="cl-title">' + escH(e.title) + '</span>' +
              '<span class="cl-seq">#' + e.seq + '</span>' +
              '<span class="cl-arrow">▶</span>' +
            '</div>' +
            '<div class="cl-body"><div class="cl-loading">加载中...</div></div>' +
          '</div>';
        }).join('') +
      '</div>';
    }).join('');
  }).catch(function(){
    var box = document.getElementById('cl-list');
    if (box) box.innerHTML = '<div class="empty-box"><span class="empty-icon">⚠️</span>更新日志加载失败，请稍后重试</div>';
  });
})();

// 展开/收起单个日志（内容懒加载，加载后缓存）
function toggleClCard(card) {
  if (!card) return;
  var isOpen = card.classList.toggle('open');
  if (!isOpen) return;
  var filename = card.dataset.filename;
  var body = card.querySelector('.cl-body');
  if (!body) return;
  if (CL_LOADED[filename] !== undefined) {
    body.textContent = CL_LOADED[filename];
    return;
  }
  fetch('/api/changelog/' + encodeURIComponent(filename)).then(function(r){ return r.json(); }).then(function(d){
    if (d.ok) {
      CL_LOADED[filename] = d.content || '';
      if (card.classList.contains('open')) body.textContent = CL_LOADED[filename];
    } else {
      if (card.classList.contains('open')) body.textContent = '读取失败：' + (d.error || '未知错误');
    }
  }).catch(function(){
    if (card.classList.contains('open')) body.textContent = '读取失败，请稍后重试';
  });
}

// 全部展开/收起（展开时懒加载全部内容）
function toggleExpandAll() {
  CL_ALL_OPEN = !CL_ALL_OPEN;
  var btn = document.getElementById('expand-all-btn');
  if (btn) btn.textContent = CL_ALL_OPEN ? '▴ 全部收起' : '▾ 全部展开';
  document.querySelectorAll('.cl-card').forEach(function(card){
    if (CL_ALL_OPEN) {
      card.classList.add('open');
      toggleClCard(card);
    } else {
      card.classList.remove('open');
    }
  });
}
</script>

<button class="theme-toggle" onclick="toggleTheme()" title="切换深色/浅色模式">🌓</button>
<script>
function toggleTheme(){var t=document.documentElement;var cur=t.getAttribute('data-theme')||'dark';var next=cur==='dark'?'light':'dark';t.setAttribute('data-theme',next);var btn=document.querySelector('.theme-toggle');btn.textContent=next==='dark'?'🌓':'☀️';localStorage.setItem('theme',next);}
(function(){var saved=localStorage.getItem('theme')||'dark';document.documentElement.setAttribute('data-theme',saved);var btn=document.querySelector('.theme-toggle');if(btn)btn.textContent=saved==='dark'?'🌓':'☀️';})();
</script>
    <script src="/static/announcement-banner.js"></script>
</body>
</html>
