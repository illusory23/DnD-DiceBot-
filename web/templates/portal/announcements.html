<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>平台公告 — 尘封之卷</title>
<style>
:root, [data-theme='dark'] {
  --bg: #0a0a14; --surface: #12122a; --surface2: #1a1a36;
  --text: #e0e0e0; --text-dim: #888; --text-light: #666;
  --accent: #e94460; --accent-light: rgba(233,68,96,0.12);
  --gold: #ffd700; --green: #4caf50; --red: #f44336;
  --cyan: #00bcd4; --border: #2a2a40; --border-light: #1e1e3a;
}
[data-theme='light'] {
  --bg: #f5f0eb; --surface: #fffef9; --surface2: #f0ebe3;
  --text: #2c2416; --text-dim: #8b7355; --text-light: #b8a88a;
  --accent: #c0392b; --accent-light: rgba(192,57,43,0.08);
  --gold: #8b6914; --green: #2d7d46; --red: #c0392b;
  --cyan: #1a7a8a; --border: #d4c8b8; --border-light: #e8ddd0;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;}
a{color:var(--cyan);text-decoration:none;}a:hover{text-decoration:underline;}

/* ━━ 导航栏 ━━ */
.navbar{background:var(--surface);border-bottom:2px solid var(--accent);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;}
.nav-brand{font-size:0.9rem;font-weight:bold;color:var(--gold);text-decoration:none;display:flex;align-items:center;gap:6px;}
.nav-links{display:flex;gap:4px;align-items:center;}
.nav-links a{color:var(--text-dim);text-decoration:none;padding:6px 12px;border-radius:4px;font-size:0.82rem;}
.nav-links a:hover,.nav-links a.active{color:var(--text);background:var(--surface2);}

/* ━━ 主体 ━━ */
.container{max-width:860px;margin:0 auto;padding:24px 16px;}
.page-title{font-size:1.3rem;font-weight:bold;color:var(--gold);margin-bottom:20px;padding-bottom:10px;border-bottom:2px solid var(--accent);}

/* ━━ 公告卡片 ━━ */
.ann-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:14px;overflow:hidden;transition:border-color 0.2s;}
.ann-card:hover{border-color:var(--accent);}
.ann-head{padding:12px 18px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.ann-head .ann-icon{font-size:1.1rem;flex-shrink:0;}
.ann-head .ann-title{flex:1;font-size:0.95rem;font-weight:600;color:var(--gold);}
.ann-head .ann-date{font-size:0.72rem;color:var(--text-dim);white-space:nowrap;}
.ann-body{padding:14px 18px;font-size:0.88rem;line-height:1.9;color:var(--text);white-space:pre-wrap;word-break:break-word;}

.empty-box{padding:48px 20px;text-align:center;color:var(--text-dim);font-size:0.9rem;}
.empty-box .empty-icon{font-size:2.6rem;display:block;margin-bottom:10px;opacity:0.5;}

.back-link{display:inline-block;margin-bottom:16px;padding:6px 14px;border:1px solid var(--border);border-radius:4px;font-size:0.8rem;color:var(--text-dim);cursor:pointer;transition:all 0.2s;}
.back-link:hover{color:var(--gold);border-color:var(--accent);}

.theme-toggle{position:fixed;bottom:20px;right:20px;z-index:9999;width:40px;height:40px;border-radius:50%;border:2px solid var(--accent);background:var(--surface);color:var(--gold);cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(0,0,0,0.2);transition:all 0.3s;}
.theme-toggle:hover{transform:scale(1.1);}
</style>
  <script src="/static/online-presence.js"></script>
  <script src="/static/common-error-handler.js"></script>
<script src="/static/common-dialog.js"></script>
</head>
<body>

<nav class="navbar">
  <a href="/" class="nav-brand">
    <svg viewBox="0 0 100 100" width="14" height="14" style="vertical-align:middle;" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="bsg2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#f6d365"/><stop offset="40%" style="stop-color:#fda085"/><stop offset="100%" style="stop-color:#f6d365"/></linearGradient></defs><rect x="20" y="20" width="60" height="60" fill="none" stroke="url(#bsg2)" stroke-width="3"/><rect x="20" y="20" width="60" height="60" transform="rotate(45,50,50)" fill="none" stroke="url(#bsg2)" stroke-width="3"/><circle cx="50" cy="50" r="5" fill="url(#bsg2)"/></svg>
    尘封之卷
  </a>
  <div class="nav-links">
    <a href="/">首页</a>
    <a href="/user">用户中心</a>
    <a href="/announcements" class="active">平台公告</a>
    <a href="/changelog">更新日志</a>
    <a href="/guide">新手指南</a>
  </div>
</nav>

<div class="container">
  <h1 class="page-title">📢 平台公告</h1>
  <a href="/" class="back-link">← 返回首页</a>
  <div id="ann-list">
    <div class="empty-box"><span class="empty-icon">📡</span>公告加载中...</div>
  </div>
</div>

<script>
function escH(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
(function(){
  fetch('/api/announcements/history').then(function(r){ return r.json(); }).then(function(d){
    var box = document.getElementById('ann-list');
    if (!box) return;
    var anns = (d.ok && d.announcements) ? d.announcements : [];
    if (!anns.length) {
      box.innerHTML = '<div class="empty-box"><span class="empty-icon">🕊️</span>暂无公告，敬请期待</div>';
      return;
    }
    box.innerHTML = anns.map(function(a){
      return '<div class="ann-card">' +
        '<div class="ann-head"><span class="ann-icon">📢</span><span class="ann-title">' + escH(a.title) + '</span><span class="ann-date">' + escH((a.created_at||'').slice(0,16)) + '</span></div>' +
        '<div class="ann-body">' + escH(a.content) + '</div>' +
        '</div>';
    }).join('');
  }).catch(function(){
    var box = document.getElementById('ann-list');
    if (box) box.innerHTML = '<div class="empty-box"><span class="empty-icon">⚠️</span>公告加载失败，请稍后重试</div>';
  });
})();
</script>

<button class="theme-toggle" onclick="toggleTheme()" title="切换深色/浅色模式">🌓</button>
<script>
function toggleTheme(){var t=document.documentElement;var cur=t.getAttribute('data-theme')||'dark';var next=cur==='dark'?'light':'dark';t.setAttribute('data-theme',next);var btn=document.querySelector('.theme-toggle');btn.textContent=next==='dark'?'🌓':'☀️';localStorage.setItem('theme',next);}
(function(){var saved=localStorage.getItem('theme')||'dark';document.documentElement.setAttribute('data-theme',saved);var btn=document.querySelector('.theme-toggle');if(btn)btn.textContent=saved==='dark'?'🌓':'☀️';})();
</script>
    <script src="/static/announcement-banner.js"></script>
</body>
</html>
