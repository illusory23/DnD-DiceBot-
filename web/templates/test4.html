<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>❄️ 北境 · 苍白大地</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #bgVideo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            display: block;
        }

        #staticBgCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            display: none;
        }

        #snowCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
            opacity: 0;
            transition: opacity 3s ease-out;
        }

        #auroraCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            opacity: 0;
            transition: opacity 4s ease-out;
        }

        .main-title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(2rem, 8vw, 5rem);
            color: #ffffff;
            text-shadow: 0 0 15px #bce0ff, 0 0 30px #74b9ff;
            letter-spacing: 6px;
            z-index: 10;
            opacity: 1;
            transition: opacity 2s ease-out;
            white-space: nowrap;
        }

        .main-title.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .loading-box {
            position: absolute;
            inset: 0;
            background: #0c1622;
            z-index: 99;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #d0e8ff;
            gap: 20px;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(180, 220, 255, 0.2);
            border-top-color: #88ccff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-tip {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff8888;
            font-size: 18px;
            text-align: center;
            z-index: 100;
            padding: 24px;
            background: rgba(0,0,0,0.7);
            border-radius: 12px;
            line-height: 1.7;
        }

        .loading-box.hidden {
            display: none;
        }

        .brand-link {
            position: absolute;
            top: 16px;
            left: 20px;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            padding: 8px 14px;
            background: rgba(10, 10, 20, 0.75);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 6px;
            backdrop-filter: blur(6px);
            transition: all 0.3s;
        }

        .brand-link:hover {
            background: rgba(18, 18, 42, 0.9);
            border-color: rgba(255, 215, 0, 0.6);
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.2);
        }

        .brand-link .brand-icon {
            width: 28px;
            height: 28px;
            flex-shrink: 0;
        }

        .brand-link .brand-text {
            font-size: 0.9rem;
            font-weight: bold;
            color: #ffd700;
            letter-spacing: 1px;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        /* ━━ 声音开启提示 ━━ */
        .sound-prompt {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 28px;
            background: rgba(10, 16, 34, 0.85);
            border: 2px solid rgba(140, 200, 240, 0.5);
            border-radius: 30px;
            cursor: pointer;
            color: #c8dff8;
            font-size: 1rem;
            letter-spacing: 2px;
            backdrop-filter: blur(8px);
            transition: all 0.3s;
            animation: soundPulse 2.5s ease-in-out infinite;
            user-select: none;
        }
        .sound-prompt:hover {
            background: rgba(20, 30, 60, 0.9);
            border-color: rgba(180, 220, 255, 0.8);
            color: #e8f4ff;
            box-shadow: 0 0 30px rgba(100, 170, 230, 0.35);
            transform: translateX(-50%) scale(1.03);
        }
        .sound-prompt.hidden { display: none; }
        @keyframes soundPulse {
            0%, 100% { box-shadow: 0 0 16px rgba(100, 160, 220, 0.2); }
            50% { box-shadow: 0 0 32px rgba(140, 200, 240, 0.45); }
        }
        .sound-icon {
            font-size: 1.5rem;
            animation: soundIconBounce 1.2s ease-in-out infinite;
        }
        @keyframes soundIconBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
    </style>
  <script src="/static/common-dialog.js"></script>
</head>
<body>
    <div class="container">
        <a class="brand-link" href="/" title="返回官网">
            <svg class="brand-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#f6d365"/>
                        <stop offset="40%" style="stop-color:#fda085"/>
                        <stop offset="100%" style="stop-color:#f6d365"/>
                    </linearGradient>
                </defs>
                <rect x="20" y="20" width="60" height="60" fill="none" stroke="url(#bg)" stroke-width="3"/>
                <rect x="20" y="20" width="60" height="60" transform="rotate(45,50,50)" fill="none" stroke="url(#bg)" stroke-width="3"/>
                <circle cx="50" cy="14" r="2.5" fill="url(#bg)"/>
                <circle cx="76" cy="24" r="2.5" fill="url(#bg)"/>
                <circle cx="86" cy="50" r="2.5" fill="url(#bg)"/>
                <circle cx="76" cy="76" r="2.5" fill="url(#bg)"/>
                <circle cx="50" cy="86" r="2.5" fill="url(#bg)"/>
                <circle cx="24" cy="76" r="2.5" fill="url(#bg)"/>
                <circle cx="14" cy="50" r="2.5" fill="url(#bg)"/>
                <circle cx="24" cy="24" r="2.5" fill="url(#bg)"/>
                <circle cx="50" cy="50" r="5" fill="url(#bg)"/>
            </svg>
            <span class="brand-text">尘封之卷</span>
        </a>

        <video id="bgVideo" preload="auto" muted playsinline webkit-playsinline>
            <source src="/static/portal/snow.mp4" type="video/mp4">
        </video>

        <canvas id="staticBgCanvas"></canvas>
        <canvas id="auroraCanvas"></canvas>
        <canvas id="snowCanvas"></canvas>

        <h1 class="main-title">❄️ 北境 · 苍白大地</h1>

        <div class="loading-box" id="loadingWrap">
            <div class="loading-spinner"></div>
            <p>北境雪原加载中...</p>
        </div>

        <div class="error-tip" id="errorBox">
            视频文件「snow.mp4」加载失败<br>
            请确认视频文件已部署到服务器静态目录
        </div>

        <!-- 点击开启声音提示 -->
        <div class="sound-prompt" id="soundPrompt" onclick="enableSound()">
            <span class="sound-icon">🔇</span>
            <span>点击此处开启声音</span>
        </div>
    </div>

    <script>
        const video = document.getElementById('bgVideo');
        const staticCanvas = document.getElementById('staticBgCanvas');
        const staticCtx = staticCanvas.getContext('2d');
        const snowCanvas = document.getElementById('snowCanvas');
        const snowCtx = snowCanvas.getContext('2d');
        const auroraCanvas = document.getElementById('auroraCanvas');
        const auroraCtx = auroraCanvas.getContext('2d');
        const title = document.querySelector('.main-title');
        const loadingWrap = document.getElementById('loadingWrap');
        const errorBox = document.getElementById('errorBox');

        let videoEnded = false;
        let animationId = null;
        let auroraTime = 0;

        function resizeCanvas() {
            const w = window.innerWidth;
            const h = window.innerHeight;

            staticCanvas.width = w;
            staticCanvas.height = h;

            snowCanvas.width = w;
            snowCanvas.height = h;

            auroraCanvas.width = w;
            auroraCanvas.height = h;
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // 标题：3秒后开始淡出，2秒后完全隐藏
        setTimeout(() => {
            title.classList.add('fade-out');
            setTimeout(() => title.style.display = 'none', 2000);
        }, 3000);

        video.addEventListener('loadeddata', () => {
            loadingWrap.classList.add('hidden');
            // 视频加载完成后显示声音提示
            document.getElementById('soundPrompt').classList.remove('hidden');
            video.play().catch(err => console.log('播放兜底：', err));
        });

        video.addEventListener('error', () => {
            loadingWrap.classList.add('hidden');
            errorBox.style.display = 'block';
            document.getElementById('soundPrompt').classList.add('hidden');
        });

        // ━━━ 点击开启声音 ━━━
        function enableSound() {
            const prompt = document.getElementById('soundPrompt');
            video.muted = false;
            video.play().then(() => {
                prompt.querySelector('.sound-icon').textContent = '🔊';
                prompt.querySelector('span:last-child').textContent = '声音已开启';
                prompt.style.borderColor = 'rgba(100, 200, 120, 0.6)';
                prompt.style.animation = 'none';
                prompt.style.boxShadow = '0 0 20px rgba(100, 200, 120, 0.3)';
                // 1.5秒后自动隐藏
                setTimeout(() => {
                    prompt.classList.add('hidden');
                }, 1500);
            }).catch(err => {
                console.log('播放失败：', err);
                prompt.querySelector('.sound-icon').textContent = '⚠️';
                prompt.querySelector('span:last-child').textContent = '点击重试开启声音';
            });
        }

        // 视频结束后：截取最后一帧，再逐渐播放风雪和极光
        video.addEventListener('ended', () => {
            videoEnded = true;

            // 截取视频最后一帧作为静态背景
            staticCtx.drawImage(
                video,
                0, 0, video.videoWidth, video.videoHeight,
                0, 0, staticCanvas.width, staticCanvas.height
            );

            video.style.display = 'none';
            staticCanvas.style.display = 'block';
            video.pause();

            // 定格画面出现后，风雪和极光逐渐显现
            setTimeout(() => {
                auroraCanvas.style.opacity = '1';
                snowCanvas.style.opacity = '1';
            }, 600);
        });

        // 风雪粒子
        class Snowflake {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * snowCanvas.width;
                this.y = Math.random() * -snowCanvas.height;
                this.radius = Math.random() * 2.2 + 0.6;
                this.speedY = Math.random() * 2.2 + 1.2;
                this.speedX = Math.random() * 1.2 - 0.6;
                this.opacity = Math.random() * 0.6 + 0.4;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.y > snowCanvas.height) {
                    this.reset();
                }
            }

            draw() {
                snowCtx.beginPath();
                snowCtx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                snowCtx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                snowCtx.fill();
            }
        }

        const snowList = [];
        const snowCount = Math.floor(window.innerWidth * 0.4);

        for (let i = 0; i < snowCount; i++) {
            snowList.push(new Snowflake());
        }

        // 极光：只在画面偏上方出现
        function drawAurora() {
            auroraCtx.clearRect(0, 0, auroraCanvas.width, auroraCanvas.height);

            auroraTime += 0.0035;

            const w = auroraCanvas.width;
            const h = auroraCanvas.height;

            // 极光主体集中在画面上方 15% ~ 45% 区域
            const topArea = h * 0.15;
            const bottomArea = h * 0.45;
            const midY = (topArea + bottomArea) / 2;

            const layers = [
                { color: 'rgba(80, 220, 180, 0.28)', offset: 0 },
                { color: 'rgba(120, 200, 255, 0.22)', offset: 1.3 },
                { color: 'rgba(190, 140, 255, 0.18)', offset: 2.6 }
            ];

            layers.forEach(layer => {
                auroraCtx.beginPath();
                auroraCtx.moveTo(0, bottomArea);

                for (let x = 0; x <= w; x += 10) {
                    const wave = Math.sin(x * 0.018 + auroraTime + layer.offset) * 55
                               + Math.sin(x * 0.007 + auroraTime * 0.65) * 35;

                    const y = midY + wave;
                    auroraCtx.lineTo(x, y);
                }

                auroraCtx.lineTo(w, bottomArea);
                auroraCtx.lineTo(w, topArea);
                auroraCtx.lineTo(0, topArea);
                auroraCtx.closePath();

                auroraCtx.fillStyle = layer.color;
                auroraCtx.fill();
            });

            // 顶部柔光
            const topGlow = auroraCtx.createLinearGradient(0, 0, 0, h * 0.5);
            topGlow.addColorStop(0, 'rgba(180, 220, 255, 0.35)');
            topGlow.addColorStop(0.4, 'rgba(180, 220, 255, 0.18)');
            topGlow.addColorStop(1, 'rgba(180, 220, 255, 0)');

            auroraCtx.fillStyle = topGlow;
            auroraCtx.fillRect(0, 0, w, h * 0.5);
        }

        function renderLoop() {
            snowCtx.clearRect(0, 0, snowCanvas.width, snowCanvas.height);

            if (videoEnded) {
                snowList.forEach(s => {
                    s.update();
                    s.draw();
                });

                drawAurora();
            }

            animationId = requestAnimationFrame(renderLoop);
        }

        renderLoop();

        window.addEventListener('beforeunload', () => {
            cancelAnimationFrame(animationId);
        });
    </script>
</body>
</html>
