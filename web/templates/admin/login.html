<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录 — 尘封之卷</title>
    <link rel="stylesheet" href="/static/admin/admin.css">
  <script src="/static/common-dialog.js"></script>
</head>
<body>
<div class="login-page">
    <div class="login-card">
        <h1>🔒 尘封之卷</h1>
        <p class="login-subtitle">管理员后台</p>
        <div class="form-error" id="login-error"></div>
        <div class="form-group">
            <label>用户名</label>
            <input type="text" id="login-username" placeholder="请输入管理员账号" autofocus>
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" id="login-password" placeholder="请输入密码">
        </div>
        <button class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;" id="btn-login">
            登 录
        </button>
        <p style="text-align:center;margin-top:16px;font-size:12px;color:var(--text-muted);">
            此页面仅限管理员访问
        </p>
    </div>
</div>
<script src="/static/admin/admin.js"></script>
<script>
document.getElementById('btn-login').addEventListener('click', async () => {
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value.trim();
    const errorEl = document.getElementById('login-error');

    if (!username || !password) {
        errorEl.textContent = '请填写用户名和密码';
        return;
    }
    errorEl.textContent = '';
    const btn = document.getElementById('btn-login');
    btn.disabled = true;
    btn.textContent = '登录中...';

    try {
        const resp = await fetch('/admin/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password }),
        });
        const data = await resp.json();
        if (data.ok) {
            window.location.href = '/admin/';
        } else {
            errorEl.textContent = data.error || '登录失败';
        }
    } catch (e) {
        errorEl.textContent = '网络错误，请重试';
    } finally {
        btn.disabled = false;
        btn.textContent = '登 录';
    }
});

// 回车触发登录
document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('btn-login').click();
});
</script>
</body>
</html>
